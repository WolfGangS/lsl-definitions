  - name: __concat
    comment: "Defines behavior for the concatenation (..) operator."
    type: "(left: any, right: any) -> any"
    parameters:
      - name: left
        type: any
        comment: "Left operand or object to concatenate."
      - name: right
        type: any
        comment: "Right operand or object to concatenate."
    return-type: any
  - name: __div
    comment: "Defines behavior for the division (/) operator."
    type: "(left: any, right: any) -> any"
    parameters:
      - name: left
        type: any
        comment: "Left operand of the division (dividend)."
      - name: right
        type: any
        comment: "Right operand of the division (divisor)."
    return-type: any
  - name: __eq
    comment: "Defines behavior for the equality (==) operator."
    type: "(left: {}, right: {}) -> boolean"
    parameters:
      - name: left
        type: '{}'
        comment: "First value to compare."
      - name: right
        type: '{}'
        comment: "Second value to compare."
    return-type: boolean
  - name: __idiv
    comment: "Defines behavior for the floor division (//) operator."
    type: "(left: any, right: any) -> any"
    parameters:
      - name: left
        type: any
        comment: "Left operand of the floor division."
      - name: right
        type: any
        comment: "Right operand of the floor division."
    return-type: any
  - name: __index
    comment: "Called when looking up a key that does not exist in the table."
    type: "((self: {}, key: any) -> any) | { [any]: any }"
    parameters:
      - name: self
        type: '{}'
        comment: "Table being accessed."
      - name: key
        type: any
        comment: "Key that was not found in the table."
    return-type: any
    variants:
      - comment: "Called as a function fallback when looking up a key that does not exist in the table."
        type: "(self: {}, key: any) -> any"
        parameters:
          - name: self
            type: '{}'
            comment: "Table being accessed."
          - name: key
            type: any
            comment: "Key that was not found in the table."
        return-type: any
      - comment: "A fallback dictionary/table used to search for missing keys."
        type: "{ [any]: any }"
        return-type: any
  - name: __iter
    comment: "Called before generalized iteration begins on a table or userdata. Returns an iterator generator function, a state object, and an initial control variable."
    type-parameters: [S, K, V...]
    type: "<S, K, V...>(self: {}) -> ((state: S, index: K) -> (K?, V...), S, K)"
    parameters:
      - name: self
        type: '{}'
        comment: "Table or object being iterated."
    return-type: "((state: S, index: K) -> (K?, V...), S, K)"
  - name: __jsonhint
    comment: "String property used by lljson.encode to enforce table formatting rules."
    type: '"array" | "object"'
  - name: __le
    comment: "Defines behavior for the less-than-or-equal-to (<=) operator."
    type: "(left: {}, right: {}) -> boolean"
    parameters:
      - name: left
        type: '{}'
        comment: "Left operand of the comparison."
      - name: right
        type: '{}'
        comment: "Right operand of the comparison."
    return-type: boolean
  - name: __len
    comment: "Defines behavior for the length (#) operator."
    type: "(self: {}) -> number"
    parameters:
      - name: self
        type: '{}'
        comment: "Object whose length is being measured."
    return-type: number
  - name: __lt
    comment: "Defines behavior for the less-than (<) operator."
    type: "(left: {}, right: {}) -> boolean"
    parameters:
      - name: left
        type: '{}'
        comment: "Left operand of the comparison."
      - name: right
        type: '{}'
        comment: "Right operand of the comparison."
    return-type: boolean
  - name: __metatable
    comment: "Protects the metatable. If present, getmetatable returns this value, and setmetatable will raise an error."
    type: any
  - name: __mod
    comment: "Defines behavior for the modulo (%) operator."
    type: "(left: any, right: any) -> any"
    parameters:
      - name: left
        type: any
        comment: "Left operand (dividend)."
      - name: right
        type: any
        comment: "Right operand (divisor)."
    return-type: any
  - name: __mode
    comment: "Controls weak mapping of table elements. Valid values are 'k' (weak keys), 'v' (weak values), or 'kv' (both)."
    type: '"k" | "v" | "kv"'
  - name: __mul
    comment: "Defines behavior for the multiplication (*) operator."
    type: "(left: any, right: any) -> any"
    parameters:
      - name: left
        type: any
        comment: "Left operand of the multiplication."
      - name: right
        type: any
        comment: "Right operand of the multiplication."
    return-type: any
  - name: __newindex
    comment: "Called when assigning a value to a key that does not exist in the table."
    type: "((self: {}, key: any, value: any) -> ()) | { [any]: any }"
    parameters:
      - name: self
        type: '{}'
        comment: "Table being assigned."
      - name: key
        type: any
        comment: "Key being assigned."
      - name: value
        type: any
        comment: "Value being assigned to the key."
    return-type: "()"
    variants:
      - comment: "Called as a function fallback when assigning a value to a key that does not exist in the table."
        type: "(self: {}, key: any, value: any) -> ()"
        parameters:
          - name: self
            type: '{}'
            comment: "Table being assigned."
          - name: key
            type: any
            comment: "Key being created."
          - name: value
            type: any
            comment: "Value being assigned to the key."
        return-type: "()"
      - comment: "A fallback dictionary/table where new key-value assignments are forwarded."
        type: "{ [any]: any }"
        return-type: "()"
  - name: __pow
    comment: "Defines behavior for the exponentiation (^) operator."
    type: "(left: any, right: any) -> any"
    parameters:
      - name: left
        type: any
        comment: "Base value."
      - name: right
        type: any
        comment: "Exponent value."
    return-type: any
  - name: __sub
    comment: "Defines behavior for the subtraction (-) operator."
    type: "(left: any, right: any) -> any"
    parameters:
      - name: left
        type: any
        comment: "Left operand of the subtraction (minuend)."
      - name: right
        type: any
        comment: "Right operand of the subtraction (subtrahend)."
    return-type: any
  - name: __tojson
    comment: "Called during JSON serialization (with lljson.encode or lljson.slencode). Returns an alternative representation of the table to be serialized in its place."
    type: '(self: {}, ctx: { mode: "json" | "sljson", tight: boolean }) -> any'
    parameters:
      - name: self
        type: '{}'
        comment: "Table being serialized."
      - name: ctx
        type: '{ mode: "json" | "sljson", tight: boolean }'
        comment: "Context table containing metadata about the current serialization process, including 'mode' ('json' or 'sljson') and 'tight' (boolean)."
    return-type: any
  - name: __tostring
    comment: "Called by tostring to convert the value to a string."
    type: "(self: {}) -> string"
    parameters:
      - name: self
        type: '{}'
        comment: "Object being converted to a string."
    return-type: string
  - name: __unm
    comment: "Defines behavior for the unary negation (-) operator."
    type: "(self: {}) -> any"
    parameters:
      - name: self
        type: '{}'
        comment: "Value being negated."
    return-type: any
