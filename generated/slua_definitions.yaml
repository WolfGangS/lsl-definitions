%YAML 1.2
---
# yaml-language-server: $schema=http://raw.githubusercontent.com/secondlife/lsl-definitions/refs/heads/main/slua_definitions.schema.json
#
# increment only when the file format changes, not just the content
version: 1.0.0
# baseClasses must not depend on anything else in this file (not typeAliases, not classes)
base-classes:
- name: quaternion
  comment: A set of four float values. Used to represent rotations and orientations.
  properties:
  - name: x
    type: number
    comment: X component of the rotation/quaternion.
  - name: "y"
    type: number
    comment: Y component of the rotation/quaternion.
  - name: z
    type: number
    comment: Z component of the rotation/quaternion.
  - name: s
    type: number
    comment: S component of the rotation/quaternion. Equivalent to the W component in other notations.
  methods:
  - name: __add
    parameters:
    - name: self
    - name: other
      type: quaternion
    return-type: quaternion
  - name: __sub
    parameters:
    - name: self
    - name: other
      type: quaternion
    return-type: quaternion
  - name: __mul
    parameters:
    - name: self
    - name: other
      type: quaternion
    return-type: quaternion
  - name: __div
    parameters:
    - name: self
    - name: other
      type: quaternion
    return-type: quaternion
  - name: __unm
    parameters:
    - name: self
    return-type: quaternion
  - name: __eq
    parameters:
    - name: self
    - name: other
      type: quaternion
    return-type: boolean
  - name: __tostring
    parameters:
    - name: self
    return-type: string
- name: uuid
  comment: 'A 128‑bit unique identifier formatted as 36 hexadecimal characters (8‑4‑4‑4‑12), e.g. "A822FF2B-FF02-461D-B45D-DCD10A2DE0C2".'
  properties:
  - name: istruthy
    comment: Returns true if the UUID is not the null UUID (all zeros).
    type: boolean
  - name: bytes
    comment: Returns the raw 16-byte binary string of the UUID.
    type: string
  methods:
  - name: __tostring
    parameters:
    - name: self
    return-type: string
- name: vector
  comment: A set of three float values. Used to represent colors (RGB), positions, directions, and velocities.
  properties:
  - name: x
    type: number
    comment: "X coordinate component of the vector. Typically represents red color, forward position, or pitch."
  - name: "y"
    type: number
    comment: "Y coordinate component of the vector. Typically represents green color, left/right position, or roll."
  - name: z
    type: number
    comment: "Z coordinate component of the vector. Typically represents blue color, altitude/upward position, or yaw."
  methods:
  - name: __add
    comment: Native component-wise addition
    parameters:
    - name: self
    - name: other
      type: vector
    return-type: vector
  - name: __sub
    comment: Native component-wise subtraction
    parameters:
    - name: self
    - name: other
      type: vector
    return-type: vector
  - name: __unm
    comment: Unary negation
    parameters:
    - name: self
    return-type: vector
  - name: __mul
    comment: 'Multiplication: vector * vector / number -> vector (Scale), vector
      * quaternion -> vector (Rotation)'
    parameters:
    - name: self
    - name: other
      type: number | vector | quaternion
    return-type: vector
  - name: __div
    comment: 'Division: vector / number -> vector (Scale), vector / quaternion ->
      vector (Rotation by inverse)'
    parameters:
    - name: self
    - name: other
      type: number | vector | quaternion
    return-type: vector
  - name: __idiv
    comment: 'Floor division: vector // number -> vector (Quantized scale)'
    parameters:
    - name: self
    - name: other
      type: number | vector
    return-type: vector
  - name: __mod
    comment: 'LSL-style modulo: vector % vector -> vector (Cross Product)'
    parameters:
    - name: self
    - name: other
      type: vector
    return-type: vector
  - name: __tostring
    parameters:
    - name: self
    return-type: string
- name: DetectedEvent
  comment: Event detection class providing access to detected object/avatar information
  # auto-generated from lsl_definitions.yaml
  properties:
  - name: index
    type: number
    comment: "Index of the detected entity."
  - name: valid
    type: boolean
    comment: "Returns true if the detected index is valid and contains active data."
  - name: canAdjustDamage
    type: boolean
    comment: "Returns true if the detected object or avatar can have its damage adjusted."
  methods: []
type-aliases:
- name: rotation
  comment: '''rotation'' is an alias for ''quaternion'''
  export: true
  definition: quaternion
  selene-type: {display: "quaternion"}
- name: LSLTypes
  comment: LSL list functions return these types.
  export: true
  definition: "string | number | vector | uuid | quaternion"
  selene-type: "any"
- name: LSLReadableTypes
  comment: LSL list functions can read these types as input.
  export: true
  definition: "LSLTypes | boolean"
  selene-type: "any"
- name: list
  export: true
  definition: "{LSLReadableTypes}"
  selene-type: "table"
  typechecker: {"new-type": "{read LSLReadableTypes}"}
- name: LLMultiEventName
  # auto-generated from lsl_definitions.yaml
  definition: "{}"
  selene-type: []
- name: LLSingleEventName
  # auto-generated from lsl_definitions.yaml
  definition: "{}"
  selene-type: []
- name: LLEventName
  export: true
  definition: LLMultiEventName | LLSingleEventName
  selene-type: []
- name: LLEventHandler
  definition: (...any) -> ()
  selene-type: "function"
- name: LLMultiEventHandler
  definition: "(events: {DetectedEvent}) -> ()"
  selene-type: "function"
- name: LLTimerEveryCallback
  comment: Callback type for LLTimers.every() - receives scheduled time and interval
  definition: "(scheduled: number, interval: number) -> ()"
  selene-type: "function"
- name: LLTimerOnceCallback
  comment: Callback type for LLTimers.once() - receives scheduled time
  definition: "(scheduled: number) -> ()"
  selene-type: "function"
- name: LLTimerCallback
  comment: Union of timer callback types
  definition: LLTimerEveryCallback | LLTimerOnceCallback
  selene-type: "function"
- name: DateTypeArg
  comment: Date/time table structure used by os.date and os.time
  export: true
  definition: |-
    {
      year: number,
      month: number,
      day: number,
      hour: number?,
      min: number?,
      sec: number?,
      isdst: boolean?,
    }
  selene-type: {display: "DateTypeArg"}
- name: DateTypeResult
  comment: Date/time table structure used by os.date and os.time
  export: true
  definition: |-
    {
      year: number,
      month: number,
      day: number,
      hour: number?,
      min: number?,
      sec: number?,
      wday: number?,
      yday: number?,
      isdst: boolean?,
    }
  selene-type: {display: "DateTypeResult"}
- name: LLJsonEncodeOptions
  comment: Configuration options for lljson encoding
  export: true
  definition: |-
    {
      tight: boolean?,
      skip_tojson: boolean?,
      allow_sparse: boolean?,
      replacer: ((key: any, value: any, parent: {}?) -> any)?,
    }
  selene-type: table
- name: LLJsonDecodeReviverWithoutPath
  definition: "(key: string | number, value: any, parent: {}?, ctx: {}) -> any"
  selene-type: function
- name: LLJsonDecodeOptionsWithoutPath
  definition: |-
    {
      track_path: false?,
      reviver: LLJsonDecodeReviverWithoutPath?,
    } | LLJsonDecodeReviverWithoutPath
  selene-type: any
- name: LLJsonDecodeOptionsWithPath
  definition: |-
    {
      track_path: true,
      reviver: (key: string | number, value: any, parent: {}?, ctx: {path: {string | number}}) -> any
    }
  selene-type: table
- name: LLJsonDecodeOptions
  comment: Configuration options for lljson decoding
  export: true
  definition: "LLJsonDecodeOptionsWithoutPath | LLJsonDecodeOptionsWithPath"
  selene-type: any
- name: AttachedListFilterParams
  comment: Attached list filer table. Pass to ll.GetAttachedListFiltered to get attachments.
  export: true
  definition: '{[string]: any}'  # auto-generated from lsl_definitions.yaml
  selene-type: table
- name: CameraParams
  comment: Camera parameter table. Pass to ll.SetCameraParams() to configure the camera.
  export: true
  definition: '{[string]: any}'  # auto-generated from lsl_definitions.yaml
  selene-type: table
- name: CharacterParams
  comment: Pathfinding character parameter table. Pass to ll.CreateCharacter() to configure a character.
  export: true
  definition: '{[string]: any}'  # auto-generated from lsl_definitions.yaml
  selene-type: table
- name: CharacterNavigateParams
  comment: Pathfinding character navigate parameter table. Pass to ll.NavigateTo() to navigate.
  export: true
  definition: '{[string]: any}'  # auto-generated from lsl_definitions.yaml
  selene-type: table
- name: CharacterPatrolPointsParams
  comment: Pathfinding character patrol points parameter table. Pass to ll.PatrolPoints() to configure the route.
  export: true
  definition: '{[string]: any}'  # auto-generated from lsl_definitions.yaml
  selene-type: table
- name: CharacterPursueParams
  comment: Pathfinding character pursue parameter table. Pass to ll.Pursue() to configure the pursuit.
  export: true
  definition: '{[string]: any}'  # auto-generated from lsl_definitions.yaml
  selene-type: table
- name: CharacterWanderWithinParams
  comment: Pathfinding character wander within parameter table. Pass to ll.WanderWithin() to configure the route.
  export: true
  definition: '{[string]: any}'  # auto-generated from lsl_definitions.yaml
  selene-type: table
- name: GetClosestNavPointParams
  comment: Get closest nav point parameter table. Pass to ll.GetClosestNavPoint to find the navmesh.
  export: true
  definition: '{[string]: any}'  # auto-generated from lsl_definitions.yaml
  selene-type: table
- name: GetStaticPathParams
  comment: Get static path parameter table. Pass to ll.GetStaticPath() to find a path.
  export: true
  definition: '{[string]: any}'  # auto-generated from lsl_definitions.yaml
  selene-type: table
- name: GiveAgentInventoryParams
  comment: Give inventory parameter table. Pass to ll.GiveAgentInventory().
  export: true
  definition: '{[string]: any}'  # auto-generated from lsl_definitions.yaml
  selene-type: table
- name: GltfOverrides
  comment: GLTF overrides parameter table. Pass to ll.SetLinkGLTFOverrides() to configure material.
  export: true
  definition: '{[string]: any}'  # auto-generated from lsl_definitions.yaml
  selene-type: table
- name: HttpRequestParams
  comment: HTTP request parameter table. Pass to ll.HTTPRequest() to configure an HTTP request.
  export: true
  definition: '{[string]: any}'  # auto-generated from lsl_definitions.yaml
  selene-type: table
- name: KeyframedMotionParams
  comment: Keyframed motion parameter table. Pass to ll.SetKeyframedMotion() to animate.
  export: true
  definition: '{[string]: any}'  # auto-generated from lsl_definitions.yaml
  selene-type: table
- name: ParcelSaleParams
  comment: Parcel sale parameter table. Pass to ll.SetParcelForSale() to configure the sale of a parcel.
  export: true
  definition: '{[string]: any}'  # auto-generated from lsl_definitions.yaml
  selene-type: table
- name: ParticleParams
  comment: Particle system parameter table. Pass to ll.LinkParticleSystem() to emit particles.
  export: true
  definition: '{[string]: any}'  # auto-generated from lsl_definitions.yaml
  selene-type: table
- name: PrimMediaParams
  comment: Prim face media parameter table. Pass to ll.SetLinkMediaParams() to configure media on a face.
  export: true
  definition: '{[string]: any}'  # auto-generated from lsl_definitions.yaml
  selene-type: table
classes:
- name: LLEvents
  comment: Event registration and management class for Second Life events. Supports adding multiple handlers per event and dynamic registration.
  # auto-generated from lsl_definitions.yaml
  properties: []
  methods:
  - name: 'on'
    comment: "Registers a handler function to run whenever the specified event occurs. Multiple handlers can be attached to the same event and will run in the order they were added. Returns the same function passed in so it can be used later with LLEvents:off()."
    # auto-generated from lsl_definitions.yaml
    overloads: []
    parameters:
    - name: self
    - name: event
      comment: "Name of the event to handle."
      type: LLEventName
    - name: callback
      comment: "Function to execute when the event happens."
      type: LLEventHandler
    return-type: LLEventHandler
  - name: 'off'
    comment: "Removes an event handler. If the function was added multiple times via LLEvents:on(), only the last one added is removed. Returns true if the function was found and removed, false otherwise."
    # auto-generated from lsl_definitions.yaml
    overloads: []
    parameters:
    - name: self
    - name: event
      comment: "Name of the event to remove."
      type: LLEventName
    - name: callback
      comment: "Function to remove. Note: To remove a handler added via LLEvents:once(), you must pass the specific wrapper function it returned."
      type: LLEventHandler
    return-type: boolean
  - name: once
    comment: "Registers a one-time event handler. The function runs only once and is automatically removed afterward. Returns a newly generated wrapper function, which MUST be used if you want to manually remove the handler early using LLEvents:off()."
    # auto-generated from lsl_definitions.yaml
    overloads: []
    parameters:
    - name: self
    - name: event
      comment: "Name of the event to handle."
      type: LLEventName
    - name: callback
      comment: "Function to execute once when the event happens."
      type: LLEventHandler
    return-type: LLEventHandler
  - name: handlers
    comment: "Returns an array table containing all the functions currently handling the specified event. Useful for debugging or for iterating to remove all functions handling an event."
    parameters:
    - name: self
    - name: event
      comment: "Name of the event to query."
      type: LLEventName
    return-type: '{LLEventHandler}'
  - name: eventNames
    comment: "Returns an array table of all event names that currently have active handler functions attached."
    parameters:
    - name: self
    return-type: '{string}'
- name: LLTimers
  comment: "Timer management class for scheduling periodic and one-time callbacks. Note: Do not mix LLTimers with old LSL timer functions (e.g., llcompat.SetTimerEvent), as they share the same underlying event and will interfere with each other."
  methods:
  - name: every
    comment: "Registers a repeating timer. The callback receives (expected_time, interval). Returns the same function passed in so it can be removed later."
    parameters:
    - name: self
    - name: seconds
      comment: "Interval in seconds. Minimum practical interval is ~0.022s (one server frame). An interval of 0 schedules the timer for the next frame."
      type: number
    - name: callback
      comment: "Function to execute when the time arrives."
      type: LLTimerEveryCallback
    return-type: LLTimerCallback
  - name: once
    comment: "Registers a one-time timer. The timer runs only once and is automatically removed afterward. The callback receives (expected_time, nil). Returns the same function passed in, which can be used to cancel it early via LLTimers:off()."
    parameters:
    - name: self
    - name: seconds
      comment: "Time in seconds to wait before triggering. A value of 0 schedules it for the next frame."
      type: number
    - name: callback
      comment: "Function to execute once when the time arrives."
      type: LLTimerOnceCallback
    return-type: LLTimerCallback
  - name: 'off'
    comment: "Stops and removes a timer. If the same function was added multiple times, only the last one added is removed, regardless of its interval. Returns true if the timer was found and removed, false otherwise."
    parameters:
    - name: self
    - name: callback
      comment: "Function reference to remove."
      type: LLTimerCallback
    return-type: boolean
- name: PrimParamSetterType
  comment: Metatable for building lists to pass to ll.SetLinkPrimitiveParamsFast
  instance-type: '{any}'
  export: true
  functions:
  - name: new
    comment: Create an empty list with PrimParamSetterTypeMeta as metatable
    parameters: []
    return-type: PrimParamSetterType
  methods: # This class is currently populated dynamically
  - name: apply
    comment: Call ll.SetLinkPrimitiveParamsFast with my instance list
    parameters:
    - name: self
      type: PrimParamSetterType
    - name: link
      type: number?
      comment: Link number to target, or LINK_THIS if not specified
    return-type: ()
    typechecker: {checked: true}
global-variables:
- name: rotation
  comment: rotation is an alias for quaternion.
  type: typeof(quaternion)
- name: LLEvents
  comment: Event registration and management singleton for Second Life events.
  type: LLEvents
- name: LLTimers
  comment: Timer management singleton for scheduling periodic and one-time callbacks.
  type: LLTimers
functions:
- name: assert
  comment: Checks if the value is truthy; if not, raises an error with the optional message. Returns the value upon success.
  type-parameters: [T]
  parameters:
  - name: value
    comment: Value to check for truthiness.
    type: T?
  - name: errorMessage
    comment: Error message to display if the value is not truthy.
    type: string?
    default-value: '"assertion failed!"'
  return-type: T
  fastcall: true
  typechecker: {magic: true}
- name: collectgarbage
  comment: Run the garbage collector
  parameters:
  - name: option
    type: '"collect"?'
    selene-type: string
  overloads:
  - comment: Alias for gcinfo
    parameters:
    - name: option
      type: '"count"'
      selene-type: string
    return-type: number
  local-only: true
- name: dangerouslyexecuterequiredmodule
  comment: Dangerously executes a required module function
  parameters:
  - name: f
    type: (...any) -> ...any
  return-type: '...any'
- name: error
  comment: Raises an error with the specified object. The optional level determines which call stack level is blamed for the error.
  type-parameters: [T]
  parameters:
  - name: message
    comment: Error message, or object, to raise. Does not have to be a string.
    type: T
  - name: level
    comment: Level to attribute the error to in the call stack. Level 1 is the current function, level 2 is its caller, and so on.
    type: number?
    default-value: 1
  return-type: never
- name: gcinfo
  comment: Returns the total heap size in kilobytes.
  return-type: number
- name: getfenv
  comment: Get the scoped environment for the given function.
  parameters:
  - name: target
    type: '((...any) -> ...any) | number'
    selene-type: function
  return-type: '{[string]: any}'
  typechecker: {checked: true}
  slua-removed: true
- name: getmetatable
  comment: "Returns the metatable for the specified object. If the metatable has a '__metatable' field, returns its value instead."
  type-parameters: [T]
  parameters:
  - name: obj
    comment: Object to get the metatable for.
    type: T
    selene-type: table
  return-type: getmetatable<T>
  typechecker: {builtin: true, "new-type": "getmetatable<T>"}  # builtin due to FFlag::LuauSolverV2
  fastcall: true
- name: graphheap
  comment: Writes the contents of heap to the given file in JSON format.
    Intended to be used with tools/graphanalyze.py
  parameters:
  - name: path
    type: string
  local-only: true
- name: graphuserheap
  comment: Writes the contents of user heap to the given file in JSON format.
    Intended to be used with tools/graphanalyze.py
  parameters:
  - name: path
    type: string
  local-only: true
- name: ipairs
  comment: Returns an iterator for sequential integer key-value pairs in the table. Iteration starts at 1 and halts at the first nil value.
  type-parameters: [V]
  parameters:
  - name: tab
    comment: Table to iterate over.
    type: "{V}"
    typechecker: {"new-type": "{read V}"}
  return-type: "(({V}, number) -> (number?, V), {V}, number)"
- name: loadstring
  comment: Compile Luau code into a function.
  type-parameters: [A...]
  parameters:
  - name: src
    type: string
  - name: chunkname
    type: string?
  return-type: (((A...) -> any)?, string?)
  slua-removed: true
- name: newproxy
  comment: Creates a new untyped userdata object with an optional metatable.
  parameters:
  - name: mt
    comment: Boolean to create a modifiable metatable.
    type: boolean?
    default-value: false
  return-type: any
  typechecker: {checked: true}
- name: next
  comment: Returns the next key-value pair in the table traversal order. If the index is nil or omitted, returns the first pair.
  type-parameters: [K, V]
  parameters:
  - name: t
    comment: Table to traverse.
    type: "{[K]: V}"
    typechecker: {"new-type": "{read [K]: V}"}
  - name: i
    comment: Key to start traversal after. Omit or pass nil to fetch the first key-value pair.
    type: K?
    default-value: nil
  return-type: (K?, V)
- name: pairs
  comment: Returns an iterator for all key-value pairs in the table.
  type-parameters: [K, V]
  parameters:
  - name: t
    comment: Table to iterate over.
    type: "{[K]: V}"
    typechecker: {"new-type": "{read [K]: V}"}
  return-type: "(({[K]: V}, K?) -> (K?, V), {[K]: V}, K)"
- name: pcall
  comment: Executes function f in protected mode, calling it with the provided arguments. Returns a boolean indicating success. If true, it also returns the function's results. If false, it returns the error message.
  type-parameters: [A..., R...]
  parameters:
  - name: f
    comment: A function to be called.
    type: (A...) -> R...
  - name: ...
    comment: Arguments to pass to the function.
    type: A...
  return-type: (boolean, R...)
  typechecker: {magic: true}
- name: print
  comment: Sends all arguments as text privately to the object owner,
    separated by 4 spaces. The owner
    must be currently in the same region for the message to be received.
  type-parameters: [T...]
  parameters:
  - name: ...
    comment: Arguments to send as text to the object owner.
    type: T...
  return-type: ()
- name: rawequal
  comment: Returns true if a and b have the same type and value or reference, bypassing the __eq metamethod..
  type-parameters: [T1, T2]
  parameters:
  - name: a
    comment: First object to compare.
    type: T1
  - name: b
    comment: Second object to compare.
    type: T2
  return-type: boolean
  fastcall: true
- name: rawget
  comment: Performs a table lookup, bypassing the __index metamethod..
  type-parameters: [K, V]
  parameters:
  - name: t
    comment: Table to perform the lookup on.
    type: "{[K]: V}"
    typechecker: {"new-type": "T"}
  - name: k
    comment: Key to look up in the table.
    type: K
  return-type: V?
  typechecker: {"new-type": "rawget<T, K>", "new-type-parameters": [T, K]}
  fastcall: true
- name: rawlen
  comment: Returns the length of a table or string, bypassing the __len metamethod..
  type-parameters: [K, V]
  parameters:
  - name: t
    comment: Table or string to compute the length of.
    type: "{[K]: V} | string"
    typechecker: {"new-type": "{read [K]: V} | string"}
  return-type: number
  fastcall: true
- name: rawset
  comment: Assigns a value to a table field, bypassing the __newindex metamethod..
  type-parameters: [K, V]
  parameters:
  - name: t
    comment: Table to assign the value to.
    type: "{[K]: V}"
  - name: k
    comment: Key to assign the value to.
    type: K
  - name: v
    comment: Value to assign.
    type: V
  return-type: "{[K]: V}"
  fastcall: true
- name: require
  comment: Execute the named external module.
  parameters:
  - name: target
    comment: Name of the external module.
    type: any
  return-type: any
  typechecker: {magic: true, checked: true}
- name: select
  comment: Returns a subset of arguments starting from the specified index. Supports negative indexing. If index is '#', returns the number of arguments.
  type-parameters: [A...]
  parameters:
  - name: i
    comment: Index integer, or '#' to return the total arguments count. Supports negative indexing.
    type: string | number
  - name: ...
    comment: Arguments to select from.
    type: A...
  return-type: ...any
  fastcall: true
  typechecker: {magic: true}
- name: setfenv
  comment: Set the scoped environment for the given function.
  type-parameters: [T..., R...]
  parameters:
  - name: target
    type: 'number | (T...) -> R...'
    selene-type: function
  - name: env
    type: '{[string]: any}'
  return-type: ((T...) -> R...)?
  slua-removed: true
- name: setmetatable
  comment: "Changes the metatable for the given table. Raises an error if the table already has a protected metatable (it has a '__metatable' field)."
  type-parameters: [T, MT]
  parameters:
  - name: t
    comment: Table to set the metatable for.
    type: T
    selene-type: table
  - name: mt
    comment: Metatable to set.
    type: MT
    selene-type: table
  return-type: setmetatable<T, MT>
  fastcall: true
  typechecker: {builtin: true, magic: true, "new-type": "setmetatable<T, MT>"}  # builtin due to FFlag::LuauSolverV2
- name: tonumber
  comment: Converts the input string to a number in the specified base. Returns nil if invalid.
  parameters:
  - name: value
    comment: String to convert to a number.
    type: string? | number
    selene-type: string
  - name: base
    comment: "Base for the conversion. Valid range is [2, 36]."
    type: number?
    default-value: 10
  return-type: number?
  fastcall: true
  must-use: true
- name: toquaternion
  comment: Converts a string to a quaternion. Returns nil if invalid.
  parameters:
  - name: value
    comment: String to convert to a quaternion.
    type: string? | quaternion
    selene-type: string
  return-type: quaternion?
  must-use: true
- name: torotation
  comment: Converts a string to a rotation (quaternion). Returns nil if invalid.
  parameters:
  - name: value
    comment: String to convert to a rotation.
    type: string? | quaternion
    selene-type: string
  return-type: quaternion?
  must-use: true
- name: tostring
  comment: "Converts the input object to a string. Calls the metatable's '__tostring' metamethod if present."
  type-parameters: [T]
  parameters:
  - name: value
    comment: Object to convert to a string.
    type: T
  return-type: string
  fastcall: true
- name: touuid
  comment: Creates a new uuid from a string, buffer, or existing uuid. Returns
    nil if the string is not a valid UUID, or the buffer is
    shorter than 16 bytes.
  parameters:
  - name: val
    comment: String or buffer to convert to a uuid.
    type: string? | buffer | uuid
    selene-type: string
  return-type: uuid?
  must-use: true
- name: tovector
  comment: Converts a string to a vector. Returns nil if invalid.
  parameters:
  - name: val
    comment: String to convert to a vector.
    type: string? | vector
    selene-type: string
  return-type: vector?
  must-use: true
- name: type
  comment: Returns the type of the object as a string.
  type-parameters: [T]
  parameters:
  - name: obj
    comment: Object to get the type of.
    type: T
  return-type: string
  must-use: true
  fastcall: true
- name: typeof
  comment: Returns the type of the object, including custom userdata types.
  type-parameters: [T]
  parameters:
  - name: obj
    comment: Object to get the type of.
    type: T
  return-type: string
  must-use: true
  fastcall: true
- name: unpack
  comment: Returns values from an array in the specified index range.
  type-parameters: [V]
  parameters:
  - name: tab
    comment: Array from which to extract values.
    type: "{V}"
    typechecker: {"new-type": "{read V}"}
  - name: i
    comment: Starting index.
    type: number?
    default-value: 1
  - name: j
    comment: "Ending index."
    type: number?
    default-value: '#tab'
  return-type: ...V
  fastcall: true
- name: xpcall
  comment: Calls function f with the provided arguments, handling errors with err if they occur.
  type-parameters: [E, A..., R1..., R2...]
  parameters:
  - name: f
    comment: A function to be called.
    type: (A...) -> R1...
  - name: err
    comment: Error handler function.
    type: (E) -> R2...
  - name: ...
    comment: Arguments to pass to the function.
    type: A...
  return-type: (boolean, R1...)
modules:
- name: bit32
  comment: Bitwise operations library.
  functions:
  - name: arshift
    comment: |-
      Returns val shifted by i bits to the right. If i is negative, a left shift is performed.
      Does an arithmetic shift: The most significant bit of n is propagated during the shift.
      Returns 0 if i < -31, or all sign bits if i > 31.
    parameters:
    - name: val
      comment: Integer to shift.
      type: number
    - name: i
      comment: Number of bits to shift.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: band
    comment: Returns the bitwise AND of the given numbers.
    parameters:
    - name: ...
      comment: Integers to perform bitwise AND on.
      type: ...number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: bnot
    comment: Returns the bitwise negation of val.
    parameters:
    - name: val
      comment: Integer to negate.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: bor
    comment: Returns the bitwise OR of the given numbers.
    parameters:
    - name: ...
      comment: Integers to perform bitwise OR on.
      type: ...number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: bxor
    comment: Returns the bitwise XOR of the given numbers.
    parameters:
    - name: ...
      comment: Integers to perform bitwise XOR on.
      type: ...number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: btest
    comment: Returns true if the bitwise AND of the given numbers is non-zero.
    parameters:
    - name: ...
      comment: Integers to perform bitwise AND on.
      type: ...number
    return-type: boolean
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: extract
    comment: Returns width bits from src, starting from bit index field.
      Raises an error if the selected bit range is goes outside the range [0, 31].
    parameters:
    - name: src
      comment: Integer to extract from.
      type: number
    - name: field
      comment: Starting bit index, zero-based
      type: number
    - name: width
      comment: Number of bits to extract, or 1 if omitted.
      type: number?
      default-value: 1
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: lrotate
    comment: Returns val rotated by i bits to the left. If i is negative, a right rotate is performed.
    parameters:
    - name: val
      comment: Integer to rotate.
      type: number
    - name: i
      comment: Number of bits to rotate.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: lshift
    comment: Returns val shifted by i bits to the left. If i is negative, a right shift is performed. Returns 0 if i is outside the [-31, 31] range.
    parameters:
    - name: val
      comment: Integer to shift.
      type: number
    - name: i
      comment: Number of bits to shift.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: replace
    comment: Returns dst with width bits replaced from src, starting from bit index field.
      Raises an error if the selected bit range goes outside the range [0, 31].
    parameters:
    - name: dst
      comment: Integer to replace bits in.
      type: number
    - name: src
      comment: Integer containing the replacement bits.
      type: number
    - name: field
      comment: Starting bit index, zero-based
      type: number
    - name: width
      comment: Number of bits to replace, or 1 if omitted.
      type: number?
      default-value: 1
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: rrotate
    comment: Returns val rotated by i bits to the right. If i is negative, a left rotate is performed.
    parameters:
    - name: val
      comment: Integer to rotate.
      type: number
    - name: i
      comment: Number of bits to rotate.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: rshift
    comment: Returns val shifted by i bits to the right. If i is negative, a left shift is performed. Returns 0 if i is outside the [-31, 31] range.
    parameters:
    - name: val
      comment: Integer to shift.
      type: number
    - name: i
      comment: Number of bits to shift.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: s32
    comment: Returns val, wrapped from float64 range to signed int32 range and truncated to integer.
      Makes integer arithmetic compatable with LSL.
    parameters:
    - name: val
      comment: Integer to truncate.
      type: number
    return-type: number
    must-use: true
    typechecker: {checked: true}
  - name: smul
    comment: Returns the product of two signed 32-bit integers as a signed 32-bit integer, wrapping as necessary.
      Avoids precision loss associated with float64 multiplication. Compatible with LSL integer multiplication.
    parameters:
    - name: val1
      comment: Left factor.
      type: number
    - name: val2
      comment: Right factor.
      type: number
    return-type: number
    must-use: true
    typechecker: {checked: true}
  - name: countlz
    comment: Returns the count of val's leading zeros.
    parameters:
    - name: val
      comment: Integer to count leading zeros in.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: countrz
    comment: Returns the count of val's trailing zeros.
    parameters:
    - name: val
      comment: Integer to count trailing zeros in.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: byteswap
    comment: Returns val with its bytes swapped to the reverse order.
    parameters:
    - name: val
      comment: Integer whose byte order will be swapped.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
- name: buffer
  comment: Buffer manipulation library for binary data.
  functions:
  - name: create
    comment: Creates a buffer of the requested size with all bytes initialized to 0.
    parameters:
    - name: size
      comment: Size of the buffer to create.
      type: number
    return-type: buffer
    must-use: true
    typechecker: {checked: true}
  - name: fromstring
    comment: Creates a buffer initialized to the contents of the string.
    parameters:
    - name: str
      comment: String to initialize the buffer with.
      type: string
    return-type: buffer
    must-use: true
    typechecker: {checked: true}
  - name: tostring
    comment: Returns the buffer data as a string.
    parameters:
    - name: b
      comment: Buffer to convert to a string.
      type: buffer
    return-type: string
    must-use: true
    typechecker: {checked: true}
  - name: readi8
    comment: Reads a signed 8-bit integer from the buffer at the given offset.
    parameters:
    - name: b
      comment: Buffer to read from.
      type: buffer
    - name: offset
      comment: 0-based byte offset to read from.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: readu8
    comment: Reads an unsigned 8-bit integer from the buffer at the given offset.
    parameters:
    - name: b
      comment: Buffer to read from.
      type: buffer
    - name: offset
      comment: 0-based byte offset to read from.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: readi16
    comment: Reads a signed 16-bit integer from the buffer at the given offset.
    parameters:
    - name: b
      comment: Buffer to read from.
      type: buffer
    - name: offset
      comment: 0-based byte offset to read from.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: readu16
    comment: Reads an unsigned 16-bit integer from the buffer at the given offset.
    parameters:
    - name: b
      comment: Buffer to read from.
      type: buffer
    - name: offset
      comment: 0-based byte offset to read from.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: readi32
    comment: Reads a signed 32-bit integer from the buffer at the given offset.
    parameters:
    - name: b
      comment: Buffer to read from.
      type: buffer
    - name: offset
      comment: 0-based byte offset to read from.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: readinteger
    comment: Reads a signed or unsigned 64-bit integer from the buffer at the given offset.
    parameters:
    - name: b
      comment: Buffer to read from.
      type: buffer
    - name: offset
      comment: Byte offset to read from.
      type: number
    return-type: integer
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: readu32
    comment: Reads an unsigned 32-bit integer from the buffer at the given offset.
    parameters:
    - name: b
      comment: Buffer to read from.
      type: buffer
    - name: offset
      comment: 0-based byte offset to read from.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: readf32
    comment: Reads a 32-bit floating-point number from the buffer at the given offset.
    parameters:
    - name: b
      comment: Buffer to read from.
      type: buffer
    - name: offset
      comment: 0-based byte offset to read from.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: readf64
    comment: Reads a 64-bit floating-point number from the buffer at the given offset.
    parameters:
    - name: b
      comment: Buffer to read from.
      type: buffer
    - name: offset
      comment: 0-based byte offset to read from.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: writei8
    comment: Writes a signed 8-bit integer to the buffer at the given offset.
    parameters:
    - name: b
      comment: Buffer to write to.
      type: buffer
      observes: write
    - name: offset
      comment: 0-based byte offset to write at.
      type: number
    - name: value
      comment: Value to write.
      type: number
    return-type: ()
    fastcall: true
    typechecker: {checked: true}
  - name: writeu8
    comment: Writes an unsigned 8-bit integer to the buffer at the given offset.
    parameters:
    - name: b
      comment: Buffer to write to.
      type: buffer
      observes: write
    - name: offset
      comment: 0-based byte offset to write at.
      type: number
    - name: value
      comment: Value to write.
      type: number
    return-type: ()
    fastcall: true
    typechecker: {checked: true}
  - name: writei16
    comment: Writes a signed 16-bit integer to the buffer at the given offset.
    parameters:
    - name: b
      comment: Buffer to write to.
      type: buffer
      observes: write
    - name: offset
      comment: 0-based byte offset to write at.
      type: number
    - name: value
      comment: Value to write.
      type: number
    return-type: ()
    fastcall: true
    typechecker: {checked: true}
  - name: writeu16
    comment: Writes an unsigned 16-bit integer to the buffer at the given offset.
    parameters:
    - name: b
      comment: Buffer to write to.
      type: buffer
      observes: write
    - name: offset
      comment: 0-based byte offset to write at.
      type: number
    - name: value
      comment: Value to write.
      type: number
    return-type: ()
    fastcall: true
    typechecker: {checked: true}
  - name: writei32
    comment: Writes a signed 32-bit integer to the buffer at the given offset.
    parameters:
    - name: b
      comment: Buffer to write to.
      type: buffer
      observes: write
    - name: offset
      comment: 0-based byte offset to write at.
      type: number
    - name: value
      comment: Value to write.
      type: number
    return-type: ()
    fastcall: true
    typechecker: {checked: true}
  - name: writeinteger
    comment: Writes a signed or unsigned 64-bit integer to the buffer at the given offset.
    parameters:
    - name: b
      comment: Buffer to write to.
      type: buffer
      observes: write
    - name: offset
      comment: Byte offset to write at.
      type: number
    - name: value
      comment: Value to write.
      type: integer
    return-type: ()
    fastcall: true
    typechecker: {checked: true}
  - name: writeu32
    comment: Writes an unsigned 32-bit integer to the buffer at the given offset.
    parameters:
    - name: b
      comment: Buffer to write to.
      type: buffer
      observes: write
    - name: offset
      comment: 0-based byte offset to write at.
      type: number
    - name: value
      comment: Value to write.
      type: number
    return-type: ()
    fastcall: true
    typechecker: {checked: true}
  - name: writef32
    comment: Writes a 32-bit floating-point number to the buffer at the given offset.
    parameters:
    - name: b
      comment: Buffer to write to.
      type: buffer
      observes: write
    - name: offset
      comment: 0-based byte offset to write at.
      type: number
    - name: value
      comment: Value to write.
      type: number
    return-type: ()
    fastcall: true
    typechecker: {checked: true}
  - name: writef64
    comment: Writes a 64-bit floating-point number to the buffer at the given offset.
    parameters:
    - name: b
      comment: Buffer to write to.
      type: buffer
      observes: write
    - name: offset
      comment: 0-based byte offset to write at.
      type: number
    - name: value
      comment: Value to write.
      type: number
    return-type: ()
    fastcall: true
    typechecker: {checked: true}
  - name: readstring
    comment: Reads a string of the given length from the buffer at the specified offset.
    parameters:
    - name: b
      comment: Buffer to read from.
      type: buffer
    - name: offset
      comment: 0-based byte offset to start reading.
      type: number
    - name: count
      comment: Number of bytes to read.
      type: number
    return-type: string
    must-use: true
    typechecker: {checked: true}
  - name: writestring
    comment: Writes data from a string into the buffer at the specified offset.
    parameters:
    - name: b
      comment: Buffer to write to.
      type: buffer
      observes: write
    - name: offset
      comment: 0-based byte offset to write at.
      type: number
    - name: value
      comment: String to write.
      type: string
    - name: count
      comment: Number of bytes to write.
      type: number?
      default-value: '#value'
    return-type: ()
    typechecker: {checked: true}
  - name: len
    comment: Returns the size of the buffer in bytes.
    parameters:
    - name: b
      comment: Buffer to get the size of.
      type: buffer
    return-type: number
    must-use: true
    typechecker: {checked: true}
  - name: copy
    comment: Copies bytes from the source buffer into the target buffer.
    parameters:
    - name: target
      comment: Target buffer to copy into.
      type: buffer
      observes: write
    - name: targetOffset
      comment: 0-based byte offset in target buffer.
      type: number
    - name: source
      comment: Source buffer to copy from.
      type: buffer
    - name: sourceOffset
      comment: 0-based byte offset in source buffer.
      type: number?
      default-value: 0
    - name: count
      comment: Number of bytes to copy.
      type: number?
      default-value: 'buffer.len(source) - sourceOffset'
    return-type: ()
    typechecker: {checked: true}
  - name: fill
    comment: Fills the buffer with the specified value starting at the given offset.
    parameters:
    - name: b
      comment: Buffer to fill.
      type: buffer
      observes: write
    - name: offset
      comment: 0-based byte offset to start filling.
      type: number
    - name: value
      comment: Value to fill with.
      type: number
    - name: count
      comment: Number of bytes to fill.
      type: number?
      default-value: 'buffer.len(b) - offset'
    return-type: ()
    typechecker: {checked: true}
  - name: readbits
    comment: Reads up to 32 bits from the buffer at the given offset.
    parameters:
    - name: b
      comment: Buffer to read from.
      type: buffer
    - name: bitOffset
      comment: Bit offset to read at.
      type: number
    - name: bitCount
      comment: "Number of bits to read. Must be in [0, 32] range."
      type: number
    return-type: number
    must-use: true
    typechecker: {checked: true}
  - name: writebits
    comment: Writes up to 32 bits to the buffer at the given offset.
    parameters:
    - name: b
      comment: Buffer to write to.
      type: buffer
      observes: write
    - name: bitOffset
      comment: Bit offset to write at.
      type: number
    - name: bitCount
      comment: "Number of bits to write. Must be in [0, 32] range."
      type: number
    - name: value
      comment: Source of bits to write.
      type: number
    return-type: ()
    typechecker: {checked: true}
- name: coroutine
  comment: Coroutine manipulation library.
  functions:
  - name: create
    comment: Returns a new coroutine that, when resumed, will run function f.
    parameters:
    - name: f
      comment: A function to be executed by the new coroutine.
      type: (...any) -> ...any
    return-type: thread
    must-use: true
  - name: resume
    comment: Resumes a coroutine. Returns true followed by any values passed to coroutine.yield() or returned by the function. If an error occurs, returns false and the error message.
    parameters:
    - name: co
      comment: Coroutine to resume.
      type: thread
    - name: ...
      comment: Arguments to pass to the coroutine.
      type: ...any
    return-type: (boolean, ...any)
  - name: running
    comment: Returns the currently running coroutine, or nil if called from the main coroutine.
    parameters: []
    return-type: thread?
    must-use: true
  - name: status
    comment: 'Returns the status of the coroutine: "running", "suspended", "normal", or "dead".'
    parameters:
    - name: co
      comment: Coroutine to check status of.
      type: thread
    return-type: '"running" | "suspended" | "normal" | "dead"'
    must-use: true
    typechecker: {checked: true}
  - name: wrap
    comment: Creates a coroutine and returns a function that resumes it.
    parameters:
    - name: f
      comment: A function to execute in a coroutine.
      type: (...any) -> ...any
    return-type: (...any) -> ...any
    must-use: true
  - name: yield
    comment: Yields the current coroutine, passing arguments to the resuming code.
    parameters:
    - name: ...
      comment: Values to pass to the resuming code.
      type: ...any
    return-type: '...any'
  - name: isyieldable
    comment: Returns true if the currently running coroutine can yield.
    parameters: []
    return-type: boolean
    must-use: true
  - name: close
    comment: Closes a coroutine, returning true if successful or false and an error.
    parameters:
    - name: co
      comment: Coroutine to close.
      type: thread
    return-type: (boolean, string?)
    typechecker: {checked: true}
- name: debug
  comment: Debug library for introspection.
  functions:
  - name: info
    comment: Returns information about a stack frame or function based on specified format.
    overloads:
    - comment: Returns information about a stack level.
      parameters:
      - name: level
        comment: Stack level or function reference for inspection.
        type: number
      - name: s
        comment: String specifying requested information.
        type: string
      return-type: '...any'
    - comment: Returns information about a function.
      parameters:
      - name: func
        comment: Function reference.
        type: (...any) -> ...any
      - name: s
        comment: String specifying requested information.
        type: string
      return-type: '...any'
    parameters:
    - name: co
      comment: Optional thread or function reference.
      type: thread | ((...any) -> ...any) | number
    - name: level
      comment: Stack level or function reference for inspection.
      type: number
      optional: true
    - name: s
      comment: String specifying requested information.
      type: string
    return-type: '...any'
    must-use: true
  - name: traceback
    comment: Returns a human-readable call stack starting from the specified level.
    overloads:
    - comment: Returns a string with a traceback of the current call stack.
      parameters:
      - name: msg
        comment: Message prepended to the traceback.
        type: string?
        default-value: nil
      - name: level
        comment: Stack level to start traceback.
        type: number?
        default-value: 1
      return-type: string
    parameters:
    - name: co
      comment: Optional thread reference for traceback.
      type: thread
      optional: true
    - name: msg
      comment: Message prepended to the traceback.
      type: string?
      default-value: nil
    - name: level
      comment: Stack level to start traceback.
      type: number?
      default-value: 1
    return-type: string
    must-use: true
- name: integer
  comment: 64-bit integer operations library.
  functions:
  - name: add
    comment: Returns the sum of two 64-bit integers (signed or unsigned), wrapping on overflow.
    parameters:
    - name: int1
      comment: Left integer addend.
      type: integer
    - name: int2
      comment: Right integer addend.
      type: integer
    return-type: integer
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: arshift
    comment: |-
      Returns val shifted by i bits to the right. If i is negative, a left shift is performed.
      Does an arithmetic shift: The most significant bit of n is propagated during the shift.
    parameters:
    - name: val
      comment: Integer to shift.
      type: integer
    - name: i
      comment: Number of bits to shift.
      type: integer
    return-type: integer
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: band
    comment: Returns the bitwise AND of the given integers.
    parameters:
    - name: ...
      comment: Integers to perform bitwise AND on.
      type: ...integer
    return-type: integer
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: bnot
    comment: Returns the bitwise negation of val.
    parameters:
    - name: val
      comment: Integer to negate.
      type: integer
    return-type: integer
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: bor
    comment: Returns the bitwise OR of the given integers.
    parameters:
    - name: ...
      comment: Integers to perform bitwise OR on.
      type: ...integer
    return-type: integer
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: bxor
    comment: Returns the bitwise XOR of the given integers.
    parameters:
    - name: ...
      comment: Integers to perform bitwise XOR on.
      type: ...integer
    return-type: integer
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: bswap
    comment: Returns val with its bytes swapped to the reverse order.
    parameters:
    - name: val
      comment: Integer whose byte order will be swapped.
      type: integer
    return-type: integer
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: btest
    comment: Returns true if the bitwise AND of the given integers is non-zero.
    parameters:
    - name: ...
      comment: Integers to perform bitwise AND on.
      type: ...integer
    return-type: boolean
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: clamp
    comment: Returns val clamped between min and max. Raises an error if min is greater than max.
    parameters:
    - name: val
      comment: Integer to clamp.
      type: integer
    - name: min
      comment: Minimum allowable integer.
      type: integer
    - name: max
      comment: Maximum allowable integer.
      type: integer
    return-type: integer
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: countlz
    comment: Returns the count of val's leading zeros.
    parameters:
    - name: val
      comment: Integer to count leading zeros in.
      type: integer
    return-type: integer
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: countrz
    comment: Returns the count of val's trailing zeros.
    parameters:
    - name: val
      comment: Integer to count trailing zeros in.
      type: integer
    return-type: integer
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: create
    comment: Returns number val converted to an integer. Returns nil if
      it has a fractional part, is out of range, or is NaN.
    parameters:
    - name: val
      comment: Number to convert to an integer.
      type: number
    return-type: integer?
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: div
    comment: Returns dividend / divisor (signed), rounding toward zero. Raises an error if divisor is zero.
    parameters:
    - name: dividend
      comment: Integer dividend.
      type: integer
    - name: divisor
      comment: Integer divisor.
      type: integer
    return-type: integer
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: extract
    comment: Returns width bits from src, starting from bit index field.
      Raises an error if the selected bit range is goes outside the range [0, 63].
    parameters:
    - name: src
      comment: Integer to extract from.
      type: integer
    - name: field
      comment: Starting bit index, zero-based
      type: integer
    - name: width
      comment: Number of bits to extract, or 1 if omitted.
      type: integer?
      default-value: 1
    return-type: integer
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: fromstring
    comment: Converts the input string to an integer in the specified base. Returns nil if not an integer.
    parameters:
    - name: value
      comment: String to convert to an integer.
      type: string
    - name: base
      comment: Base for the conversion.
      type: number?
      default-value: 10
    return-type: integer?
    must-use: true
  - name: ge
    comment: Returns true if int1 >= int2 (signed).
    parameters:
    - name: int1
      comment: Left integer to compare.
      type: integer
    - name: int2
      comment: Right integer to compare.
      type: integer
    return-type: boolean
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: gt
    comment: Returns true if int1 > int2 (signed).
    parameters:
    - name: int1
      comment: Left integer to compare.
      type: integer
    - name: int2
      comment: Right integer to compare.
      type: integer
    return-type: boolean
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: idiv
    comment: Returns dividend / divisor (signed), rounding toward negative infinity. Raises an error if divisor is zero.
    parameters:
    - name: dividend
      comment: Integer dividend.
      type: integer
    - name: divisor
      comment: Integer divisor.
      type: integer
    return-type: integer
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: le
    comment: Returns true if int1 <= int2 (signed).
    parameters:
    - name: int1
      comment: Left integer to compare.
      type: integer
    - name: int2
      comment: Right integer to compare.
      type: integer
    return-type: boolean
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: lt
    comment: Returns true if int1 < int2 (signed).
    parameters:
    - name: int1
      comment: Left integer to compare.
      type: integer
    - name: int2
      comment: Right integer to compare.
      type: integer
    return-type: boolean
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: lrotate
    comment: Returns val rotated by i bits to the left. If i is negative, a right rotate is performed.
    parameters:
    - name: val
      comment: Integer to rotate.
      type: integer
    - name: i
      comment: Number of bits to rotate.
      type: integer
    return-type: integer
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: lshift
    comment: Returns val shifted by i bits to the left. If i is negative, a right shift is performed. Returns 0 if i is outside the [-63, 63] range.
    parameters:
    - name: val
      comment: Integer to shift.
      type: integer
    - name: i
      comment: Number of bits to shift.
      type: integer
    return-type: integer
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: max
    comment: Returns the maximum value from the given integers (signed).
    parameters:
    - name: val
      comment: Integer to find the maximum from.
      type: integer
    - name: ...
      comment: Integers to find the maximum from.
      type: ...integer
      optional: false
    return-type: integer
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: min
    comment: Returns the minimum value from the given integers (signed).
    parameters:
    - name: val
      comment: Integer to find the minimum from.
      type: integer
    - name: ...
      comment: Integers to find the minimum from.
      type: ...integer
      optional: false
    return-type: integer
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: mod
    comment: Returns the remainder of dividend / divisor (signed).
      The result always has the same sign as the divisor.
      Raises an error if divisor is zero.
    parameters:
    - name: dividend
      comment: Integer dividend.
      type: integer
    - name: divisor
      comment: Integer divisor.
      type: integer
    return-type: integer
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: mul
    comment: Returns the product of two 64-bit integers (signed or unsigned), wrapping on overflow.
    parameters:
    - name: int1
      comment: Left integer factor.
      type: integer
    - name: int2
      comment: Right integer factor.
      type: integer
    return-type: integer
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: neg
    comment: Returns the negation of val.
      integer.neg(integer.minsigned) == integer.minsigned due to overflow.
    parameters:
    - name: val
      comment: Integer to negate.
      type: integer
    return-type: integer
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: rem
    comment: Returns the remainder of dividend / divisor (signed).
      The result always has the same sign as the dividend.
      Raises an error if divisor is zero.
    parameters:
    - name: dividend
      comment: Integer dividend.
      type: integer
    - name: divisor
      comment: Integer divisor.
      type: integer
    return-type: integer
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: replace
    comment: Returns dst with width bits replaced from src, starting from bit index field.
      Raises an error if the selected bit range goes outside the range [0, 63].
    parameters:
    - name: dst
      comment: Integer to replace bits in.
      type: integer
    - name: src
      comment: Integer containing the replacement bits.
      type: integer
    - name: field
      comment: Starting bit index, zero-based
      type: integer
    - name: width
      comment: Number of bits to replace, or 1 if omitted.
      type: integer?
      default-value: 1
    return-type: integer
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: rrotate
    comment: Returns val rotated by i bits to the right. If i is negative, a left rotate is performed.
    parameters:
    - name: val
      comment: Integer to rotate.
      type: integer
    - name: i
      comment: Number of bits to rotate.
      type: integer
    return-type: integer
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: rshift
    comment: Returns val shifted by i bits to the right. If i is negative, a left shift is performed. Returns 0 if i is outside the [-63, 63] range.
    parameters:
    - name: val
      comment: Integer to shift.
      type: integer
    - name: i
      comment: Number of bits to shift.
      type: integer
    return-type: integer
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: sub
    comment: Returns the difference between two 64-bit integers (signed or unsigned), wrapping on overflow.
    parameters:
    - name: int1
      comment: Integer to subtract from.
      type: integer
    - name: int2
      comment: Integer to subtract.
      type: integer
    return-type: integer
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: tonumber
    comment: Returns the nearest float64 to the given int64. Is inexact above 2^53.
    parameters:
    - name: val
      comment: Integer to convert to a number.
      type: integer
    return-type: number
    fastcall: true
    must-use: true
  - name: udiv
    comment: Returns dividend / divisor (unsigned), rounding toward negative infinity. Raises an error if divisor is zero.
    parameters:
    - name: dividend
      comment: Integer dividend.
      type: integer
    - name: divisor
      comment: Integer divisor.
      type: integer
    return-type: integer
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: uge
    comment: Returns true if int1 >= int2 (unsigned).
    parameters:
    - name: int1
      comment: Left integer to compare.
      type: integer
    - name: int2
      comment: Right integer to compare.
      type: integer
    return-type: boolean
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: ugt
    comment: Returns true if int1 > int2 (unsigned).
    parameters:
    - name: int1
      comment: Left integer to compare.
      type: integer
    - name: int2
      comment: Right integer to compare.
      type: integer
    return-type: boolean
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: ule
    comment: Returns true if int1 <= int2 (unsigned).
    parameters:
    - name: int1
      comment: Left integer to compare.
      type: integer
    - name: int2
      comment: Right integer to compare.
      type: integer
    return-type: boolean
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: ult
    comment: Returns true if int1 < int2 (unsigned).
    parameters:
    - name: int1
      comment: Left integer to compare.
      type: integer
    - name: int2
      comment: Right integer to compare.
      type: integer
    return-type: boolean
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: urem
    comment: Returns the remainder of dividend / divisor (unsigned).
      Raises an error if divisor is zero.
    parameters:
    - name: dividend
      comment: Integer dividend.
      type: integer
    - name: divisor
      comment: Integer divisor.
      type: integer
    return-type: integer
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  constants:
  - name: maxsigned
    comment: The most positive signed int64 (2^63-1).
    type: integer
    value: 9_223_372_036_854_775_807i
  - name: minsigned
    comment: The most negative signed int64 (-2^63).
    type: integer
    value: -9_223_372_036_854_775_808i
- name: llbase64
  comment: Base64 encoding/decoding library.
  functions:
  - name: encode
    comment: Encodes a string or buffer to base64.
    parameters:
    - name: data
      comment: "String or buffer to encode to base64 format."
      type: string | buffer
      selene-type: string
    return-type: string
    must-use: true
    typechecker: {checked: true}
  - name: decode
    comment: Decodes a base64 string to a string, or buffer if asBuffer is true.
      The output is truncated at the first decoding error.
    overloads:
    - comment: Decodes a base64 string to a buffer if asBuffer is true.
      parameters:
      - name: data
        comment: "Base64 encoded string to decode."
        type: string
      - name: asBuffer
        comment: "If true, decodes the payload into a buffer instead of a string."
        type: "true"
      return-type: buffer
    parameters:
    - name: data
      comment: "Base64 encoded string to decode."
      type: string
    - name: asBuffer
      comment: "Decodes the payload as a string."
      type: false?
      selene-type: bool
      default-value: false
    return-type: string
    must-use: true
    typechecker: {checked: true}
- name: lljson
  comment: JSON encoding/decoding library for Second Life.
  functions:
  - name: encode
    comment: Encodes a Lua value as JSON.
      Raises an error if value contains unsupported types.
    parameters:
    - name: value
      comment: "Value (table, string, number, etc.) to serialize into JSON."
      type: any
    - name: options
      comment: "Optional configuration settings and replacer function to customize serialization formatting."
      type: LLJsonEncodeOptions?
      default-value: '{allow_sparse=false, skip_tojson=false, replacer=nil}'
    return-type: string
    must-use: true
  - name: decode
    comment: Decodes a JSON string to a Lua value.
      Raises an error if JSON is invalid.
    parameters:
    - name: json
      comment: "JSON string to deserialize into a table or value."
      type: string
    - name: options
      comment: "Optional configuration settings and reviver function to apply during parsing."
      type: LLJsonDecodeOptions?
      default-value: '{track_path=false, reviver=nil}'
    return-type: any
    must-use: true
  - name: slencode
    comment: Encodes a Lua value as JSON, preserving SL types. Use tight to encode
      more compactly. Raises an error if value contains unsupported types.
    parameters:
    - name: value
      comment: "Value to serialize into SL-typed JSON."
      type: any
    - name: options
      comment: "Optional configuration settings to customize serialization formatting."
      type: LLJsonEncodeOptions?
      default-value: '{allow_sparse=false, skip_tojson=false, tight=false, replacer=nil}'
    return-type: string
    must-use: true
  - name: sldecode
    comment: Decodes a JSON string to a Lua value, preserving SL types.
      Raises an error if JSON is invalid.
    parameters:
    - name: json
      comment: "SL-typed JSON string to deserialize."
      type: string
    - name: options
      comment: "Optional configuration settings to apply during parsing."
      type: LLJsonDecodeOptions?
      default-value: '{track_path=false, reviver=nil}'
    return-type: any
    must-use: true
  constants:
  - name: 'null'
    comment: A constant to pass for null to json encode.
    type: any
  - name: remove
    comment: A constant to return from a reviver/replacer function to omit this item.
    type: any
  - name: array_mt
    comment: Metatable for declaring a table as an array for json encode.
    type: '{__jsonhint: string}'
    value: '{__jsonhint = "array"}'
  - name: object_mt
    comment: Metatable for declaring a table as an object for json encode.
    type: '{__jsonhint: string}'
    value: '{__jsonhint = "object"}'
  - name: empty_array
    comment: A constant to pass for an empty array to json encode.
    type: '{}'
    value: 'setmetatable({}, lljson.array_mt)'
  - name: empty_object
    comment: A constant to pass for an empty object to json encode.
    type: '{}'
    value: 'setmetatable({}, lljson.object_mt)'
- name: llprim
  comment: Utilities for working with prims / objects
  constants:
  - name: ParamSetter
    comment: Metatable for building lists to pass to ll.SetLinkPrimitiveParamsFast
    type: PrimParamSetterTypeMeta
    value: PrimParamSetterTypeMeta
  functions: []
- name: math
  comment: Mathematical functions library.
  functions:
  - name: abs
    comment: Returns the absolute (positive) value of val.
    parameters:
    - name: val
      comment: Number to convert.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: acos
    comment: Returns the arccosine of val in radians.
      Returns NaN if val is not in range [-1.0, 1.0].
    parameters:
    - name: val
      comment: Cosine value in the range [-1.0, 1.0] to invert.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: asin
    comment: Returns the arcsine of val in radians.
      Returns NaN if val is not in range [-1.0, 1.0].
    parameters:
    - name: val
      comment: Sine value in the range [-1.0, 1.0] to invert.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: atan
    comment: Returns the arctangent of val in radians.
    parameters:
    - name: val
      comment: Tangent value to invert.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: atan2
    comment: "Returns the arctangent of y/x in radians, using the signs to determine the quadrant.
      Note the argument order: Y is the first parameter, X is the second parameter."
    parameters:
    - name: "y"
      comment: Y coordinate.
      type: number
    - name: x
      comment: X coordinate.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: ceil
    comment: Returns val rounded toward positive infinity.
      In other words, returns the smallest integer greater than or equal to val.
    parameters:
    - name: val
      comment: Number to round up.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: clamp
    comment: Returns val clamped between min and max. Raises an error if min is greater than max.
    parameters:
    - name: val
      comment: Number to clamp.
      type: number
    - name: min
      comment: Minimum allowable value.
      type: number
    - name: max
      comment: Maximum allowable value.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: cos
    comment: Returns the cosine of theta. Theta is in radians.
    parameters:
    - name: theta
      comment: Angle in radians.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: cosh
    comment: Returns the hyperbolic cosine of n.
    parameters:
    - name: val
      comment: Number to compute the hyperbolic cosine of.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: deg
    comment: Returns theta converted from radians to degrees.
    parameters:
    - name: theta
      comment: Number in radians.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: exp
    comment: Returns the e to the power of val.
    parameters:
    - name: val
      comment: Number to compute e^n.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: floor
    comment: Returns val rounded toward negative infinity.
      In other words, returns the largest integer less than or equal to val.
    parameters:
    - name: val
      comment: Number to round down.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: fmod
    comment: Returns the remainder (modulo) of dividend/modulus, (i.e. d mod m), rounded towards zero.
      Returns NaN if modulus is 0. Identical to d % m if both arguments have the same sign.
    parameters:
    - name: dividend
      comment: Dividend.
      type: number
    - name: modulus
      comment: Modulus.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: frexp
    comment: Breaks a floating-point number into it's component parts significand and exponent.
      In other words, Returns significand s and integer exponent e such that val = s * 2^e.
      Inverse of math.ldexp.
    parameters:
    - name: val
      comment: Number to split into significand and exponent.
      type: number
    return-type: (number, number)
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: ldexp
    comment: Returns s * 2^e. Inverse of math.frexp
    parameters:
    - name: significand
      comment: Significand.
      type: number
    - name: exponent
      comment: Exponent.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: lerp
    comment: Linearly interpolates between start_val and end_val using factor t.
    parameters:
    - name: start_val
      comment: Starting value.
      type: number
    - name: end_val
      comment: Ending value.
      type: number
    - name: t
      comment: Interpolation factor.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: log
    comment: Returns the logarithm of val in the given base. The default base is e.
    parameters:
    - name: val
      comment: Number to compute the logarithm of.
      type: number
    - name: base
      comment: Base of the logarithm.
      type: number?
      default-value: 'math.e'
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: log10
    comment: Returns the base-10 logarithm of val.
    parameters:
    - name: val
      comment: Number to compute base-10 logarithm.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: map
    comment: Maps val from input range to output range.
    parameters:
    - name: val
      comment: Number to map.
      type: number
    - name: inMin
      comment: Lower bound of the input range.
      type: number
    - name: inMax
      comment: Upper bound of the input range.
      type: number
    - name: outMin
      comment: Lower bound of the output range.
      type: number
    - name: outMax
      comment: Upper bound of the output range.
      type: number
    return-type: number
    must-use: true
    typechecker: {checked: true}
  - name: max
    comment: Returns the maximum value from the given numbers.
    parameters:
    - name: val
      comment: Number to find the maximum from.
      type: number
    - name: ...
      comment: Numbers to find the maximum from.
      type: ...number
      optional: false
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: min
    comment: Returns the minimum value from the given numbers.
    parameters:
    - name: val
      comment: Number to find the minimum from.
      type: number
    - name: ...
      comment: Numbers to find the minimum from.
      type: ...number
      optional: false
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: modf
    comment: Returns the integer and fractional parts of val.
    parameters:
    - name: val
      comment: Number to split into integer and fractional parts.
      type: number
    return-type: (number, number)
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: noise
    comment: "Returns a Perlin noise value for the point (x, y, z). The return value is in the range [-1.0, 1.0]."
    parameters:
    - name: x
      comment: X coordinate for the noise function.
      type: number
    - name: "y"
      comment: Y coordinate for the noise function.
      type: number?
      default-value: 0
    - name: z
      comment: Z coordinate for the noise function.
      type: number?
      default-value: 0
    return-type: number
    must-use: true
    typechecker: {checked: true}
  - name: pow
    comment: Returns base to the power of exponent.
    parameters:
    - name: base
      comment: Base value.
      type: number
    - name: exponent
      comment: Exponent value.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: rad
    comment: Returns theta converted from degrees to radians.
    parameters:
    - name: theta
      comment: Angle in degrees.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: random
    comment: Returns a random number within the given range.
    parameters:
    - name: min
      comment: Minimum value of the range.
      type: number?
      default-value: nil
    - name: max
      comment: Maximum value of the range.
      type: number?
      default-value: nil
    return-type: number
    must-use: true
    typechecker: {checked: true}
    variants:
      - comment: "Returns a random float number in the [0, 1) range (exclusive of 1)."
        parameters: []
        return-type: number
      - comment: "Returns a random integer number in the [1, n] range. Input is truncated to integer."
        parameters:
        - name: n
          comment: Maximum value of the range.
          type: number
        return-type: number
      - comment: "Returns a random integer number in the [min, max] range. Inputs are truncated to integers."
        parameters:
        - name: min
          comment: Minimum value of the range.
          type: number
        - name: max
          comment: Maximum value of the range.
          type: number
        return-type: number
  - name: randomseed
    comment: Sets the seed for the random number generator.
    parameters:
    - name: seed
      comment: Seed for the random number generator.
      type: number
    return-type: ()
    deprecated:
      reason: Disabled in SLua.
    typechecker: {checked: true}
  - name: round
    comment: Returns val rounded to the nearest integer. Halfway values are rounded away from zero.
    parameters:
    - name: val
      comment: Number to round to the nearest integer. Halfway values are rounded away from zero.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: sign
    comment: Returns -1 if val is negative, 1 if positive, and 0 if zero.
    parameters:
    - name: val
      comment: Number to get the sign of.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: sin
    comment: Returns the sine of theta. Theta is in radians.
    parameters:
    - name: theta
      comment: Angle in radians.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: sinh
    comment: Returns the hyperbolic sine of val.
    parameters:
    - name: val
      comment: Number to compute the hyperbolic sine of.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: sqrt
    comment: Returns the square root of val. If negative, return Nan.
    parameters:
    - name: val
      comment: Number to compute the square root of.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: tan
    comment: Returns the tangent of theta. Theta is in radians.
    parameters:
    - name: theta
      comment: Angle in radians.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: tanh
    comment: Returns the hyperbolic tangent of val.
    parameters:
    - name: val
      comment: Number to compute the hyperbolic tangent of.
      type: number
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: isnan
    comment: Returns true if val is NaN.
    parameters:
    - name: val
      comment: Number to check as NaN.
      type: number
    return-type: boolean
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: isinf
    comment: Returns true if val is infinite.
    parameters:
    - name: val
      comment: Number to check as infinite.
      type: number
    return-type: boolean
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: isfinite
    comment: Returns true if val is finite.
    parameters:
    - name: val
      comment: Number to check as finite.
      type: number
    return-type: boolean
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  constants:
  - name: e
    comment: Base of the natural logarithm.
    type: number
    value: 2.718281828459045
  - name: huge
    comment: Value larger than any other numeric value (infinity). 1/0.
    type: number
    value: inf
  - name: nan
    comment: Value representing an error (not a number). 0/0.
    type: number
    value: nan
  - name: phi
    comment: Golden ratio. (1 + math.sqrt(5))/2.
    type: number
    value: 1.618033988749895
  - name: pi
    comment: Ratio of a circle's circumference to its diameter.
      The number of radians in a half circle (semi-circle). math.tau/2.
    type: number
    value: 3.141592653589793
  - name: sqrt2
    comment: Square root of 2. math.sqrt(2).
    type: number
    value: 1.4142135623730951
  - name: tau
    comment: Ratio of a circle's circumference to its radius.
      The number of radians in a full circle. math.pi*2.
    type: number
    value: 6.283185307179586
- name: os
  comment: Operating system facilities library.
  functions:
  - name: clock
    comment: Returns a high-precision timestamp in seconds for measuring durations.
      Has a resolution of 0.0001s (222 ticks per server frame, 3 ticks per script time slice).
      6-11x slower to look up than ll.GetTime.
    parameters: []
    return-type: number
    must-use: true
  - name: date
    comment: Returns a table or string representation of the time based on the provided format.
    parameters:
    - name: formatString
      comment: Format string for the date representation.
      type: string?
      default-value: '"%c"'
    - name: t
      comment: Timestamp to format; defaults to the current time.
      type: number?
      default-value: 'os.time()'
    return-type: string
    overloads:
    - parameters:
      - name: formatString
        comment: Optional format string for the date representation.
        type: '"*t" | "!*t"'
      - name: t
        comment: Timestamp to format; defaults to the current time.
        type: number?
        default-value: 'os.time()'
      return-type: DateTypeResult
    must-use: true
  - name: difftime
    deprecated:
      reason: Same as a - b
      selene-replace: ["%1 - %2"]
    comment: Returns the difference in seconds between two timestamps. Same as a - b.
    parameters:
    - name: a
      comment: First timestamp value.
      type: number
    - name: b
      comment: Second timestamp value.
      type: number
    return-type: number
    must-use: true
  - name: time
    comment: Returns the current Unix timestamp or the timestamp of the given date.
    parameters:
    - name: time
      comment: Optional table with date/time fields; returns the corresponding Unix timestamp.
      type: DateTypeArg
      optional: true
    return-type: number?
    overloads:
    - comment: Returns the current Unix timestamp.
      parameters: []
      return-type: number
    must-use: true
- name: quaternion
  comment: Quaternion manipulation library.
  callable:
    name: quaternion
    comment: Creates a new quaternion with the given component values.
      Alias of quaternion.create.
    parameters:
    - name: x
      comment: X component of the quaternion.
      type: number
    - name: "y"
      comment: Y component of the quaternion.
      type: number
    - name: z
      comment: Z component of the quaternion.
      type: number
    - name: s
      comment: S component of the quaternion.
      type: number
    return-type: quaternion
    must-use: true
    typechecker: {checked: true}
  functions:
  - name: create
    comment: Creates a new quaternion with the given component values.
    parameters:
    - name: x
      comment: X component of the quaternion.
      type: number
    - name: "y"
      comment: Y component of the quaternion.
      type: number
    - name: z
      comment: Z component of the quaternion.
      type: number
    - name: s
      comment: S component of the quaternion.
      type: number
    return-type: quaternion
    must-use: true
    typechecker: {checked: true}
  - name: normalize
    comment: Returns the normalized unit quaternion pointing the same direction as q.
      If <0, 0, 0, 0>, return quaternion.identity = <0, 0, 0, 1>.
    parameters:
    - name: q
      comment: Quaternion to normalize.
      type: quaternion
    return-type: quaternion
    must-use: true
    typechecker: {checked: true}
  - name: magnitude
    comment: Returns the magnitude (geometric length) of the quaternion.
    parameters:
    - name: q
      comment: Quaternion to evaluate.
      type: quaternion
    return-type: number
    must-use: true
    typechecker: {checked: true}
  - name: dot
    comment: Returns the dot product of two quaternions.
    parameters:
    - name: q1
      comment: Left input quaternion.
      type: quaternion
    - name: q2
      comment: Right input quaternion.
      type: quaternion
    return-type: number
    must-use: true
    typechecker: {checked: true}
  - name: slerp
    comment: Spherical linear interpolation from start_q to end_q using factor t.
    parameters:
    - name: start_q
      comment: Starting quaternion.
      type: quaternion
    - name: end_q
      comment: Ending quaternion.
      type: quaternion
    - name: t
      comment: Interpolation factor.
      type: number
    return-type: quaternion
    must-use: true
    typechecker: {checked: true}
  - name: conjugate
    comment: Returns the conjugate of the quaternion.
      Equivalent to quaternion(-q.x, -q.y, -q.z, q.s))
    parameters:
    - name: q
      comment: Quaternion to conjugate.
      type: quaternion
    return-type: quaternion
    must-use: true
    typechecker: {checked: true}
  - name: tofwd
    comment: Returns the unit vector pointing toward positive X direction (forward)
      in the coordinate space of rotation q. Equivalent to vector(1, 0, 0) * q.
    parameters:
    - name: q
      comment: Quaternion to convert.
      type: quaternion
    return-type: vector
    must-use: true
    typechecker: {checked: true}
  - name: toleft
    comment: Returns the unit vector pointing toward positive Y direction (left)
      in the coordinate space of rotation q. Equivalent to vector(0, 1, 0) * q.
    parameters:
    - name: q
      comment: Quaternion to convert.
      type: quaternion
    return-type: vector
    must-use: true
    typechecker: {checked: true}
  - name: toup
    comment: Returns the unit vector pointing toward positive Z direction (up)
      in the coordinate space of rotation q. Equivalent to vector(0, 0, 1) * q.
    parameters:
    - name: q
      comment: Quaternion to convert.
      type: quaternion
    return-type: vector
    must-use: true
    typechecker: {checked: true}
  constants:
  - name: identity
    comment: Identity quaternion constant. Causes no change when rotated.
    type: quaternion
    value: quaternion(0, 0, 0, 1)
- name: string
  comment: String manipulation library.
  functions:
  - name: byte
    comment: Returns the numeric code of every byte in the range start_index..end_index in the string src.
      Negative indices count backward from the end of the string.
    parameters:
    - name: src
      comment: Source string.
      type: string
    - name: start_index
      comment: Starting byte index (inclusive), or 1 if omitted. Supports negative indexing.
      type: number?
      default-value: 1
    - name: end_index
      comment: Ending byte index (inclusive), or i if omitted. Supports negative indexing.
      type: number?
      default-value: i
    return-type: '...number'
    must-use: true
    fastcall: true
    typechecker: {builtin: true, checked: true}
  - name: char
    comment: Constructs and returns a string from the given byte integers.
    parameters:
    - name: ...
      comment: Byte integers to convert.
      type: ...number
      optional: false
    return-type: string
    must-use: true
    fastcall: true
    typechecker: {builtin: true, checked: true}
  - name: find
    comment: Returns the start and end byte indices of the first occurrence of pattern
      inside the string src, followed by any regex-captured substrings. Search starts from start_index. Returns nil if not found.
      Negative indices count backward from the end of the string.
    parameters:
    - name: src
      comment: Source string to search within.
      type: string
    - name: pattern
      comment: Pattern to search for.
      type: string
    - name: start_index
      comment: Byte index to start the search from, or 1 if omitted. Supports negative indexing.
      type: number?
      default-value: 1
    - name: plain
      comment: Perform raw search. If true, turns off pattern matching and performs a raw, case-sensitive substring match.
      type: boolean?
      default-value: false
    return-type: (number?, number?, ...string)
    must-use: true
    typechecker: {builtin: true, magic: true, checked: true}
  - name: format
    comment: Formats input values into a string using printf-style format specifiers.
    parameters:
    - name: format_string
      comment: Format string.
      type: string
    - name: ...
      comment: Values to format.
      type: ...any
      optional: false
    return-type: string
    must-use: true
    typechecker: {builtin: true, magic: true, checked: true}
  - name: gmatch
    comment: Returns an iterator function of all occurences of the regex pattern inside the string src.
    parameters:
    - name: src
      comment: Source string to search within.
      type: string
    - name: pattern
      comment: Regex pattern to search for.
      type: string
    return-type: () -> ...string
    must-use: true
    typechecker: {builtin: true, magic: true, checked: true}
  - name: gsub
    comment: Returns a copy of src with maxn occurrences of the regex pattern
      replaced by repl, followed by the total number of substitutions that occurred. repl can be a string, function, or table.
    parameters:
    - name: src
      comment: Original source string to search.
      type: string
    - name: pattern
      comment: Regex pattern to find and replace.
      type: string
    - name: repl
      comment: String, function, or table that to replaces the pattern.
      type: 'string | { [string]: string } | (...string) -> string'
    - name: maxn
      comment: Maximum number of replacements to make (all if omitted).
      type: number?
      default-value: nil
    return-type: (string, number)
    must-use: true
    typechecker: {builtin: true}
  - name: len
    comment: "Returns the number of bytes in the string. Identical to #str."
    parameters:
    - name: str
      comment: String to measure.
      type: string
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {builtin: true, checked: true}
  - name: lower
    comment: Returns a lowercase copy of the string src.
      Only converts ASCII characters. Use ll.ToLower for strings that may contain Unicode.
    parameters:
    - name: src
      comment: Source string to convert.
      type: string
    return-type: string
    must-use: true
    typechecker: {builtin: true, checked: true}
  - name: match
    comment: Returns all occurences of the regex pattern inside the string src, starting from start_index. Returns nil if no match is found.
      Negative indices count backward from the end of the string.
    parameters:
    - name: src
      comment: Source string to search within.
      type: string
    - name: pattern
      comment: Regex pattern to search for.
      type: string
    - name: start_index
      comment: Byte index to start at, or 1 if omitted. Supports negative indexing.
      type: number?
      default-value: 1
    return-type: '...string?'
    must-use: true
    typechecker: {builtin: true, magic: true, checked: true}
  - name: pack
    comment: Packs values into a binary string.
    parameters:
    - name: format_string
      comment: Pack format string.
      type: string
    - name: ...
      comment: Values to encode.
      type: ...any
    return-type: string
    must-use: true
    typechecker: {builtin: true}
  - name: packsize
    comment: Returns the size of a packed string for the given format.
    parameters:
    - name: format_string
      comment: Pack format string.
      type: string
    return-type: number
    must-use: true
    typechecker: {builtin: true, checked: true}
  - name: rep
    comment: Returns the string src repeated n times. Returns an empty string if n is zero or negative.
    parameters:
    - name: src
      comment: Source string to repeat.
      type: string
    - name: count
      comment: Number of times to repeat the source string.
      type: number
    return-type: string
    must-use: true
    typechecker: {builtin: true, checked: true}
  - name: reverse
    comment: Returns a copy of the string src with bytes in reverse order.
    parameters:
    - name: src
      comment: Source string to reverse.
      type: string
    return-type: string
    must-use: true
    typechecker: {builtin: true, checked: true}
  - name: split
    comment: 'Splits a string by separator. Returns a list of substrings. If the separator is nil, splits at commas (","). If the separator is empty, splits into individual one-byte substrings.'
    parameters:
    - name: src
      comment: Source string to parse.
      type: string
    - name: separator
      comment: 'Separator to split on. If nil, splits at commas (","). If empty, splits into individual bytes.'
      type: string?
      default-value: '","'
    return-type: '{string}'
    must-use: true
    typechecker: {builtin: true, checked: true}
  - name: sub
    comment: Returns a copy of the substring from src within the inclusive byte range
      start_index..end_index. Negative indices count backward from the end of the string.
    parameters:
    - name: src
      comment: Source string to slice. Supports negative indexing.
      type: string
    - name: start_index
      comment: Starting byte index (inclusive). Supports negative indexing.
      type: number
    - name: end_index
      comment: Ending byte index (inclusive), or the end of the string if omitted. Supports negative indexing.
      type: number?
      default-value: '#src'
    return-type: string
    must-use: true
    fastcall: true
    typechecker: {builtin: true, checked: true}
  - name: unpack
    comment: Decodes a binary string using a pack format, starting from index start and returns a tuple of the
      decoded values, followed by a number representing the index of the first unread byte.
      Negative indices count backward from the end of the string.
    parameters:
    - name: format_string
      comment: Pack format string.
      type: string
    - name: src
      comment: Encoded string.
      type: string
    - name: start
      comment: Starting byte index, or 1 if omitted. Supports negative indexing.
      type: number?
      default-value: 1
    return-type: '...any'
    must-use: true
    typechecker: {builtin: true, checked: true}
  - name: upper
    comment: Returns an uppercase copy of the string src.
      Only converts ASCII characters. Use ll.ToUpper for strings that may contain Unicode.
    parameters:
    - name: src
      comment: Source string to convert.
      type: string
    return-type: string
    must-use: true
    typechecker: {builtin: true, checked: true}
- name: table
  comment: Table manipulation library. Tables are collections of key-value pairs.
  functions:
  - name: concat
    comment: Joins an array of strings into one string, with an optional separator.
    parameters:
    - name: a
      comment: Array of strings.
      type: '{string | number}'
      typechecker: {"new-type": "{read string | number}"}
    - name: sep
      comment: Separator string.
      type: string?
      default-value: '""'
    - name: i
      comment: Starting index.
      type: number?
      default-value: 1
    - name: j
      comment: Ending index.
      type: number?
      default-value: '#a'
    return-type: string
    must-use: true
  - name: foreach
    comment: Iterates over all key-value pairs in the table (deprecated).
    deprecated:
      reason: Use a for loop instead
    type-parameters: [K, V, R]
    parameters:
    - name: t
      comment: Table to iterate over.
      type: '{[K]: V}'
      typechecker: {"new-type": "{read [K]: V}"}
    - name: f
      comment: Function applied to each key-value pair.
      type: '(key: K, value: V) -> R?'
      optional: false
    return-type: R?
  - name: foreachi
    comment: Iterates over all index-value pairs in the array (deprecated).
    deprecated:
      reason: Use a for loop instead
    type-parameters: [V, R]
    parameters:
    - name: a
      comment: Array to iterate over.
      type: '{V}'
      typechecker: {"new-type": "{read V}"}
    - name: f
      comment: Function applied to each index-value pair.
      type: '(index: number, value: V) -> R?'
    return-type: R?
  - name: getn
    comment: 'Returns the length of an array (deprecated; use # instead).'
    deprecated:
      use: "#"
      selene-replace: ["#%1"]
    parameters:
    - name: a
      comment: Array to check.
      type: '{any}'
    return-type: number
    must-use: true
  - name: maxn
    comment: Returns the highest numeric key in the table.
    parameters:
    - name: t
      comment: Table to check.
      type: '{any}'
    return-type: number
    must-use: true
  - name: insert
    comment: "Inserts an element at index i, shifting subsequent elements up by 1. The index must be within the range [1, #a]."
    overloads:
    - comment: "Appends an element to the end of the array. Equivalent to a[#a+1] = value."
      type-parameters: [V]
      parameters:
      - name: a
        comment: Array to insert into.
        type: '{V}'
        observes: write
      - name: value
        comment: Value to insert.
        type: V
      return-type: ()
    type-parameters: [V]
    parameters:
    - name: a
      comment: Array to insert into.
      type: '{V}'
      observes: write
    - name: i
      comment: "Index to insert at. Elements at or above this index will shift up by 1."
      type: number
      optional: true
    - name: value
      comment: Value to insert.
      type: V
    return-type: ()
    fastcall: true
  - name: append
    comment: Appends one or more elements to the end of the array.
    type-parameters: [V]
    parameters:
    - name: a
      comment: Array to be appended to.
      type: '{V}'
      observes: write
    - name: ...
      comment: Values to append.
      type: ...V
    return-type: ()
  - name: extend
    comment: "Appends all elements from one array to the end of another.
      Shorthand for table.move(b, 1, #b, #a+1, a)."
    type-parameters: [V]
    parameters:
    - name: a
      comment: Array to be appended to.
      type: '{V}'
      observes: write
    - name: b
      comment: Array to append.
      type: '{V}'
    return-type: '{V}'
  - name: remove
    comment: Removes and returns the element at index i, shifting subsequent elements down by 1. Defaults to the end of the array. Returns nil if no element was removed.
    type-parameters: [V]
    parameters:
    - name: a
      comment: Array to remove from.
      type: '{V}'
      observes: write
    - name: i
      comment: "Index of the element to remove. Subsequent elements will shift down by 1."
      type: number?
      default-value: '#a'
    return-type: V?
  - name: sort
    comment: Sorts an array in place.
    type-parameters: [V]
    parameters:
    - name: a
      comment: Array to be sorted.
      type: '{V}'
      observes: write
    - name: f
      comment: Comparison function.
      type: '((a: V, b: V) -> boolean)?'
      default-value: nil
    return-type: ()
  - name: pack
    comment: Packs arguments into a table and sets an 'n' field with the total count. This is the safest way to pack varargs (...) that might contain nil values.
    type-parameters: [V]
    parameters:
    - name: ...
      comment: Array elements.
      type: ...V
    return-type: '{ n: number, [number]: V }'
    must-use: true
    typechecker: {magic: true}
  - name: unpack
    comment: Unpacks array elements into multiple return values.
    type-parameters: [V]
    parameters:
    - name: a
      comment: Array to unpack.
      type: '{V}'
      typechecker: {"new-type": "{read V}"}
    - name: i
      comment: Starting index.
      type: number?
      default-value: 1
    - name: j
      comment: Ending index.
      type: number?
      default-value: '#a'
    return-type: '...V'
    must-use: true
    fastcall: true
  - name: move
    comment: "Copies elements [i..j] from src array into dest array starting at [d], overwriting existing elements."
    type-parameters: [V]
    parameters:
    - name: src
      comment: Source array.
      type: '{V}'
    - name: i
      comment: Starting index.
      type: number
    - name: j
      comment: Ending index.
      type: number
    - name: d
      comment: Destination index.
      type: number
    - name: dest
      comment: Destination array.
      type: '{V}?'
      default-value: src
      observes: write
    return-type: '{V}'
  - name: create
    comment: Creates a new table with pre-allocated array capacity, optionally filled. Preallocation only benefits array portions and is counter-productive for dictionaries.
    type-parameters: [V]
    parameters:
    - name: "n"
      comment: Number of elements to allocate.
      type: number
    - name: v
      comment: Value to prefill elements with.
      type: V
      optional: true
      default-value: nil
    return-type: '{V}'
    overloads:
    - comment: Creates a new unfilled table with pre-allocated array capacity.
      parameters:
      - name: "n"
        comment: Number of elements to allocate.
        type: number
      return-type: '{any}'
    must-use: true
  - name: find
    comment: Finds the first occurrence of a value in the array and returns its index. Traversal stops at the first nil.
    type-parameters: [V]
    parameters:
    - name: t
      comment: Table to search in.
      type: '{V}'
      typechecker: {"new-type": "{read V}"}
    - name: v
      comment: Value to search for.
      type: V
    - name: i
      comment: Starting index.
      type: number?
      default-value: 1
    return-type: number?
    must-use: true
  - name: clear
    comment: Clears all elements from a table while keeping its capacity to avoid memory reallocations during future assignments.
    parameters:
    - name: t
      comment: Table to clear.
      type: '{}'
      observes: write
    return-type: ()
  - name: shrink
    comment: Reduces the memory usage of the table to the minimum necessary.
    type-parameters: [V]
    parameters:
    - name: t
      comment: Table to shrink.
      type: '{V}'
    - name: shrink_sparse
      comment: Allow moving sparse array elements to hash table storage.
      type: boolean?
      default-value: false
    return-type: '{V}'
  - name: freeze
    comment: Freezes a table, making it read-only. The freeze is shallow and does not affect nested tables. Raises an error if the table is already frozen or has a protected metatable.
    type-parameters: [table]
    parameters:
    - name: t
      comment: Table to freeze.
      type: table # should be: generic table. See #56
      selene-type: table
    return-type: table
    typechecker: {magic: true}
  - name: isfrozen
    comment: Returns true if a table is frozen.
    parameters:
    - name: t
      comment: Table to check.
      type: '{}'
    return-type: boolean
    must-use: true
  - name: clone
    comment: Creates a shallow copy of the table, copying its keys, values, and metatable. The clone is always unfrozen even if the source was frozen.
    type-parameters: [table]
    parameters:
    - name: t
      comment: Table to clone.
      type: table # should be: generic table. See #56
      selene-type: table
    return-type: table
    must-use: true
    typechecker: {magic: true}
- name: utf8
  comment: UTF-8 support library.
  functions:
  - name: char
    comment: Constructs and returns a string from the given Unicode codepoint ordinals.
    parameters:
    - name: ...
      comment: Unicode codepoint integers (ordinals) to convert.
      type: ...number
      optional: false
    return-type: string
    typechecker: {checked: true}
  - name: codes
    comment: Returns an iterator that produces
      the byte offset and Unicode codepoint for each character in the string src.
    parameters:
    - name: src
      comment: Source string.
      type: string
    return-type: ((string, number) -> (number, number), string, number)
    must-use: true
    typechecker: {checked: true}
  - name: codepoint
    comment: Returns the ordinals (Unicode copepoint integers) of the characters
      in the inclusive byte range start_index..end_index in the string src.
      Negative indices count backward from the end of the string.
    parameters:
    - name: src
      comment: Source string.
      type: string
    - name: start_index
      comment: Starting byte index (inclusive), or 1 if omitted. Supports negative indexing.
      type: number?
      default-value: 1
    - name: end_index
      comment: Ending byte index (inclusive), or i if omitted. Supports negative indexing.
      type: number?
      default-value: i
    return-type: '...number'
    must-use: true
    typechecker: {checked: true}
  - name: len
    comment: Returns the number of Unicode codepoints in the inclusive byte range start_index..end_index
      of the string src. If the string is not utf8, returns (nil, error index) instead.
      Negative indices count backward from the end of the string.
    parameters:
    - name: str
      comment: Source string to measure.
      type: string
    - name: start_index
      comment: Starting byte index (inclusive), or 1 if omitted. Supports negative indexing.
      type: number?
      default-value: 1
    - name: end_index
      comment: Ending byte index (inclusive), or the end of the string if omitted. Supports negative indexing.
      type: number?
      default-value: '#str'
    return-type: (number?, number?)
    must-use: true
    typechecker: {checked: true}
  - name: offset
    comment: Returns the byte offset of the nth Unicode codepoint in the string.
      Negative indices count backward from the end of the string.
    parameters:
    - name: str
      comment: String to index.
      type: string
    - name: n
      comment: Character index. Supports negative indexing.
      type: number
    - name: start_index
      comment: Starting byte index, or 1 if omitted. Supports negative indexing.
      type: number?
      default-value: 'if n >= 0 then 1 else #str + 1'
    return-type: number?
    must-use: true
    typechecker: {checked: true}
  constants:
  - name: charpattern
    comment: Pattern that matches exactly one UTF-8 byte sequence.
    type: string
    value: '"[\x00-\x7F\xC2-\xF4][\x80-\xBF]*"'
- name: uuid
  comment: UUID library.
  callable:
    name: uuid
    comment: Creates a new uuid from a string, buffer, or existing uuid. Throws
      an error if the string is not a valid UUID, or the buffer is
      shorter than 16 bytes. Alias of uuid.create.
    parameters:
    - name: value
      type: string? | buffer | uuid
    return-type: uuid
    must-use: true
    typechecker: {checked: true}
  functions:
  - name: create
    comment: Creates a new uuid from a string, buffer, or existing uuid. Throws
      an error if the string is not a valid UUID, or the buffer is
      shorter than 16 bytes.
    parameters:
    - name: value
      type: string? | buffer | uuid
    return-type: uuid
    must-use: true
    typechecker: {checked: true}
- name: vector
  comment: Vector manipulation library.
  callable:
    name: vector
    comment: Creates a new vector with the given component values.
      Alias of vector.create.
    parameters:
    - name: x
      comment: X component of the vector.
      type: number
    - name: "y"
      comment: Y component of the vector.
      type: number
    - name: z
      comment: Z component of the vector.
      type: number?
      default-value: 0
    return-type: vector
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  functions:
  - name: create
    comment: Creates a new vector with the given component values.
    parameters:
    - name: x
      comment: X component of the vector.
      type: number
    - name: "y"
      comment: Y component of the vector.
      type: number
    - name: z
      comment: Z component of the vector.
      type: number?
      default-value: 0
    return-type: vector
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: magnitude
    comment: Returns the magnitude (geometric length) of the vector.
    parameters:
    - name: vec
      comment: Vector to evaluate.
      type: vector
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: normalize
    comment: Returns the normalized unit vector pointing the same direction as vec.
      If <0, 0, 0>, return <NaN, NaN, NaN>.
    parameters:
    - name: vec
      comment: Vector to normalize.
      type: vector
    return-type: vector
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: cross
    comment: Returns the cross product of two vectors.
    parameters:
    - name: start_vec
      comment: Starting vector.
      type: vector
    - name: end_vec
      comment: Ending vector.
      type: vector
    return-type: vector
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: dot
    comment: Returns the dot product of two vectors.
    parameters:
    - name: vec1
      comment: Left input vector.
      type: vector
    - name: vec2
      comment: Right input vector.
      type: vector
    return-type: number
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: angle
    comment: Returns the angle from start_vec to end_vec in radians.
      The axis, if specified, is used to determine the sign of the angle.
      If no axis is specified, the angle is positive, as if axis was vector.cross(start_vec, end_vec).
    parameters:
    - name: start_vec
      type: vector
      comment: Starting vector.
    - name: end_vec
      comment: Ending vector.
      type: vector
    - name: axis
      comment: Axis to determine the sign of the angle.
      type: vector?
      default-value: nil
    return-type: number
    must-use: true
    typechecker: {checked: true}
  - name: floor
    comment: Applies math.floor to each component of the vector.
    parameters:
    - name: vec
      comment: Vector to round down.
      type: vector
    return-type: vector
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: ceil
    comment: Applies math.ceil to each component of the vector.
    parameters:
    - name: vec
      comment: Vector to round up.
      type: vector
    return-type: vector
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: abs
    comment: Applies math.abs to each component of the vector.
    parameters:
    - name: vec
      comment: Vector to convert.
      type: vector
    return-type: vector
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: sign
    comment: Applies math.sign to each component of the vector.
    parameters:
    - name: vec
      comment: Vector to get the sign of.
      type: vector
    return-type: vector
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: clamp
    comment: Clamps each component of the vector between min and max values.
    parameters:
    - name: vec
      comment: Vector to be clamped.
      type: vector
    - name: min
      comment: Minimum vector value.
      type: vector
    - name: max
      comment: Maximum vector value.
      type: vector
    return-type: vector
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: max
    comment: Applies math.max to each component of the vectors.
    parameters:
    - name: vec
      comment: Vector to find the maximum from.
      type: vector
    - name: ...
      comment: Vectors to find the maximum from.
      type: ...vector
    return-type: vector
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: min
    comment: Applies math.min to each component of the vectors.
    parameters:
    - name: vec
      comment: Vector to find the minimum from.
      type: vector
    - name: ...
      comment: Vectors to find the minimum from.
      type: ...vector
    return-type: vector
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  - name: lerp
    comment: Linearly interpolates between start_vec and end_vec using factor t.
    parameters:
    - name: start_vec
      comment: Starting vector.
      type: vector
    - name: end_vec
      comment: Ending vector.
      type: vector
    - name: t
      comment: Interpolation factor.
      type: number
    return-type: vector
    must-use: true
    fastcall: true
    typechecker: {checked: true}
  constants:
  - name: zero
    comment: Vector constant with all components set to 0.
    type: vector
    value: vector(0, 0, 0)
  - name: one
    comment: Vector constant with all components set to 1.
    type: vector
    value: vector(1, 1, 1)
- name: ll
  comment: Library for functions shared between LSL and SLua.
  functions:
  - name: Abs
    parameters:
    - name: val
      type: number
      comment: Integer to convert.
    return-type: number
    comment: Returns the absolute (positive) integer value of val.
    deprecated:
      reason: Double precision; fastcall.
      use: math.abs
      selene-replace:
      - math.abs(%...)
    must-use: true
  - name: Acos
    parameters:
    - name: val
      type: number
      comment: A number in the range [-1.0, 1.0].
    return-type: number
    comment: Returns the arccosine of val in radians.
    deprecated:
      reason: Double precision; fastcall.
      use: math.acos
      selene-replace:
      - math.acos(%...)
    must-use: true
  - name: AddToLandBanList
    parameters:
    - name: avatar
      type: uuid
      comment: UUID of the avatar to add to the ban list.
    - name: hours
      type: number
      comment: Duration, in hours, to ban the avatar for (0 for indefinite).
    comment: Adds the avatar to the parcel ban list for the specified number of hours.
      A value of 0 hours adds the avatar indefinitely. Banned users teleporting to
      the parcel are redirected to a neighboring parcel; the minimum accepted duration
      is 0.01 hours (approximately 36 seconds).
  - name: AddToLandPassList
    parameters:
    - name: avatar
      type: uuid
      comment: UUID of the avatar to add to the pass list.
    - name: hours
      type: number
      comment: Duration, in hours, to allow the avatar for (range [0.0, 144.0], 0
        for indefinite).
    comment: Adds the avatar to the land pass list for the specified number of hours
      (or indefinitely if hours is 0).
  - name: AdjustDamage
    parameters:
    - name: number
      type: number
      comment: Index of the damage event to modify.
    - name: new_damage
      type: number
      comment: New damage value to be applied or distributed after on_damage processing.
    comment: Modifies the amount of damage applied by the current on_damage event
      after it completes processing, specified by the damage event index number.
    deprecated:
      use: adjustDamage
  - name: AdjustSoundVolume
    parameters:
    - name: volume
      type: number
      comment: Volume level to set, between 0.0 (silent) and 1.0 (loud).
    comment: Adjusts the volume of the currently playing attached sound (has no effect
      on sounds started with llTriggerSound).
  - name: AgentInExperience
    parameters:
    - name: agent
      type: uuid
      comment: UUID of the avatar in the same region to query.
    return-type: boolean
    comment: Returns TRUE if the specified agent is in the experience and the experience
      can run in the current region/location; returns FALSE otherwise.
    must-use: true
  - name: AllowInventoryDrop
    parameters:
    - name: add
      type: boolean | number
      comment: Boolean. If TRUE, allows anyone to drop inventory items into the prim
        (even without modify rights). If FALSE, restricts inventory dropping to those
        with modify permissions.
    comment: If add is TRUE, allows users without object modify permissions to drop
      inventory items into the prim. If FALSE, restricts inventory dropping to users
      with modify permissions.
  - name: AngleBetween
    parameters:
    - name: start_rot
      type: quaternion
      comment: Starting rotation.
    - name: end_rot
      type: quaternion
      comment: Ending rotation.
    return-type: number
    comment: Returns the angle, in radians, between rotations start_rot and and end_rot.
    must-use: true
  - name: ApplyImpulse
    parameters:
    - name: momentum
      type: vector
      comment: Linear impulse vector to apply.
    - name: is_local
      type: boolean | number
      comment: Boolean. If TRUE, momentum is treated as a local directional vector;
        if FALSE, it is treated as a global region vector.
    comment: Applies a linear impulse (momentum) to a physical object. If local is
      TRUE, the impulse is applied in local coordinates; otherwise, it is applied
      in global region coordinates.
  - name: ApplyRotationalImpulse
    parameters:
    - name: force
      type: vector
      comment: Rotational impulse vector to apply.
    - name: is_local
      type: boolean | number
      comment: Boolean. If TRUE, the force is treated as a local directional vector;
        if FALSE, it is treated as a global region vector.
    comment: Applies a rotational impulse (force) to a physical object. If local is
      TRUE, the rotational impulse is applied in local coordinates; otherwise, it
      is applied in global region coordinates.
  - name: Asin
    parameters:
    - name: val
      type: number
      comment: A number in the range [-1.0, 1.0].
    return-type: number
    comment: Returns the arcsine of val in radians.
    deprecated:
      reason: Double precision; fastcall.
      use: math.asin
      selene-replace:
      - math.asin(%...)
    must-use: true
  - name: Atan2
    parameters:
    - name: y
      type: number
      comment: Y coordinate.
    - name: x
      type: number
      comment: X coordinate.
    return-type: number
    comment: 'Returns the arctangent of y/x in radians, using the signs to determine
      the quadrant. Note the argument order: Y is the first parameter, X is the second
      parameter.'
    deprecated:
      reason: Double precision; fastcall.
      use: math.atan2
      selene-replace:
      - math.atan2(%...)
    must-use: true
  - name: AttachToAvatar
    parameters:
    - name: attach_point
      type: number
      comment: ATTACH_* constant or integer value representing the target attachment
        point.
    comment: Attaches the object to the avatar who has granted the PERMISSION_ATTACH
      permission. Takes the object into the user's inventory and attaches it at attach_point.
  - name: AttachToAvatarTemp
    parameters:
    - name: attach_point
      type: number
      comment: ATTACH_* constant or integer value representing the target attachment
        point.
    comment: Attaches the object temporarily to an avatar who has granted the PERMISSION_ATTACH
      permission. No permanent inventory is created, and the object disappears on
      detach or disconnect. Can be used on non-owners (changing ownership to the wearer).
  - name: AvatarOnLinkSitTarget
    parameters:
    - name: link
      type: number
      comment: Index of the prim in the linkset (1 for root, >1 for children), or
        a LINK_* flag.
    return-type: uuid
    comment: Returns the UUID of the avatar seated on the specified link's sit target,
      or NULL_KEY if no avatar is sitting there.
    must-use: true
  - name: AvatarOnSitTarget
    return-type: uuid
    comment: Returns the UUID of the avatar seated on the prim's sit target (defined
      via llSitTarget), or NULL_KEY if no avatar is sitting there or the prim lacks
      a sit target.
    must-use: true
  - name: Axes2Rot
    parameters:
    - name: fwd
      type: vector
      comment: Forward/back directional vector of the rotation.
    - name: left
      type: vector
      comment: Left/right directional vector of the rotation.
    - name: up
      type: vector
      comment: Up/down directional vector of the rotation.
    return-type: quaternion
    comment: Returns the rotation defined by the coordinate axes fwd, left, and up.
    must-use: true
  - name: AxisAngle2Rot
    parameters:
    - name: axis
      type: vector
      comment: Axis vector to rotate around.
    - name: angle
      type: number
      comment: Angle to rotate, in radians.
    return-type: quaternion
    comment: Returns the rotation that rotates angle radians around the axis vector.
    must-use: true
  - name: Base64ToInteger
    parameters:
    - name: str
      type: string
      comment: Base64-encoded string to decode.
    return-type: number
    comment: Returns an integer representing the Base64-decoded big-endian value of
      str. Returns zero if str is longer than 8 characters; the return value is unpredictable
      if str contains fewer than 6 characters.
    deprecated:
      reason: Use 'llbase64.decode' and 'string.unpack' or 'buffer.readi32' instead.
      selene-replace:
      - string.unpack(">i", llbase64.decode(s))
    must-use: true
  - name: Base64ToString
    parameters:
    - name: str
      type: string
      comment: Base64-encoded string to decode.
    return-type: string
    comment: Decodes the Base64-encoded string str into a conventional string, interpreting
      the bytes as a UTF-8 character sequence. Unprintable characters are converted
      to question marks.
    deprecated:
      use: llbase64.decode
      selene-replace:
      - llbase64.decode(%1)
    must-use: true
  - name: BreakAllLinks
    comment: Delinks all prims in the linkset. Requires the PERMISSION_CHANGE_LINKS
      runtime permission, which must be requested and granted by the owner.
  - name: BreakLink
    parameters:
    - name: link
      type: number
      comment: 'The link number (0: unlinked, 1: root prim, >1: child prims and seated
        avatars) to delink.'
    comment: Delinks the prim specified by the link number link. Requires the PERMISSION_CHANGE_LINKS
      runtime permission.
  - name: CSV2List
    parameters:
    - name: src
      type: string
      comment: String of comma-separated values to parse.
    return-type: '{string}'
    comment: Parses the comma-separated string src and returns it as a list.
    must-use: true
  - name: CastRay
    parameters:
    - name: start_pos
      type: vector
      comment: Starting location vector of the ray.
    - name: end_pos
      type: vector
      comment: Ending location vector of the ray.
    - name: options
      type: list
      comment: A list of option flags and their parameters to configure the raycast.
    return-type: '{any}'
    comment: Casts a ray into the physics world from start to end and reports collision
      data for intersections with objects based on options. Returns a list of strided
      values [UUID_1, {link_number_1}, hit_position_1, {hit_normal_1}, ..., status_code].
      A negative status_code indicates an error; otherwise, it represents the number
      of hits.
    must-use: true
  - name: Ceil
    parameters:
    - name: val
      type: number
      comment: Number to round up.
    return-type: number
    comment: Returns val rounded toward positive infinity. In other words, returns
      the smallest integer greater than or equal to val.
    deprecated:
      reason: Fastcall.
      use: math.ceil
      selene-replace:
      - math.ceil(%...)
    must-use: true
  - name: Char
    parameters:
    - name: val
      type: number
      comment: Unicode codepoint integer (ordinal) to convert.
    return-type: string
    comment: Constructs and returns a single-character string from the given Unicode
      codepoint ordinal.
    must-use: true
  - name: ClearCameraParams
    comment: Resets all camera parameters to default values and turns off scripted
      camera control. Requires the PERMISSION_CONTROL_CAMERA runtime permission (automatically
      granted for attached or sat-on objects).
  - name: ClearExperience
    parameters:
    - name: agentid
      type: uuid
    - name: experienceid
      type: uuid
    deprecated: true
  - name: ClearExperiencePermissions
    parameters:
    - name: agentid
      type: uuid
    deprecated: true
  - name: ClearLinkMedia
    parameters:
    - name: link
      type: number
      comment: 'The link number (0: unlinked, 1: root prim, >1: child prims) or a
        LINK_* flag representing the target prim.'
    - name: face
      type: number
      comment: Face number to clear.
    return-type: number
    comment: Deletes the media and clears all parameters from the given face on the
      linked prim. Returns an integer STATUS_* flag detailing the success or failure
      of the operation.
  - name: ClearPrimMedia
    parameters:
    - name: face
      type: number
      comment: Face number (side) to clear.
    return-type: number
    comment: Deletes the media and clears all parameters from the specified face.
      Returns an integer STATUS_* flag detailing the success or failure of the operation.
  - name: CloseRemoteDataChannel
    parameters:
    - name: channel
      type: uuid
      comment: XML-RPC channel ID to close.
    comment: Deprecated. Closes the specified XML-RPC channel.
    deprecated: true
  - name: Cloud
    parameters:
    - name: offset
      type: vector
      comment: Offset relative to the prim's position, expressed in local coordinates.
    return-type: number
    comment: Returns a float representing the cloud density at the prim's position
      offset by the vector offset.
    deprecated: true
    must-use: true
  - name: CollisionFilter
    parameters:
    - name: name
      type: string
      comment: Specific object name or avatar legacy name to filter for.
    - name: id
      type: uuid
      comment: Group, avatar, or object UUID to filter by.
    - name: accept
      type: boolean | number
      comment: Boolean. If TRUE, only collisions matching the name and id filters
        are processed; if FALSE, matching collisions are excluded.
    comment: Sets the collision filter, either exclusively or inclusively. If accept
      is TRUE, only collisions matching name and id are processed; if FALSE, matches
      are excluded. Pass an empty string or NULL_KEY to name or id to skip filtering
      on that parameter.
  - name: CollisionSound
    parameters:
    - name: impact_sound
      type: string | uuid
      comment: UUID of a sound, the name of a sound in the prim's inventory, or an
        empty string to suppress sounds.
    - name: impact_volume
      type: number
      comment: Volume level to set, between 0.0 (silent) and 1.0 (loud).
    comment: Suppresses default collision sounds and replaces default impact sounds
      with impact_sound at the volume level specified by impact_volume. Supply an
      empty string to only suppress collision sounds.
  - name: CollisionSprite
    parameters:
    - name: impact_sprite
      type: string | uuid
      comment: UUID of a texture, the name of a texture in the prim's inventory, or
        an empty string to suppress sprites.
    comment: Suppresses default collision sprites and replaces them with impact_sprite
      (which must be in the prim's inventory). Supply an empty string to only suppress
      collision sprites.
    deprecated: true
  - name: ComputeHash
    parameters:
    - name: message
      type: string
      comment: Message string to be hashed.
    - name: algorithm
      type: string
      comment: Cryptographic digest algorithm to use (e.g., md5, sha1, sha224, sha256,
        sha384, or sha512).
    return-type: string
    comment: Returns a hex-encoded hash digest string of message using the specified
      cryptographic algorithm.
    must-use: true
  - name: Cos
    parameters:
    - name: theta
      type: number
      comment: Angle in radians.
    return-type: number
    comment: Returns the cosine of theta. Theta is in radians.
    deprecated:
      reason: Double precision; fastcall.
      use: math.cos
      selene-replace:
      - math.cos(%...)
    must-use: true
  - name: CreateCharacter
    parameters:
    - name: options
      type: list | CharacterParams
      comment: A list of key-value pairs specifying the character's configuration
        options.
    comment: Converts the linkset containing the script into a pathfinding character
      entity (required to use pathfinding functions) using the specified options.
  - name: CreateKeyValue
    parameters:
    - name: k
      type: string
      comment: Unique key name for the key-value pair.
    - name: v
      type: string
      comment: Value for the key-value pair (maximum 2047 characters, or 4095 characters
        if using Mono).
    return-type: uuid
    comment: Starts an asynchronous transaction to create a key-value pair (k and
      v) associated with the script's experience. Returns a key query handle for the
      dataserver event. Fails with XP_ERROR_STORAGE_EXCEPTION if the key already exists.
  - name: CreateLink
    parameters:
    - name: target
      type: uuid
      comment: UUID of the target prim/object in the same region.
    - name: parent
      type: boolean | number
      comment: Boolean. If TRUE, the script's object becomes the root prim; if FALSE,
        target becomes the root.
    comment: Attempts to link the object containing the script with target. Requires
      the PERMISSION_CHANGE_LINKS runtime permission.
  - name: Damage
    parameters:
    - name: target
      type: uuid
      comment: Key of the target avatar or task to receive damage.
    - name: damage
      type: number
      comment: Amount of damage to inflict (can exceed 100, unlike collision-based
        damage).
    - name: damage_type
      type: number
      comment: Type of damage to deliver to the target (can correspond to a DAMAGE_TYPE_*
        constant).
    comment: Generates a damage event delivering the specified amount of damage and
      damage_type to the targeted avatar or task in the same region.
  - name: DataSizeKeyValue
    return-type: uuid
    comment: Starts an asynchronous transaction to request the used and total data
      storage allocated for the experience. Returns a key query handle for the dataserver
      event.
  - name: DeleteCharacter
    comment: Converts the linkset back to a standard physical object, removing all
      pathfinding properties.
  - name: DeleteKeyValue
    parameters:
    - name: k
      type: string
      comment: Key of the key-value pair to delete.
    return-type: uuid
    comment: Starts an asynchronous transaction to delete the key-value pair associated
      with key k in the experience. Returns a key query handle for the dataserver
      event.
  - name: DeleteSubList
    type-parameters:
    - T
    parameters:
    - name: src
      type: '{T}'
      comment: Source list to copy and modify.
    - name: start_index
      type: number
      comment: Starting index of the slice to remove (inclusive).
    - name: end_index
      type: number
      comment: Ending index of the slice to remove (inclusive).
    return-type: '{T}'
    comment: Returns a copy of the list src with the slice from start_index to end_index
      (inclusive) removed. Negative indices count backward from the end of the list.
      If start_index is greater than end_index, the deletion excludes the specified
      range.
    deprecated:
      reason: Unnecessary table copying.
      use: table.remove
      selene-replace:
      - table.remove(%1, %2)
    must-use: true
  - name: DeleteSubString
    parameters:
    - name: src
      type: string
      comment: Source string to modify.
    - name: start_index
      type: number
      comment: Starting codepoint index of the substring to remove (inclusive). Supports
        negative indexing.
    - name: end_index
      type: number
      comment: Ending codepoint index of the substring to remove (inclusive). Supports
        negative indexing.
    return-type: string
    comment: Returns a copy of the string src with the characters from start_index
      to end_index (inclusive) removed. Negative indices count backward from the end
      of the string. If start_index is greater than end_index, the deletion excludes
      the specified range.
    must-use: true
  - name: DerezObject
    parameters:
    - name: id
      type: uuid
      comment: UUID of the object in the region to derez.
    - name: flags
      type: number
      comment: Derez behavior flags matching DEREZ_* constants.
    return-type: boolean
    comment: Derezzes (deletes or returns) a targeted object in the region previously
      rezzed by a script in this linkset, returning TRUE on success or FALSE on failure.
  - name: DetachFromAvatar
    comment: Detaches the object containing the script from the avatar. Requires the
      PERMISSION_ATTACH runtime permission (automatically granted to attached objects).
      Note that the detached object is completely removed from the region and not
      dropped on the ground.
  - name: DetectedDamage
    parameters:
    - name: number
      type: number
      comment: Index of the detection information.
    return-type: '{any}'
    comment: Returns a list containing pending damage information for the event specified
      by number, including the current damage, the damage type, and the original damage
      delivered.
    deprecated:
      use: getDamage
    must-use: true
  - name: DetectedGrab
    parameters:
    - name: number
      type: number
      comment: Index of the detection information.
    return-type: vector
    comment: Returns a vector representing the grab offset of the user touching the
      object. Only works in touch events and returns <0.0, 0.0, 0.0> if number is
      not a valid index.
    deprecated:
      use: getGrab
    must-use: true
  - name: DetectedGroup
    parameters:
    - name: number
      type: number
      comment: Index of the detection information.
    return-type: boolean
    comment: Returns TRUE if the detected object or avatar specified by number has
      the same active group as the prim containing the script. Returns FALSE if the
      group is not active or if they are not in the group.
    deprecated:
      use: getGroup
    must-use: true
  - name: DetectedKey
    parameters:
    - name: number
      type: number
      comment: Index of the detection information.
    return-type: uuid
    comment: Returns the key (UUID) of the detected object or avatar specified by
      number, or NULL_KEY if number is not a valid index.
    deprecated:
      use: getKey
    must-use: true
  - name: DetectedLinkNumber
    parameters:
    - name: number
      type: number
      comment: Index of the detection information.
    return-type: number
    comment: Returns the link number (integer) of the triggered event (touches and
      collisions only) specified by number. Returns 0 for non-linked objects, 1 for
      the root prim, and 2+ for child prims. Returns 0 if not supported by the event.
    deprecated:
      use: getLinkNumber
    must-use: true
  - name: DetectedName
    parameters:
    - name: item
      type: number
      comment: Index of the detection information.
    return-type: string
    comment: Returns a string representing the name of the detected object or avatar
      specified by item. Returns an empty string if item is not a valid index.
    deprecated:
      use: getName
    must-use: true
  - name: DetectedOwner
    parameters:
    - name: number
      type: number
      comment: Index of the detection information.
    return-type: uuid
    comment: Returns the key (UUID) of the owner of the detected object specified
      by number. Returns an invalid key if number is not a valid index.
    deprecated:
      use: getOwner
    must-use: true
  - name: DetectedPos
    parameters:
    - name: number
      type: number
      comment: Index of the detection information.
    return-type: vector
    comment: Returns the vector position (in region coordinates) of the detected object
      or avatar specified by number, or <0.0, 0.0, 0.0> if number is not a valid index.
    deprecated:
      use: getPos
    must-use: true
  - name: DetectedRezzer
    parameters:
    - name: number
      type: number
      comment: Index of the detection information.
    return-type: uuid
    comment: Returns the key (UUID) of the object or avatar that rezzed the detected
      object specified by number.
    deprecated:
      use: getRezzer
    must-use: true
  - name: DetectedRot
    parameters:
    - name: number
      type: number
      comment: Index of the detection information.
    return-type: quaternion
    comment: Returns the rotation of the detected object or avatar specified by number,
      or <0.0, 0.0, 0.0, 1.0> if number is not a valid offset index.
    deprecated:
      use: getRot
    must-use: true
  - name: DetectedTouchBinormal
    parameters:
    - name: index
      type: number
      comment: Index of the detection information.
    return-type: vector
    comment: Returns the surface binormal vector (tangent to the surface, pointing
      along the positive T (V) direction of tangent space) at the touched location
      specified by index. Can be used with llDetectedTouchNormal to determine the
      tangent space.
    deprecated:
      use: getTouchBinormal
    must-use: true
  - name: DetectedTouchFace
    parameters:
    - name: index
      type: number
      comment: Index of the detection information.
    return-type: number
    comment: Returns the integer index of the face clicked by the avatar in the touch
      event specified by index.
    deprecated:
      use: getTouchFace
    must-use: true
  - name: DetectedTouchNormal
    parameters:
    - name: index
      type: number
      comment: Index of the detection information.
    return-type: vector
    comment: Returns the surface normal vector (perpendicular to the surface) at the
      touched location specified by index. Can be used with llDetectedTouchBinormal
      to determine the tangent space.
    deprecated:
      use: getTouchNormal
    must-use: true
  - name: DetectedTouchPos
    parameters:
    - name: index
      type: number
      comment: Index of the detection information.
    return-type: vector
    comment: Returns the vector position where the object was touched (specified by
      index) in region coordinates, or in screen-space coordinates if the object is
      attached as a HUD.
    deprecated:
      use: getTouchPos
    must-use: true
  - name: DetectedTouchST
    parameters:
    - name: index
      type: number
      comment: Index of the detection information.
    return-type: vector
    comment: Returns the surface coordinates (<s, t, 0.0>) where the prim was touched,
      specified by index. X and Y contain the horizontal (s) and vertical (t) face
      coordinates, typically in the interval [0.0, 1.0]. Returns TOUCH_INVALID_TEXCOORD
      if coordinates cannot be determined.
    deprecated:
      use: getTouchST
    must-use: true
  - name: DetectedTouchUV
    parameters:
    - name: index
      type: number
      comment: Index of the detection information.
    return-type: vector
    comment: Returns the texture coordinates (<u, v, 0.0>) where the prim was touched,
      specified by index. X and Y contain the horizontal (u) and vertical (v) texture
      coordinates, typically in the interval [0.0, 1.0] (affected by repeats and rotation).
      Returns TOUCH_INVALID_TEXCOORD if coordinates cannot be determined.
    deprecated:
      use: getTouchUV
    must-use: true
  - name: DetectedType
    parameters:
    - name: number
      type: number
      comment: Index of the detection information.
    return-type: number
    comment: Returns an integer bitfield representing the types (AGENT, ACTIVE, PASSIVE,
      or SCRIPTED) of the detected object or avatar specified by number. Returns 0
      if number is not a valid index.
    deprecated:
      use: getType
    must-use: true
  - name: DetectedVel
    parameters:
    - name: number
      type: number
      comment: Index of the detection information.
    return-type: vector
    comment: Returns the vector velocity of the detected object or avatar specified
      by number, or <0.0, 0.0, 0.0> if number is not a valid offset index.
    deprecated:
      use: getVel
    must-use: true
  - name: Dialog
    parameters:
    - name: agent
      type: uuid
      comment: UUID of the agent in the same region.
    - name: msg
      type: string
      comment: Text message to display in the dialog box.
    - name: buttons
      type: '{string}'
      comment: A list of up to 12 strings representing button labels.
    - name: channel
      type: number
      comment: Output chat channel (any 32-bit signed integer value) where button
        clicks are chatted.
    comment: Shows a dialog box on the screen of the specified agent, displaying msg
      along with up to 12 choice buttons. Clicking a button chats its label on channel.
      The chat originates at the object's position, but uses the agent's name and
      UUID, so it can be heard as long as the agent is still in the region.
  - name: Die
    comment: Deletes the entire object containing the script (the object does not
      go to inventory). Use llBreakLink first to delete only a single prim.
  - name: DumpList2String
    parameters:
    - name: src
      type: list
      comment: Source list to convert.
    - name: separator
      type: string
      comment: Separator string to place between list entries.
    return-type: string
    comment: Returns a string that is the list src converted to a single string, with
      separator placed between each entry.
    must-use: true
  - name: EdgeOfWorld
    parameters:
    - name: pos
      type: vector
      comment: Position vector in region coordinates.
    - name: dir
      type: vector
      comment: Direction vector.
    return-type: boolean
    comment: Checks if the border reached along the vector dir from the vector pos
      is the edge of the world (i.e., has no neighboring simulator). Returns TRUE
      if it hits the edge of the world, or FALSE if there is a neighboring simulator.
    must-use: true
  - name: EjectFromLand
    parameters:
    - name: avatar
      type: uuid
      comment: UUID of the avatar in the same region.
    comment: Ejects the specified avatar from land/parcels owned by the object's owner
      (group or resident).
  - name: Email
    parameters:
    - name: address
      type: string
      comment: Destination email address.
    - name: subject
      type: string
      comment: Subject of the email.
    - name: msg
      type: string
      comment: Message body of the email.
    comment: Sends an email with the given destination address, subject, and body
      msg. The email will be sent from `{ll.GetKey()}@lsl.secondlife.com`. This can
      be used for script communication; see llGetNextEmail()
  - name: EscapeURL
    parameters:
    - name: url
      type: string
      comment: Unescaped URL string to escape.
    return-type: string
    comment: Returns a string representing the escaped/encoded version of url, replacing
      spaces with '%20' and non-alphanumeric characters with their '%xx' hexadecimal
      UTF-8 equivalent.
    must-use: true
  - name: Euler2Rot
    parameters:
    - name: vec
      type: vector
      comment: Vector of Euler angles to convert, in radians.
    return-type: quaternion
    comment: Returns the quaternion representation of the Euler angles (in radians)
      within vec.
    must-use: true
  - name: Evade
    parameters:
    - name: target
      type: uuid
      comment: UUID of the group, avatar, or object to evade.
    - name: options
      type: list
      comment: No options currently available (should be empty list).
    comment: Directs a pathfinding character to evade target, attempting to hide from
      its pursuer if a hiding spot is available (i.e., no line of sight from the character's
      head to the pursuer's head, and no direct path on the navmesh).
  - name: ExecCharacterCmd
    parameters:
    - name: command
      type: number
      comment: Pathfinding command to execute.
    - name: options
      type: list
      comment: A list of options for the command (e.g., jump height for CHARACTER_CMD_JUMP).
    comment: Sends a command (specified by command) to the pathing system with options.
      Currently only supports stopping pathfinding or making the character jump.
  - name: Fabs
    parameters:
    - name: val
      type: number
      comment: Number to convert.
    return-type: number
    comment: Returns the absolute (positive) value of val.
    deprecated:
      reason: Double precision; fastcall.
      use: math.abs
      selene-replace:
      - math.abs(%...)
    must-use: true
  - name: FindNotecardTextCount
    parameters:
    - name: name
      type: string | uuid
      comment: Name of the notecard in the prim's inventory, or a UUID.
    - name: pattern
      type: string
      comment: Regular expression pattern to search for.
    - name: options
      type: list
      comment: A list of options to control the search (currently unused, should be
        []).
    return-type: uuid
    comment: Asynchronously requests the number of matches of pattern in the notecard
      name. Returns a key query handle for the dataserver event.
    must-use: true
  - name: FindNotecardTextSync
    parameters:
    - name: name
      type: string | uuid
      comment: Name of the notecard in the prim's inventory, or a UUID.
    - name: pattern
      type: string
      comment: Regular expression pattern to search for.
    - name: start
      type: number
      comment: Index of the first match to return.
    - name: count
      type: number
      comment: Maximum number of matches to return (if 0, returns the first 64 matches).
    - name: options
      type: list
      comment: A list of options to control the search (currently unused, should be
        []).
    return-type: '{any}'
    comment: Synchronously searches the notecard name in the region's cache for matches
      of pattern, without raising a dataserver event. Returns a strided list of the
      form [line, column, length, ...] with one stride per match, a list containing
      NAK if the notecard is not cached, or an empty list if there are no matches.
    must-use: true
  - name: FleeFrom
    parameters:
    - name: position
      type: vector
      comment: Position vector in region coordinates from which to flee.
    - name: distance
      type: number
      comment: Distance in meters to keep from the position.
    - name: options
      type: list
      comment: No options currently available (should be empty list).
    comment: Directs a pathfinding character to keep the specified distance from the
      target position vector (within the region or adjacent regions).
  - name: Floor
    parameters:
    - name: val
      type: number
      comment: Number to round down.
    return-type: number
    comment: Returns val rounded toward negative infinity. In other words, returns
      the largest integer less than or equal to val.
    deprecated:
      reason: Fastcall.
      use: math.floor
      selene-replace:
      - math.floor(%...)
    must-use: true
  - name: ForceMouselook
    parameters:
    - name: mouselook
      type: boolean | number
      comment: Boolean. If TRUE, forces a sitting avatar into mouselook; if FALSE,
        allows them to keep their current camera mode.
    comment: Sets whether any avatar sitting on this prim is forced into mouselook
      mode. Setting mouselook to TRUE forces the mode; FALSE (default) allows the
      avatar to keep their current camera mode.
  - name: Frand
    parameters:
    - name: mag
      type: number
      comment: Float magnitude of the random range.
    return-type: number
    comment: Returns a pseudo-random float in the range [0.0, mag) or (mag, 0.0] depending
      on the sign of mag. The value is inclusive of 0.0 but exclusive of mag.
    must-use: true
  - name: GenerateKey
    return-type: uuid
    comment: Generates and returns a unique versioned UUID key (utilizing SHA-1 hashing).
      Due to being versioned, it will not return NULL_KEY; however, the exact UUID
      version is an implementation detail that should not be relied upon.
    must-use: true
  - name: GetAccel
    return-type: vector
    comment: Returns a vector representing the acceleration of the object in the region's
      frame of reference.
    must-use: true
  - name: GetAgentInfo
    parameters:
    - name: id
      type: uuid
      comment: UUID of the avatar in the same region.
    return-type: number
    comment: Returns an integer bitfield containing status information about the agent
      specified by id (such as AGENT_FLYING, AGENT_ATTACHMENTS, AGENT_SITTING, etc.).
    must-use: true
  - name: GetAgentLanguage
    parameters:
    - name: avatar
      type: uuid
      comment: UUID of the avatar in the same region.
    return-type: string
    comment: Returns a string representing the language code of the preferred interface
      language set by the avatar.
    must-use: true
  - name: GetAgentList
    parameters:
    - name: scope
      type: number
      comment: Scope flag (AGENT_LIST_PARCEL, AGENT_LIST_PARCEL_OWNER, or AGENT_LIST_REGION)
        to filter the returned agents.
    - name: options
      type: list
      comment: A list of options to apply (currently unused).
    return-type: '{uuid}'
    comment: Requests a list of avatar UUID keys for agents currently in the region,
      limited by scope. Returns a list of keys or a list containing an error message
      string.
    must-use: true
  - name: GetAgentSize
    parameters:
    - name: avatar
      type: uuid
      comment: UUID of the avatar in the same region.
    return-type: vector
    comment: Returns a vector representing the estimated bounding box size of the
      specified avatar, or ZERO_VECTOR if they are not in the same region.
    must-use: true
  - name: GetAlpha
    parameters:
    - name: face
      type: number
      comment: Face number or ALL_SIDES.
    return-type: number
    comment: Returns a float representing the Blinn-Phong alpha (transparency) of
      face. If face is ALL_SIDES, returns the mean average of all faces.
    must-use: true
  - name: GetAnimation
    parameters:
    - name: avatar
      type: uuid
      comment: UUID of the avatar in the same region.
    return-type: string
    comment: Returns a string representing the name of the currently playing locomotion
      animation for the specified avatar.
    must-use: true
  - name: GetAnimationList
    parameters:
    - name: avatar
      type: uuid
      comment: UUID of the avatar in the same region.
    return-type: '{uuid}'
    comment: Returns a list of keys (UUIDs) representing all active animations currently
      playing on the specified avatar.
    must-use: true
  - name: GetAnimationOverride
    parameters:
    - name: anim_state
      type: string
      comment: Animation state string to query.
    return-type: string
    comment: Returns a string representing the name of the animation currently overriding
      the specified anim_state. Requires the PERMISSION_OVERRIDE_ANIMATIONS or PERMISSION_TRIGGER_ANIMATION
      runtime permission.
    must-use: true
  - name: GetAttached
    return-type: number
    comment: Returns the integer attachment point (an ATTACH_* constant) that the
      object is attached to, or 0 if it is unattached or pending detachment.
    must-use: true
  - name: GetAttachedList
    parameters:
    - name: avatar
      type: uuid
      comment: UUID of the avatar in the same region.
    return-type: '{uuid} | {string}'
    comment: Returns a list of object keys (UUIDs) worn by the specified avatar, in
      the order they were attached. HUDs are not included because they are neither
      public nor visible. Returns a list containing an error message string on failure.
    must-use: true
  - name: GetAttachedListFiltered
    parameters:
    - name: avatar
      type: uuid
      comment: UUID of the avatar in the same region.
    - name: options
      type: list | AttachedListFilterParams
      comment: A list of options to filter the returned attachments.
    return-type: '{uuid} | {string}'
    comment: Returns a list of object keys (UUIDs) worn by the specified avatar, in
      the order they were attached, filtered by options. Returns a list containing
      an error message string on failure.
    must-use: true
  - name: GetBoundingBox
    parameters:
    - name: object
      type: uuid
      comment: UUID of the avatar or prim in the same region.
    return-type: '{vector}'
    comment: Returns the bounding box of object (including any linked prims) relative
      to its root prim in local coordinates, formatted as [ (vector) min_corner, (vector)
      max_corner ].
    must-use: true
  - name: GetCameraAspect
    return-type: number
    comment: Returns a float representing the camera's current aspect ratio (width/height)
      of the agent who granted PERMISSION_TRACK_CAMERA. Returns 0.0 if permissions
      are not granted.
    must-use: true
  - name: GetCameraFOV
    return-type: number
    comment: Returns a float representing the camera's current field of view (FOV)
      in radians of the agent who granted PERMISSION_TRACK_CAMERA. Returns 0.0 if
      permissions are not granted.
    must-use: true
  - name: GetCameraPos
    return-type: vector
    comment: Returns a vector representing the camera's current position in region
      coordinates of the agent who granted PERMISSION_TRACK_CAMERA. Returns ZERO_VECTOR
      if permissions are not granted.
    must-use: true
  - name: GetCameraRot
    return-type: quaternion
    comment: Returns a rotation representing the camera's current orientation of the
      agent who granted PERMISSION_TRACK_CAMERA. Returns ZERO_ROTATION if permissions
      are not granted.
    must-use: true
  - name: GetCenterOfMass
    return-type: vector
    comment: Returns the vector position (in region coordinates) of the center of
      mass. Returns the individual child prim's center of mass if called from a child,
      or the entire linkset's center of mass if called from the root.
    must-use: true
  - name: GetClosestNavPoint
    parameters:
    - name: point
      type: vector
      comment: Position vector in region-local coordinates.
    - name: options
      type: list | GetClosestNavPointParams
      comment: A list of GCNP_* flags and parameters to configure the search limits.
    return-type: '{vector}'
    comment: Returns a list containing the closest vector position on the navigation
      mesh (navmesh) to the specified point (expressed in region-local space), or
      an empty list if none is found. Configured using options.
    must-use: true
  - name: GetColor
    parameters:
    - name: face
      type: number
      comment: Face number or ALL_SIDES.
    return-type: vector
    comment: Returns the Blinn-Phong RGB color vector of face (values between 0.0
      and 1.0). If face is ALL_SIDES, returns the mean average of all faces.
    must-use: true
  - name: GetCreator
    return-type: uuid
    comment: Returns the key (UUID) of the prim's original creator.
    must-use: true
  - name: GetDate
    return-type: string
    comment: Returns a string representing the current date in the UTC time zone in
      the format 'YYYY-MM-DD'.
    must-use: true
  - name: GetDayLength
    return-type: number
    comment: Returns an integer representing the number of seconds in the environmental
      day cycle applied to the current parcel.
    must-use: true
  - name: GetDayOffset
    return-type: number
    comment: Returns an integer representing the offset duration (in seconds) added
      to calculate the current environmental time on this parcel.
    must-use: true
  - name: GetDisplayName
    parameters:
    - name: id
      type: uuid
      comment: UUID of the avatar in the same region or otherwise known to the region.
    return-type: string
    comment: Returns the display name string of the avatar specified by id if they
      are in the region or cached; returns an empty string otherwise (use llRequestDisplayName
      if the avatar is absent).
    must-use: true
  - name: GetEnergy
    return-type: number
    comment: Returns a float representing the remaining physics energy of the object
      as a percentage (0.0 to 1.0) of its maximum capacity.
    must-use: true
  - name: GetEnv
    parameters:
    - name: name
      type: string
      comment: Name of the regional data to request (unrecognized strings return an
        empty string).
    return-type: string
    comment: Returns a string containing the requested regional data specified by
      name.
    must-use: true
  - name: GetEnvironment
    parameters:
    - name: pos
      type: vector
      comment: Position vector in region coordinates (X/Y determine the parcel, or
        region if X/Y are -1; Z determines the sky track altitude).
    - name: params
      type: '{number}'
      comment: A list of environmental attributes to retrieve.
    return-type: '{any}'
    comment: Returns a list containing the current environment parameters for the
      parcel or region at pos, retrieved in the order specified by params.
    must-use: true
  - name: GetExperienceDetails
    parameters:
    - name: experience_id
      type: uuid
      comment: UUID of the experience to query (can be NULL_KEY to retrieve details
        for the script's own experience).
    return-type: '{any}'
    comment: Returns a list of details for the specified experience_id, formatted
      as [string experience_name, key owner_id, key experience_id, integer state,
      string state_message, key group_id].
    must-use: true
  - name: GetExperienceErrorMessage
    parameters:
    - name: error
      type: number
      comment: XP_ERROR_* error code constant to translate.
    return-type: string
    comment: Returns a text description of the specified experience error code, or
      a description of XP_ERROR_UNKNOWN_ERROR if the error is invalid.
    must-use: true
  - name: GetExperienceList
    parameters:
    - name: agentid
      type: uuid
    return-type: '{uuid}'
    deprecated: true
    must-use: true
  - name: GetForce
    return-type: vector
    comment: Returns a vector representing the constant force currently applied to
      the object (if the object is physical).
    must-use: true
  - name: GetFreeMemory
    return-type: number
    comment: Returns an integer representing the number of free bytes of memory currently
      available to the script.
    must-use: true
  - name: GetFreeURLs
    return-type: number
    comment: Returns an integer representing the number of available HTTP URLs (remaining
      for the owner if the object is attached, or for the region if unattached).
    must-use: true
  - name: GetGMTclock
    return-type: number
    comment: Returns a float representing the time in seconds since midnight GMT (truncated
      to whole seconds).
    must-use: true
  - name: GetGameControlMode
    parameters:
    - name: id
      type: uuid
      comment: UUID of the avatar whose game-controller state to query.
    return-type: number
    comment: Returns a GAME_CONTROL_MODE_* integer indicating the current game-control
      mode for the avatar specified by id.
    must-use: true
  - name: GetGameControlModeAxes
    parameters:
    - name: id
      type: uuid
      comment: UUID of the avatar whose game-controller state to query.
    return-type: '{number}'
    comment: Returns a list of floats representing the modal axes for the current
      game-control mode of the avatar specified by id. Element count and index meanings
      vary by mode; use the GAME_CONTROL_AXIS_* constants as indices.
    must-use: true
  - name: GetGameControlModeButtons
    parameters:
    - name: id
      type: uuid
      comment: UUID of the avatar whose game-controller state to query.
    return-type: number
    comment: Returns a bitmask of the modal buttons currently active for the current
      game-control mode of the avatar specified by id. Bit meanings vary by mode;
      use the GAME_CONTROL_BUTTON_* constants as masks.
    must-use: true
  - name: GetGeometricCenter
    return-type: vector
    comment: Returns a vector representing the geometric center of the object relative
      to its root prim.
    must-use: true
  - name: GetHTTPHeader
    parameters:
    - name: request_id
      type: uuid
      comment: Unique key of the HTTP request.
    - name: header
      type: string
      comment: Lowercase name of the HTTP header to retrieve.
    return-type: string
    comment: Returns a string representing the value of the specified header associated
      with the HTTP request_id.
    must-use: true
  - name: GetHealth
    parameters:
    - name: id
      type: uuid
      comment: UUID of the agent or object to query.
    return-type: number
    comment: Returns a float representing the current health of the avatar or object
      specified by id.
    must-use: true
  - name: GetInventoryAcquireTime
    parameters:
    - name: item
      type: string
      comment: Name of the item in the prim's inventory.
    return-type: string
    comment: Returns the time when the item was placed in the prim's inventory, as
      a UTC timestamp string of the form "YYYY-MM-DDThh:mm:ssZ"
    must-use: true
  - name: GetInventoryCreator
    parameters:
    - name: item
      type: string
      comment: Name of the item in the prim's inventory.
    return-type: uuid
    comment: Returns the key (UUID) of the creator of the specified inventory item.
    must-use: true
  - name: GetInventoryDesc
    parameters:
    - name: item
      type: string
      comment: Name of the item in the prim's inventory.
    return-type: string
    comment: Returns the description string of the specified inventory item.
    must-use: true
  - name: GetInventoryKey
    parameters:
    - name: item
      type: string
      comment: Name of the item in the prim's inventory.
    return-type: uuid
    comment: Returns the key (UUID) of the specified inventory item.
    must-use: true
  - name: GetInventoryName
    parameters:
    - name: type
      type: number
      comment: INVENTORY_* type constant of the item.
    - name: index
      type: number
      comment: Index of the item of that type.
    return-type: string
    comment: Returns the name of the inventory item of the specified type (INVENTORY_*)
      at the specified inventory index.
    must-use: true
  - name: GetInventoryNumber
    parameters:
    - name: type
      type: number
      comment: INVENTORY_* type constant to count.
    return-type: number
    comment: Returns the count of items of the specified type (INVENTORY_*) in the
      prim's inventory.
    must-use: true
  - name: GetInventoryPermMask
    parameters:
    - name: item
      type: string
      comment: Name of the item in the prim's inventory.
    - name: group
      type: number
      comment: MASK_* group (e.g., MASK_BASE, MASK_OWNER, MASK_GROUP, MASK_EVERYONE,
        or MASK_NEXT) to get.
    return-type: number
    comment: Returns the specified item's permission flags for the specified group.
    must-use: true
  - name: GetInventoryType
    parameters:
    - name: item
      type: string
      comment: Name of the item in the prim's inventory.
    return-type: number
    comment: Returns an integer representing the INVENTORY_* type of the named inventory
      item.
    must-use: true
  - name: GetKey
    return-type: uuid
    comment: Returns the key (UUID) of the prim containing the script.
    must-use: true
  - name: GetLandOwnerAt
    parameters:
    - name: pos
      type: vector
      comment: Position vector in region coordinates.
    return-type: uuid
    comment: Returns the key (UUID) of the land owner at the vector pos, or NULL_KEY
      if the land is public.
    must-use: true
  - name: GetLinkKey
    parameters:
    - name: link
      type: number
      comment: Link number (1 for root, >1 for children) or a LINK_* flag.
    return-type: uuid
    comment: Returns the key (UUID) of the linked prim or avatar specified by link.
    must-use: true
  - name: GetLinkMedia
    parameters:
    - name: link
      type: number
      comment: Link number (1 for root, >1 for children) or a LINK_* flag.
    - name: face
      type: number
      comment: Face number (side) of the prim.
    - name: params
      type: '{number}'
      comment: A list of PRIM_MEDIA_* property constants to retrieve values for.
    return-type: '{any}'
    comment: Returns a list containing the media parameters of the specified face
      on the linked prim link, retrieved in the order requested by params.
    must-use: true
  - name: GetLinkName
    parameters:
    - name: link
      type: number
      comment: Link number (1 for root, >1 for children) or a LINK_* flag.
    return-type: string
    comment: Returns a string containing the name of the linked prim specified by
      link.
    must-use: true
  - name: GetLinkNumber
    return-type: number
    comment: Returns the integer link number of the prim containing the script (0
      for unlinked, 1 for the root, and 2+ for children).
    must-use: true
  - name: GetLinkNumberOfSides
    parameters:
    - name: link
      type: number
      comment: Link number (1 for root, >1 for children) or a LINK_* flag.
    return-type: number
    comment: Returns an integer representing the number of sides (faces) of the linked
      prim specified by link.
    must-use: true
  - name: GetLinkPrimitiveParams
    parameters:
    - name: link
      type: number
      comment: Link number (1 for root, >1 for children) or a LINK_* flag to retrieve
        parameters from.
    - name: params
      type: '{number}'
      comment: A list of PRIM_* flags specifying the attributes to retrieve.
    return-type: '{any}'
    comment: Returns a list of primitive parameters requested in params for the linked
      prim specified by link (equivalent to llGetPrimitiveParams).
    must-use: true
  - name: GetLinkSitFlags
    parameters:
    - name: link
      type: number
      comment: Link number (1 for root, >1 for children) or a LINK_* flag.
    return-type: number
    comment: Returns an integer representing the active sit flags currently set on
      the linked prim specified by link.
    must-use: true
  - name: GetListEntryType
    parameters:
    - name: src
      type: list
      comment: Source list containing the element of interest.
    - name: index
      type: number
      comment: Zero-based index of the entry.
    return-type: number
    comment: Returns an integer representing the variable type (TYPE_*) of the list
      entry at index in the list src.
    deprecated:
      use: typeof
      selene-replace:
      - typeof(%1[%2])
    must-use: true
  - name: GetListLength
    parameters:
    - name: src
      type: list
      comment: List to measure.
    return-type: number
    comment: Returns an integer representing the total number of elements in the list
      src.
    deprecated:
      reason: Use '#' or 'rawlen' instead. Metatable support.
      selene-replace:
      - '#%1'
      - rawlen(%1)
    must-use: true
  - name: GetLocalPos
    return-type: vector
    comment: Returns a position vector relative to the root prim. If called from the
      root prim, it returns the global region position (or the position relative to
      the attachment point if attached).
    must-use: true
  - name: GetLocalRot
    return-type: quaternion
    comment: Returns a rotation representing the local orientation of a child prim
      relative to the root prim, or the object's overall rotation if called from the
      root.
    must-use: true
  - name: GetMass
    return-type: number
    comment: Returns a float representing the mass of the object (in lindograms).
      Returns the total linkset mass if called from the root, or the individual prim's
      mass if called from a child prim. Returns the wearer's mass if inside an attachment.
    must-use: true
  - name: GetMassMKS
    return-type: number
    comment: Returns a float representing the mass of the object in kilograms. Functionally
      identical to llGetMass except for using MKS (metric) units.
    must-use: true
  - name: GetMaxScaleFactor
    return-type: number
    comment: Returns a float representing the maximum scale factor that can be applied
      to the object via llScaleByFactor without violating size or linkability limits.
    must-use: true
  - name: GetMemoryLimit
    return-type: number
    comment: Returns an integer representing the maximum memory limit (in bytes) that
      the script is allowed to allocate.
    must-use: true
  - name: GetMinScaleFactor
    return-type: number
    comment: Returns a float representing the minimum scale factor that can be applied
      to the object via llScaleByFactor without violating size limits.
    must-use: true
  - name: GetMoonDirection
    return-type: vector
    comment: Returns a normalized vector representing the current direction of the
      parcel's moon, taking altitude into account. Falls back to the region's moon
      direction if no custom parcel environment is set.
    must-use: true
  - name: GetMoonRotation
    return-type: quaternion
    comment: Returns a rotation representing the orientation applied to the moon on
      the current parcel and altitude track. Falls back to the region's moon rotation
      if no custom parcel environment is set.
    must-use: true
  - name: GetNextEmail
    parameters:
    - name: address
      type: string
      comment: Sender email address filter, or "" for any address.
    - name: subject
      type: string
      comment: Email subject filter, or "" for any subject.
    comment: 'Requests the next queued email via the email event. Emails must

      1. Be sent to `{ll.GetKey()}@lsl.secondlife.com`

      2. Be sent from the specified sender Address (or any address if blank)

      3. Have the specified subject Subject (or any subject if blank)'
  - name: GetNotecardLine
    parameters:
    - name: name
      type: string | uuid
      comment: Name of the notecard in the prim's inventory, or a UUID.
    - name: line
      type: number
      comment: Index of the line to read.
    return-type: uuid
    comment: Asynchronously requests the text of line in the notecard name. Returns
      a key query handle for the dataserver event, which receives EOF if line is past
      the end of the notecard.
  - name: GetNotecardLineSync
    parameters:
    - name: name
      type: string | uuid
      comment: Name of the notecard in the prim's inventory, or a UUID.
    - name: line
      type: number
      comment: Index of the line to read.
    return-type: string
    comment: Synchronously reads the text of line in the notecard name from the region's
      cache, without raising a dataserver event. Returns NAK if the notecard is not
      cached, or EOF if line is past the end of the notecard.
    must-use: true
  - name: GetNumberOfNotecardLines
    parameters:
    - name: name
      type: string | uuid
      comment: Name of the notecard in the prim's inventory, or a UUID.
    return-type: uuid
    comment: Asynchronously requests the number of lines in the notecard name. Returns
      a key query handle for the dataserver event.
  - name: GetNumberOfPrims
    return-type: number
    comment: Returns an integer representing the total number of prims and seated
      avatars in the linkset containing the script.
    must-use: true
  - name: GetNumberOfSides
    return-type: number
    comment: Returns an integer representing the total number of sides (faces) of
      the prim containing the script.
    must-use: true
  - name: GetObjectAnimationNames
    return-type: '{string}'
    comment: Returns a list of strings representing the names or UUIDs of all active
      animations currently playing on the object.
    must-use: true
  - name: GetObjectDesc
    return-type: string
    comment: Returns a string containing the description of the specific prim containing
      the script.
    must-use: true
  - name: GetObjectDetails
    parameters:
    - name: id
      type: uuid
      comment: UUID of the avatar or prim (in the same or adjacent regions) to query.
    - name: params
      type: '{number}'
      comment: A list of OBJECT_* flags specifying the attributes to retrieve.
    return-type: '{any}'
    comment: Returns a list containing the requested parameters of the specified avatar
      or object id, retrieved in the order requested by params.
    must-use: true
  - name: GetObjectLinkKey
    parameters:
    - name: object_id
      type: uuid
      comment: UUID of the target prim or linkset.
    - name: link
      type: number
      comment: Link number (1 for root, >1 for children) or a LINK_* flag of the prim
        to retrieve.
    return-type: uuid
    comment: Returns the key (UUID) of the linked child prim specified by link within
      the linkset identified by object_id.
    must-use: true
  - name: GetObjectMass
    parameters:
    - name: id
      type: uuid
      comment: UUID of the avatar or object to query.
    return-type: number
    comment: Returns a float representing the mass of the avatar or object specified
      by id.
    must-use: true
  - name: GetObjectName
    return-type: string
    comment: Returns a string containing the name of the specific prim containing
      the script.
    must-use: true
  - name: GetObjectPermMask
    parameters:
    - name: group
      type: number
      comment: MASK_* group (e.g., MASK_BASE, MASK_OWNER, MASK_GROUP, MASK_EVERYONE,
        or MASK_NEXT) to get.
    return-type: number
    comment: Returns the script's object's permission flags for the specified group.
    must-use: true
  - name: GetObjectPrimCount
    parameters:
    - name: prim
      type: uuid
      comment: UUID of the prim in the same region.
    return-type: number
    comment: Returns an integer representing the total number of prims in the object
      containing the specified prim.
    must-use: true
  - name: GetOmega
    return-type: vector
    comment: Returns a vector representing the physical rotation (angular velocity)
      of the object in radians per second.
    must-use: true
  - name: GetOwner
    return-type: uuid
    comment: Returns the key (UUID) of the object's current owner.
    must-use: true
  - name: GetOwnerKey
    parameters:
    - name: id
      type: uuid
      comment: UUID of the prim in the same region.
    return-type: uuid
    comment: Returns the key (UUID) of the owner of the prim specified by id.
    must-use: true
  - name: GetParcelDetails
    parameters:
    - name: pos
      type: vector
      comment: Position vector in region coordinates (only the X and Y components
        are used).
    - name: params
      type: '{number}'
      comment: A list of PARCEL_DETAILS_* flags specifying the attributes to retrieve.
    return-type: '{any}'
    comment: Returns a list containing the requested parcel details specified by params
      (retrieved in the same order) for the parcel at the vector pos.
    must-use: true
  - name: GetParcelFlags
    parameters:
    - name: pos
      type: vector
      comment: Position vector in region coordinates (the Z component is ignored).
    return-type: number
    comment: Returns an integer bitfield of parcel flags (PARCEL_FLAG_*) for the parcel
      at the position pos.
    must-use: true
  - name: GetParcelMaxPrims
    parameters:
    - name: pos
      type: vector
      comment: Position vector in region coordinates (the Z component is ignored).
    - name: sim_wide
      type: boolean | number
      comment: Boolean. If TRUE, returns the combined land impact limit for all parcels
        owned by the parcel owner in the region; if FALSE, returns only the limit
        for the specified parcel.
    return-type: number
    comment: Returns an integer representing the maximum combined land impact (prim
      limit) allowed for objects on the parcel at pos, determined either for the single
      parcel or sim-wide based on sim_wide.
    must-use: true
  - name: GetParcelMusicURL
    return-type: string
    comment: Returns a string containing the parcel's streaming music (audio) URL.
      The object owner must also be the land owner (or share the same group deeding).
    must-use: true
  - name: GetParcelPrimCount
    parameters:
    - name: pos
      type: vector
      comment: Position vector in region coordinates (the Z component is ignored).
    - name: category
      type: number
      comment: PARCEL_COUNT_* category flag.
    - name: sim_wide
      type: boolean | number
      comment: Boolean. If TRUE, searches all parcels in the region owned by the targeted
        parcel's owner; if FALSE, searches only the specified parcel.
    return-type: number
    comment: Returns an integer representing the total land impact of objects on the
      parcel at pos in the specified category. If sim_wide is TRUE, returns combined
      usage for all regional parcels owned by the parcel owner; if FALSE, returns
      usage for only the specified parcel.
    must-use: true
  - name: GetParcelPrimOwners
    parameters:
    - name: pos
      type: vector
      comment: Position vector in region coordinates.
    return-type: '{any}'
    comment: Returns a list of up to 100 strides (formatted as [key owner, integer
      land_impact]) representing owners of objects on the parcel at pos, sorted by
      owner key. Requires owner-like permissions for the parcel and the script owner's
      presence in the region.
    must-use: true
  - name: GetPermissions
    return-type: number
    comment: Returns an integer bitfield representing the permissions (PERMISSION_*)
      currently granted to the script.
    must-use: true
  - name: GetPermissionsKey
    return-type: uuid
    comment: Returns the key (UUID) of the avatar that last granted or declined permissions
      to the script, or NULL_KEY if the permissions request was ignored or cancelled.
    must-use: true
  - name: GetPhysicsMaterial
    return-type: '{number}'
    comment: Returns a list of the format [float gravity_multiplier, float restitution,
      float friction, float density] detailing the physical characteristics of the
      object.
    must-use: true
  - name: GetPos
    return-type: vector
    comment: Returns a vector representing the current position of the object in region
      coordinates.
    must-use: true
  - name: GetPrimMediaParams
    parameters:
    - name: face
      type: number
      comment: Face number (side) of the prim.
    - name: params
      type: '{number}'
      comment: A list of PRIM_MEDIA_* property constants to retrieve values for.
    return-type: '{any}'
    comment: Returns a list containing the media parameters of the specified face,
      retrieved in the order requested by params. Returns an empty list if no media
      exists on the face.
    must-use: true
  - name: GetPrimitiveParams
    parameters:
    - name: params
      type: '{number}'
      comment: A list of PRIM_* flags specifying the attributes to retrieve.
    return-type: '{any}'
    comment: Returns a list of primitive attribute values matching the requested params
      list.
    must-use: true
  - name: GetRegionAgentCount
    return-type: number
    comment: Returns an integer representing the current number of avatars in the
      region.
    must-use: true
  - name: GetRegionCorner
    return-type: vector
    comment: Returns a vector (in meters) representing the global grid coordinates
      of the south-west corner of the current region (Z component is always 0.0).
    must-use: true
  - name: GetRegionDayLength
    return-type: number
    comment: Returns an integer representing the total number of seconds in the region-wide
      day cycle.
    must-use: true
  - name: GetRegionDayOffset
    return-type: number
    comment: Returns an integer representing the offset duration (in seconds) added
      to calculate the current environmental time for the region.
    must-use: true
  - name: GetRegionFPS
    return-type: number
    comment: Returns a float representing the average region simulator frames per
      second (FPS).
    must-use: true
  - name: GetRegionFlags
    return-type: number
    comment: Returns an integer bitfield representing the region flags (REGION_FLAG_*)
      currently enabled for the region containing the object.
    must-use: true
  - name: GetRegionMoonDirection
    return-type: vector
    comment: Returns a normalized vector representing the current direction of the
      region's moon, taking altitude into account.
    must-use: true
  - name: GetRegionMoonRotation
    return-type: quaternion
    comment: Returns a rotation representing the orientation applied to the moon at
      the region level, taking altitude track into account.
    must-use: true
  - name: GetRegionName
    return-type: string
    comment: Returns a string containing the name of the current region.
    must-use: true
  - name: GetRegionSunDirection
    return-type: vector
    comment: Returns a normalized vector representing the current direction of the
      region's sun, taking altitude into account.
    must-use: true
  - name: GetRegionSunRotation
    return-type: quaternion
    comment: Returns a rotation representing the orientation applied to the sun at
      the region level, taking altitude track into account.
    must-use: true
  - name: GetRegionTimeDilation
    return-type: number
    comment: Returns a float representing the current physics time dilation of the
      region, ranging from 0.0 (full dilation / slow) to 1.0 (no dilation / real-world
      speed).
    must-use: true
  - name: GetRegionTimeOfDay
    return-type: number
    comment: Returns a float with subsecond precision representing the elapsed seconds
      since region environmental midnight or region uptime (whichever is smaller).
      If the region's sun position is fixed, returns region uptime.
    must-use: true
  - name: GetRenderMaterial
    parameters:
    - name: face
      type: number
      comment: Face number or ALL_SIDES.
    return-type: string
    comment: Returns a string representing the render material on face (returns the
      inventory name if it is in the prim's inventory, or its key UUID otherwise).
    must-use: true
  - name: GetRootPosition
    return-type: vector
    comment: Returns a vector representing the position (in region coordinates) of
      the root prim of the linkset containing the script.
    must-use: true
  - name: GetRootRotation
    return-type: quaternion
    comment: Returns a rotation representing the orientation (relative to the region)
      of the root prim of the linkset containing the script.
    must-use: true
  - name: GetRot
    return-type: quaternion
    comment: Returns a rotation representing the prim's orientation relative to the
      region's axes.
    must-use: true
  - name: GetSPMaxMemory
    return-type: number
    comment: Returns an integer representing the maximum memory (in bytes) used by
      the script while the memory profiler was last active (only valid after using
      PROFILE_SCRIPT_MEMORY).
    must-use: true
  - name: GetScale
    return-type: vector
    comment: Returns a vector representing the physical scale (dimensions in meters)
      of the prim containing the script.
    must-use: true
  - name: GetScriptName
    return-type: string
    comment: Returns a string containing the name of the script calling this function.
    must-use: true
  - name: GetScriptState
    parameters:
    - name: script
      type: string
      comment: Name of the script in the prim's inventory.
    return-type: boolean
    comment: Returns a boolean integer indicating whether the specified script in
      the prim's inventory is running (returns TRUE if running, FALSE otherwise).
    must-use: true
  - name: GetSimStats
    parameters:
    - name: stat_type
      type: number
      comment: SIM_STAT_* flag of the statistic to retrieve.
    return-type: number
    comment: Returns a float containing the value of the requested region statistic
      specified by stat_type.
    must-use: true
  - name: GetSimulatorHostname
    return-type: string
    comment: Returns a string containing the hostname of the server machine running
      the script (e.g., 'sim225.agni.lindenlab.com').
    must-use: true
  - name: GetStartParameter
    return-type: number
    comment: Returns an integer representing the start/rez parameter passed to the
      object on creation (returns 0 if rezzed by an agent).
    must-use: true
  - name: GetStartString
    return-type: string
    comment: Returns the initialization string passed to the object's root prim on
      rez with llRezObjectWithParams (via REZ_PARAM_STRING; returns an empty string
      if rezzed by an agent).
    must-use: true
  - name: GetStaticPath
    parameters:
    - name: start_pos
      type: vector
      comment: Starting position vector.
    - name: end_pos
      type: vector
      comment: Target end position vector.
    - name: radius
      type: number
      comment: Radius of the character path, between 0.125m and 5.0m.
    - name: params
      type: list | GetStaticPathParams
      comment: A list specifying the CHARACTER_TYPE parameter (defaults to CHARACTER_TYPE_NONE).
    return-type: '{any}'
    comment: Returns a list of position vectors representing pathfinding waypoints
      between start and end on the static navmesh for a character of the specified
      radius. Ignores movable obstacles and can be used in any region regardless of
      dynamic pathfinding status.
    must-use: true
  - name: GetStatus
    parameters:
    - name: status
      type: number
      comment: Single STATUS_* flag to check.
    return-type: boolean
    comment: Returns a boolean integer indicating whether the specified status flag
      status is enabled for the object.
    must-use: true
  - name: GetSubString
    parameters:
    - name: src
      type: string
      comment: Source string to slice.
    - name: start_index
      type: number
      comment: Starting codepoint index (inclusive). Supports negative indexing.
    - name: end_index
      type: number
      comment: Ending codepoint index (inclusive). Supports negative indexing.
    return-type: string
    comment: Returns a copy of the substring from src within the inclusive codepoint
      range start_index..end_index. Negative indices count backward from the end of
      the string. If start_index is greater than end_index, the substring is the excluded
      range.
    must-use: true
  - name: GetSunDirection
    return-type: vector
    comment: Returns a normalized vector representing the current direction of the
      parcel's sun, taking altitude into account. Falls back to the region's sun direction
      if no custom parcel environment is set.
    must-use: true
  - name: GetSunRotation
    return-type: quaternion
    comment: Returns a rotation representing the orientation applied to the sun on
      the current parcel and altitude track. Falls back to the region's sun rotation
      if no custom parcel environment is set.
    must-use: true
  - name: GetTexture
    parameters:
    - name: face
      type: number
      comment: Face number or ALL_SIDES.
    return-type: string
    comment: Returns a string representing the Blinn-Phong diffuse texture on face
      (returns the inventory name if it is a texture in the prim's inventory, or its
      key UUID otherwise).
    must-use: true
  - name: GetTextureOffset
    parameters:
    - name: face
      type: number
      comment: Face number or ALL_SIDES.
    return-type: vector
    comment: Returns a vector containing the texture offsets of face in the X (horizontal
      U) and Y (vertical V) components (Z is unused).
    must-use: true
  - name: GetTextureRot
    parameters:
    - name: face
      type: number
      comment: Face number or ALL_SIDES.
    return-type: number
    comment: Returns a float representing the texture rotation angle (in radians)
      on face.
    must-use: true
  - name: GetTextureScale
    parameters:
    - name: face
      type: number
      comment: Face number or ALL_SIDES.
    return-type: vector
    comment: Returns a vector containing the texture scales of face in the X and Y
      components (Z is unused).
    must-use: true
  - name: GetTime
    return-type: number
    comment: Returns a float representing the elapsed script time in seconds with
      subsecond precision (since the script started, was reset, or since the last
      call to llResetTime or llGetAndResetTime).
    must-use: true
  - name: GetTimeOfDay
    return-type: number
    comment: Returns a float with subsecond precision representing the elapsed seconds
      since parcel environmental midnight or region uptime (whichever is smaller).
      If the parcel's sun position is fixed, returns region uptime.
    must-use: true
  - name: GetTimestamp
    return-type: string
    comment: Returns a string containing the current date and time in the UTC time
      zone formatted as an ISO 8601 timestamp ('YYYY-MM-DDThh:mm:ss.ff..fZ').
    must-use: true
  - name: GetTorque
    return-type: vector
    comment: Returns a vector representing the physical torque force currently acting
      on the object (if the object is physical).
    must-use: true
  - name: GetUnixTime
    return-type: number
    comment: Returns an integer representing the current Unix timestamp (the number
      of seconds elapsed since 00:00:00 Jan 1, 1970 UTC).
    deprecated:
      reason: Int32 will wrap on 2038-01-19
      use: os.time
    must-use: true
  - name: GetUsedMemory
    return-type: number
    comment: Returns an integer representing the total number of bytes of memory currently
      used by the script (non-Mono scripts always return 16,384 bytes).
    must-use: true
  - name: GetUsername
    parameters:
    - name: id
      type: uuid
      comment: UUID of the avatar in the same region or otherwise known to the region.
    return-type: string
    comment: Returns a string representing the unique username of the avatar specified
      by id if they are connected to the region or cached; returns an empty string
      otherwise (use llRequestUsername if the avatar is absent).
    must-use: true
  - name: GetVel
    return-type: vector
    comment: Returns a vector representing the velocity of the object (in meters per
      second) relative to the global region coordinates. For physical objects, returns
      the velocity of its center of mass.
    must-use: true
  - name: GetVisualParams
    parameters:
    - name: agentid
      type: uuid
      comment: UUID of the avatar in the same region.
    - name: params
      type: '{number | string}'
      comment: A list of visual parameter IDs or names to retrieve values for.
    return-type: '{number | ""}'
    comment: Returns a list containing the values of the visual parameters requested
      in params for the agent specified by agentid.
    must-use: true
  - name: GetWallclock
    return-type: number
    comment: Returns a float representing the time in seconds since midnight Pacific
      Time (PST/PDT), which is equivalent to Second Life Time (SLT) truncated to whole
      seconds.
    must-use: true
  - name: GiveAgentInventory
    parameters:
    - name: agent
      type: uuid
      comment: UUID of the target agent in the same region.
    - name: folder
      type: string
      comment: Name of the destination folder to be created
    - name: items
      type: '{string}'
      comment: The names of the items in the prim's inventory to transfer.
    - name: options
      type: list | GiveAgentInventoryParams
      comment: A list of options to configure the inventory transfer.
    return-type: number
    comment: Gives the specified inventory items to the agent as a new folder named
      folder, as permitted by the permissions system. Customizes the transfer using
      options.
  - name: GiveInventory
    parameters:
    - name: target
      type: uuid
      comment: UUID of the target agent or prim.
    - name: item
      type: string
      comment: Name of the item in the prim's inventory to transfer.
    comment: Gives the specified inventory item to the target, as permitted by the
      permissions system. The target can be any agent or an object located in the
      same region.
  - name: GiveInventoryList
    parameters:
    - name: target
      type: uuid
      comment: UUID of the target agent or prim in the same region.
    - name: folder
      type: string
      comment: Name of the destination folder to be created (ignored if the target
        is an object).
    - name: items
      type: '{string}'
      comment: The names of the items in the prim's inventory to transfer.
    comment: Gives the list of inventory items to target as a new folder named folder.
      If target is an object, the items are passed directly into its inventory and
      no folder is created. The target must be an agent or an object in the same region.
  - name: GiveMoney
    parameters:
    - name: destination
      type: uuid
      comment: UUID of the destination avatar.
    - name: amount
      type: number
      comment: Number of L$ to transfer (must be greater than 0).
    return-type: number
    comment: Transfers the specified amount of L$ from the script owner to the destination
      avatar. Silently fails if the PERMISSION_DEBIT permission has not been granted.
      Returns 0 (use llTransferLindenDollars to match transactions to transaction_result
      events).
  - name: GodLikeRezObject
    parameters:
    - name: id
      type: uuid
      comment: Asset UUID of the object to rez.
    - name: pos
      type: vector
      comment: Position vector in region coordinates where the object will be rezzed.
    comment: Rezzes an object directly from a UUID specified by id at the position
      pos, provided the owner has the god-bit set.
  - name: Ground
    parameters:
    - name: offset
      type: vector
      comment: Offset relative to the prim's position, expressed in local coordinates.
    return-type: number
    comment: Returns a float representing the ground height directly below the prim's
      position offset by the vector offset.
    must-use: true
  - name: GroundContour
    parameters:
    - name: offset
      type: vector
      comment: Offset relative to the prim's position, expressed in local coordinates.
    return-type: vector
    comment: Returns a vector representing the ground contour direction (the direction
      with no change in elevation) directly below the prim's position offset by the
      vector offset.
    must-use: true
  - name: GroundNormal
    parameters:
    - name: offset
      type: vector
      comment: Offset relative to the prim's position, expressed in local coordinates.
    return-type: vector
    comment: Returns a vector representing the ground surface normal vector directly
      below the current position offset by the vector offset.
    must-use: true
  - name: GroundRepel
    parameters:
    - name: height
      type: number
      comment: Target distance in meters above the ground or water.
    - name: water
      type: boolean | number
      comment: Boolean. If TRUE, damp relative to the higher of land and water; if
        FALSE, damp relative to land only.
    - name: tau
      type: number
      comment: Timescale in seconds to critically damp the movement.
    comment: Critically damps the object's vertical motion to height (using critical
      damping timescale tau) if it is within height * 0.5 of the terrain (or water
      level if water is TRUE). Only works on physics-enabled objects; do not use with
      vehicles.
  - name: GroundSlope
    parameters:
    - name: offset
      type: vector
      comment: Offset relative to the prim's position, expressed in local coordinates.
    return-type: vector
    comment: Returns a vector representing the ground slope directly below the prim's
      position offset by the vector offset.
    must-use: true
  - name: HMAC
    parameters:
    - name: private_key
      type: string
      comment: PEM-formatted secret key to use for the HMAC hash.
    - name: msg
      type: string
      comment: Message string to be hashed.
    - name: algorithm
      type: string
      comment: Cryptographic digest algorithm to use.
    return-type: string
    comment: Returns a Base64-encoded HMAC hash of msg using the secret key private_key
      and the specified digest algorithm (md5, sha1, sha224, sha256, sha384, or sha512).
    must-use: true
  - name: HTTPRequest
    parameters:
    - name: url
      type: string
      comment: Destination HTTP or HTTPS URL.
    - name: parameters
      type: list | HttpRequestParams
      comment: A list of HTTP_* configuration flags and value pairs, or an HTTPRequestParams
        dictionary.
    - name: body
      type: string
      comment: String contents of the request body.
    return-type: uuid
    comment: Sends an HTTP request to the specified url containing body and configured
      via parameters. Raises an http_response event and returns a key query handle
      identifying the request.
  - name: HTTPResponse
    parameters:
    - name: request_id
      type: uuid
      comment: Unique key identifying the incoming HTTP request.
    - name: status
      type: number
      comment: Integer HTTP status code (such as 200, 400, or 404) to respond with.
    - name: body
      type: string
      comment: String contents of the response body.
    comment: Responds to the incoming HTTP request identified by request_id with the
      HTTP status code status and the payload body.
  - name: Hash
    parameters:
    - name: val
      type: string
      comment: String to hash.
    return-type: number
    comment: Returns an integer representing the 32-bit hash value of the string val
      (returns 0 if the string is empty).
    must-use: true
  - name: InsertString
    parameters:
    - name: dst
      type: string
      comment: Target destination string.
    - name: index
      type: number
      comment: Codepoint index where insertion starts.
    - name: src
      type: string
      comment: Source string to insert.
    return-type: string
    comment: Returns a copy of dst with src inserted at the given codepoint index.
    must-use: true
  - name: InstantMessage
    parameters:
    - name: agent
      type: uuid
      comment: UUID of the destination agent.
    - name: msg
      type: string
      comment: Text message string to send.
    comment: Sends an instant message containing msg to the agent identified by their
      key.
  - name: IntegerToBase64
    parameters:
    - name: number
      type: number
      comment: Integer number to encode.
    return-type: string
    comment: Returns an 8-character Base64 string representing the big-endian encoded
      value of number.
    deprecated:
      reason: Use 'llbase64.encode' and 'string.pack' or 'buffer.writei32' instead.
      selene-replace:
      - llbase64.encode(string.pack(">i", i))
    must-use: true
  - name: IsFriend
    parameters:
    - name: agent_id
      type: uuid
      comment: UUID of the agent to check.
    return-type: boolean
    comment: Returns TRUE if agent_id and the owner of the script are friends, and
      FALSE otherwise.
    must-use: true
  - name: IsLinkGLTFMaterial
    parameters:
    - name: link
      type: number
      comment: Link number (or LINK_* flag) of the prim to inspect.
    - name: face
      type: number
      comment: Face number (or ALL_SIDES) of the prim to inspect.
    return-type: boolean
    comment: Checks the specified face on the linked prim link. Returns TRUE if the
      face material is a PBR render material, or FALSE if it uses Blinn-Phong diffuse
      textures.
    must-use: true
  - name: Json2List
    parameters:
    - name: src
      type: string
      comment: JSON string to parse.
    return-type: '{any}'
    comment: Parses the JSON string src and returns a list representing its top-level
      elements.
    deprecated:
      use: lljson.decode
    must-use: true
  - name: JsonGetValue
    parameters:
    - name: json
      type: string
      comment: JSON string to query.
    - name: specifiers
      type: list
      comment: A list of key names or array indices specifying the path to the desired
        value.
    return-type: string
    comment: Parses the JSON string json and returns the value found by traversing
      the specified path of specifiers as a string.
    deprecated:
      reason: Also, the indices are zero-based.
      use: lljson.decode
    must-use: true
  - name: JsonSetValue
    parameters:
    - name: json
      type: string
      comment: Source JSON string to modify.
    - name: specifiers
      type: list
      comment: A list of key names or array indices specifying the path to add, update,
        or delete.
    - name: value
      type: string
      comment: New value to set, or the JSON_DELETE constant to delete the targeted
        element.
    return-type: string
    comment: Returns a new JSON string representing json with the target located at
      specifiers set to value. Supports JSON_APPEND to append elements. Writing JSON_DELETE
      deletes the target. Overwriting array bounds or setting non-array levels with
      array indices returns JSON_INVALID.
    deprecated:
      reason: Also, the indices are zero-based.
      use: lljson.encode
    must-use: true
  - name: JsonValueType
    parameters:
    - name: json
      type: string
      comment: JSON string containing the value to query.
    - name: specifiers
      type: list
      comment: A list of key names or array indices specifying the path to the value.
    return-type: string
    comment: Parses the JSON string json and returns the JSON type constant (JSON_*)
      representing the value found at specifiers.
    deprecated:
      reason: Use 'lljson.decode' and 'typeof' instead. Also, the indices are zero-based.
    must-use: true
  - name: Key2Name
    parameters:
    - name: id
      type: uuid
      comment: UUID of the target avatar or prim in the same region.
    return-type: string
    comment: Returns a string containing the name of the prim or avatar specified
      by id. The target must be a valid, rezzed entity in the current region, otherwise
      an empty string is returned. Avatars return their legacy name.
    must-use: true
  - name: KeyCountKeyValue
    return-type: uuid
    comment: Starts an asynchronous transaction requesting the total count of keys
      in the experience data store. Returns a key query handle for the dataserver
      event.
  - name: KeysKeyValue
    parameters:
    - name: first
      type: number
      comment: Zero-based start index of the keys to retrieve.
    - name: count
      type: number
      comment: Number of keys to retrieve.
    return-type: uuid
    comment: Starts an asynchronous transaction to retrieve count keys from the experience
      data store starting at the zero-based index first. Returns a key query handle
      for the dataserver event. Fails with XP_ERROR_KEY_NOT_FOUND if out of bounds.
  - name: Linear2sRGB
    parameters:
    - name: color
      type: vector
      comment: Color vector in the linear RGB space to convert.
    return-type: vector
    comment: Returns a sRGB colorspace vector converted from the linear RGB colorspace
      argument.
    must-use: true
  - name: LinkAdjustSoundVolume
    parameters:
    - name: link
      type: number
      comment: Link number (1 for root, >1 for children) or a LINK_* flag of the prim
        to adjust.
    - name: volume
      type: number
      comment: Volume level to set, between 0.0 (silent) and 1.0 (loud).
    comment: Adjusts the volume of the currently playing sound attached to the linked
      prim link (has no effect on sounds started with llTriggerSound).
  - name: LinkParticleSystem
    parameters:
    - name: link
      type: number
      comment: Link number (1 for root, >1 for children) or a LINK_* flag.
    - name: rules
      type: list | ParticleParams
      comment: A list of particle system rules and data pairs [rule1, data1, ...],
        or a ParticleParams dictionary.
    comment: Creates or updates a particle system on the linked prim link based on
      the list of rules. An empty list removes the particle system.
  - name: LinkPlaySound
    parameters:
    - name: link
      type: number
      comment: Link number (1 for root, >1 for children) or a LINK_* flag.
    - name: sound
      type: string | uuid
      comment: Name of a sound in the prim's inventory, or a UUID.
    - name: volume
      type: number
      comment: Volume level to set, between 0.0 (silent) and 1.0 (loud).
    - name: flags
      type: number
      comment: Bitwise flags (combination of SOUND_*) controlling the sound playback.
    comment: Plays the specified sound on the linked prim link (once or looping) at
      volume. Only one sound can be attached to a prim at a time; new attachments
      or calling llStopSound stops previous playback. Controlled by flags.
  - name: LinkSetSoundQueueing
    parameters:
    - name: link
      type: number
      comment: Link number (1 for root, >1 for children) or a LINK_* flag.
    - name: queue
      type: boolean | number
      comment: Boolean. If TRUE, sound queuing is enabled; if FALSE, it is disabled.
    comment: Enables or disables sound queuing on the linked prim link. When set to
      TRUE, sounds will queue and play in sequence.
  - name: LinkSetSoundRadius
    parameters:
    - name: link
      type: number
      comment: Link number (1 for root, >1 for children) or a LINK_* flag.
    - name: radius
      type: number
      comment: Maximum distance in meters at which the sounds can be heard.
    comment: Limits the audibility radius of attached and triggered scripted sounds
      to distance radius (in meters) around the linked prim link.
  - name: LinkSitTarget
    parameters:
    - name: link
      type: number
      comment: Link number (1 for root, >1 for children) or a LINK_* flag.
    - name: offset
      type: vector
      comment: Offset position vector in local prim coordinates.
    - name: rot
      type: quaternion
      comment: Rotation relative to the prim's rotation.
    comment: Sets the sit target position (offset) and orientation (rot) for the linked
      prim link, relative to the prim's own position and rotation. Clear by setting
      offset to <0.0, 0.0, 0.0>.
  - name: LinkStopSound
    parameters:
    - name: link
      type: number
      comment: Link number (1 for root, >1 for children) or a LINK_* flag.
    comment: Stops the playback of any currently playing attached sound on the linked
      prim link.
  - name: LinksetDataAvailable
    return-type: number
    comment: Returns the number of bytes remaining in the linkset datastore.
    must-use: true
  - name: LinksetDataCountFound
    parameters:
    - name: pattern
      type: string
      comment: Regular expression (regex) matching the keys to count.
    return-type: number
    comment: Returns the number of keys in the linkset datastore that match the regular
      expression pattern.
    must-use: true
  - name: LinksetDataCountKeys
    return-type: number
    comment: Returns the number of keys in the linkset datastore.
    must-use: true
  - name: LinksetDataDelete
    parameters:
    - name: name
      type: string
      comment: Name of the key to delete.
    return-type: number
    comment: Deletes the unprotected key name from the linkset datastore, triggering
      a linkset_data event if the datastore changes. Returns an integer success or
      failure code.
  - name: LinksetDataDeleteFound
    parameters:
    - name: pattern
      type: string
      comment: Regular expression (regex) matching the keys to delete.
    - name: pass
      type: string
      comment: Optional passphrase required to delete matching protected keys.
    return-type: '{number}'
    comment: Deletes all keys in the linkset datastore that match the regular expression
      pattern, triggering a linkset_data event if the datastore changes. Protected
      keys are only deleted if their passphrase matches pass. Returns a list [num_deleted,
      num_failed_protected].
  - name: LinksetDataDeleteProtected
    parameters:
    - name: name
      type: string
      comment: Name of the protected key to delete.
    - name: pass
      type: string
      comment: Passphrase required to delete the protected key.
    return-type: number
    comment: Deletes the protected key name from the linkset datastore using the passphrase
      pass, triggering a linkset_data event if the datastore changes. Returns an integer
      success or failure code.
  - name: LinksetDataFindKeys
    parameters:
    - name: pattern
      type: string
      comment: Regular expression (regex) matching the keys to return.
    - name: start
      type: number
      comment: Index of the first matching key to return.
    - name: count
      type: number
      comment: Maximum number of keys to return (or less than 1 to retrieve all matching
        keys).
    return-type: '{string}'
    comment: Returns an alphabetically sorted list of up to count keys from the linkset
      datastore that match the regular expression pattern, starting at index start
      (returns all matching keys if count < 1).
    must-use: true
  - name: LinksetDataListKeys
    parameters:
    - name: start
      type: number
      comment: Index of the first key to return.
    - name: count
      type: number
      comment: Maximum number of keys to return (or less than 1 to retrieve all keys).
    return-type: '{string}'
    comment: Returns an alphabetically sorted list of up to count keys from the linkset
      datastore, starting at index start (returns all keys if count < 1).
    must-use: true
  - name: LinksetDataRead
    parameters:
    - name: name
      type: string
      comment: Name of the key to read.
    return-type: string
    comment: Returns the value of the unprotected key name from the linkset datastore.
      Returns an empty string if the key is not found or is protected.
    must-use: true
  - name: LinksetDataReadProtected
    parameters:
    - name: name
      type: string
      comment: Name of the protected key to read.
    - name: pass
      type: string
      comment: Passphrase required to read the protected key.
    return-type: string
    comment: Returns the value of the protected key name from the linkset datastore
      using the passphrase pass. Returns an empty string if the key is not found or
      pass does not match.
    must-use: true
  - name: LinksetDataReset
    comment: Deletes all keys from the linkset datastore, triggering a linkset_data
      event.
  - name: LinksetDataWrite
    parameters:
    - name: name
      type: string
      comment: Name of the key to write.
    - name: value
      type: string
      comment: Value to write to the key (an empty string deletes the key).
    return-type: number
    comment: Creates or updates the unprotected key name in the linkset datastore
      with value, triggering a linkset_data event if the datastore changes. Returns
      an integer success or failure code.
  - name: LinksetDataWriteProtected
    parameters:
    - name: name
      type: string
      comment: Name of the protected key to write.
    - name: value
      type: string
      comment: Value to write to the key (an empty string deletes the key).
    - name: pass
      type: string
      comment: Passphrase used to protect or update the key.
    return-type: number
    comment: Creates or updates the protected key name in the linkset datastore with
      value using the passphrase pass, triggering a linkset_data event if the datastore
      changes. Returns an integer success or failure code.
  - name: List2CSV
    parameters:
    - name: src
      type: list
      comment: Source list to convert.
    return-type: string
    comment: Returns a string of comma-separated values taken in order from the list
      src.
    must-use: true
  - name: List2Float
    parameters:
    - name: src
      type: list
      comment: Source list containing the element of interest.
    - name: index
      type: number
      comment: Zero-based index of the entry.
    return-type: number
    comment: Returns the float value at index in the list src. Returns 0.0 if the
      index is out of bounds or if the value cannot be type-cast.
    deprecated:
      reason: Use '[]' and 'tonumber' instead.
      selene-replace:
      - tonumber(%1[%2]) or 0
    must-use: true
  - name: List2Integer
    parameters:
    - name: src
      type: list
      comment: Source list containing the element of interest.
    - name: index
      type: number
      comment: Zero-based index of the entry.
    return-type: number
    comment: Returns the integer value at index in the list src. Returns 0 if the
      index is out of bounds or if the value cannot be type-cast.
    deprecated:
      reason: Use '[]', 'tonumber', and 'math.modf' instead.
      selene-replace:
      - math.modf(tonumber(%1[%2]) or 0)
    must-use: true
  - name: List2Json
    parameters:
    - name: type
      type: string
      comment: JSON target type (JSON_ARRAY or JSON_OBJECT).
    - name: values
      type: list
      comment: List of values to serialize.
    return-type: string
    comment: Converts the list values into a JSON string of the specified type (either
      a JSON_ARRAY or a JSON_OBJECT). Returns JSON_INVALID if an error is encountered.
    deprecated:
      use: lljson.encode
      selene-replace:
      - lljson.encode(%2)
    must-use: true
  - name: List2Key
    parameters:
    - name: src
      type: list
      comment: Source list containing the element of interest.
    - name: index
      type: number
      comment: Zero-based index of the entry.
    return-type: uuid
    comment: Returns the key (UUID) value at index in the list src. Returns a null
      string/key if the index is out of bounds or if the value cannot be type-cast.
    deprecated:
      reason: Use '[]' and 'touuid' instead.
      selene-replace:
      - touuid(%1[%2]) or NULL_KEY
    must-use: true
  - name: List2List
    type-parameters:
    - T
    parameters:
    - name: src
      type: '{T}'
      comment: Source list to slice.
    - name: start_index
      type: number
      comment: Zero-based start index (inclusive).
    - name: end_index
      type: number
      comment: Zero-based end index (inclusive).
    return-type: '{T}'
    comment: Returns a new list containing the subset of entries from src within the
      inclusive range specified by the start and end indices. Negative indices count
      backward from the end.
    deprecated:
      reason: Use 'unpack' (fastcall) or 'table.move' instead. Prefer structured tables
        over strided lists.
      selene-replace:
      - table.pack(unpack(%...))
      - table.move(%..., 1, {})
    must-use: true
  - name: List2ListSlice
    type-parameters:
    - T
    parameters:
    - name: src
      type: '{T}'
      comment: Source strided list.
    - name: start_index
      type: number
      comment: Zero-based start index (inclusive).
    - name: end_index
      type: number
      comment: Zero-based end index (inclusive).
    - name: stride
      type: number
      comment: Number of entries per stride (defaults to 1 if less than 1).
    - name: slice_index
      type: number
      comment: Zero-based element index within each stride to extract (negatives count
        backward from the end of the stride).
    return-type: '{T}'
    comment: Returns a list containing the slice_index'th element of every stride
      within the inclusive range from start to end in the strided list src. Stride
      must be a positive integer.
    deprecated:
      reason: Prefer structured tables over strided lists.
    must-use: true
  - name: List2ListStrided
    type-parameters:
    - T
    parameters:
    - name: src
      type: '{T}'
      comment: Source strided list.
    - name: start_index
      type: number
      comment: Zero-based start index (inclusive).
    - name: end_index
      type: number
      comment: Zero-based end index (inclusive).
    - name: stride
      type: number
      comment: Number of entries per stride (defaults to 1 if less than 1).
    return-type: '{T}'
    comment: Returns a new list containing the first element of every stride in the
      strided list src within the inclusive range from start to end.
    deprecated:
      reason: Prefer structured tables over strided lists.
    must-use: true
  - name: List2Rot
    parameters:
    - name: src
      type: list
      comment: Source list containing the element of interest.
    - name: index
      type: number
      comment: Zero-based index of the entry.
    return-type: quaternion
    comment: Returns the rotation value at index in the list src. Returns ZERO_ROTATION
      if the index is out of bounds or if the value cannot be type-cast.
    deprecated:
      use: '[]'
      selene-replace:
      - '%1[%2]'
    must-use: true
  - name: List2String
    parameters:
    - name: src
      type: list
      comment: Source list containing the element of interest.
    - name: index
      type: number
      comment: Zero-based index of the entry.
    return-type: string
    comment: Returns the string value at index in the list src. Returns an empty string
      if the index is out of bounds.
    deprecated:
      reason: Use '[]' and 'tostring' instead.
      selene-replace:
      - tostring(%1[%2])
    must-use: true
  - name: List2Vector
    parameters:
    - name: src
      type: list
      comment: Source list containing the element of interest.
    - name: index
      type: number
      comment: Zero-based index of the entry.
    return-type: vector
    comment: Returns the vector value at index in the list src. Returns ZERO_VECTOR
      if the index is out of bounds or if the value cannot be type-cast.
    deprecated:
      use: '[]'
      selene-replace:
      - '%1[%2]'
    must-use: true
  - name: ListFindList
    parameters:
    - name: src
      type: list
      comment: List to search within.
    - name: test
      type: list
      comment: List elements to search for.
    return-type: number?
    comment: Returns the integer index of the first instance of list test within the
      list src (returns nil if not found).
    deprecated:
      reason: Prefer dictionaries or single-item searches.
      use: table.find
      selene-replace:
      - table.find(%1, %2[1])
    must-use: true
  - name: ListFindListNext
    parameters:
    - name: src
      type: list
      comment: List to search within.
    - name: test
      type: list
      comment: List elements to search for.
    - name: instance
      type: number
      comment: Zero-based occurrence index of the match to find.
    return-type: number?
    comment: Returns the integer index of the specified instance of list test within
      the list src (returns nil if not found).
    deprecated:
      reason: Prefer dictionaries or single-item searches.
      use: table.find
      selene-replace:
      - table.find(%1, %2[1])
    must-use: true
  - name: ListFindStrided
    parameters:
    - name: src
      type: list
      comment: List to search within.
    - name: test
      type: list
      comment: List elements to search for.
    - name: start_index
      type: number
      comment: Zero-based start index of the range to search.
    - name: end_index
      type: number
      comment: Zero-based end index of the range to search.
    - name: stride
      type: number
      comment: Number of entries per stride in the list.
    return-type: number?
    comment: Returns the integer index of the first instance of list test in the strided
      list src within the range from start to end (stepping through by stride). Returns
      nil if not found.
    deprecated:
      reason: Prefer dictionary lookups over strided list searches.
    must-use: true
  - name: ListInsertList
    type-parameters:
    - T
    parameters:
    - name: dest
      type: '{T}'
      comment: Target destination list.
    - name: src
      type: '{T}'
      comment: Source list to insert.
    - name: start
      type: number
      comment: Zero-based index where insertion begins.
    return-type: '{T}'
    comment: Returns a new list containing all elements of dest with the elements
      of src inserted starting at index start. Does not modify dest itself.
    deprecated:
      reason: Unnecessary table copying. Fastcall.
      use: table.insert
      selene-replace:
      - table.insert(%1, %3, %2[1])
      - 'table.move(%2, 1, #%2, %3, %1)'
    must-use: true
  - name: ListRandomize
    type-parameters:
    - T
    parameters:
    - name: src
      type: '{T}'
      comment: Source list to randomize.
    - name: stride
      type: number
      comment: Size of each randomized block (defaults to 1 if less than 1).
    return-type: '{T}'
    comment: Returns a randomized copy of the list src by blocks of size stride. If
      the list length is not perfectly divisible by stride, no randomization occurs.
    must-use: true
  - name: ListReplaceList
    type-parameters:
    - T
    parameters:
    - name: dest
      type: '{T}'
      comment: Target destination list.
    - name: src
      type: '{T}'
      comment: Source list to insert.
    - name: start_index
      type: number
      comment: Zero-based start index (inclusive) of the replaced range.
    - name: end_index
      type: number
      comment: Zero-based end index (inclusive) of the replaced range.
    return-type: '{T}'
    comment: Returns a copy of the list dest with the inclusive range from start to
      end removed, and the elements of src inserted in its place at start.
    deprecated:
      reason: Unnecessary table copying.
      use: t[n] = x
      selene-replace:
      - '%1[%3] = %2[1]'
    must-use: true
  - name: ListSort
    type-parameters:
    - T
    parameters:
    - name: src
      type: '{T}'
      comment: List to be sorted.
    - name: stride
      type: number
      comment: Number of entries per block/stride (defaults to 1 if less than 1).
    - name: ascending
      type: boolean | number
      comment: Boolean. If TRUE, sorts in ascending order; if FALSE, sorts in descending
        order.
    return-type: '{T}'
    comment: Returns a copy of the list src, sorted into blocks of stride in ascending
      order (if ascending is TRUE) or descending order (if FALSE). Only works if the
      first entry of each block shares the same datatype.
    must-use: true
  - name: ListSortStrided
    type-parameters:
    - T
    parameters:
    - name: src
      type: '{T}'
      comment: List to be sorted.
    - name: stride
      type: number
      comment: Number of entries per block/stride (defaults to 1 if less than 1).
    - name: stride_index
      type: number
      comment: Zero-based index of the element within each stride to use as the sort
        key (negatives count backward from the end of the stride).
    - name: ascending
      type: boolean | number
      comment: Boolean. If TRUE, sorts in ascending order; if FALSE, sorts in descending
        order.
    return-type: '{T}'
    comment: Returns a copy of the list src sorted into blocks of stride by the element
      at stride_index in each block. Sorted in ascending order (if ascending is TRUE)
      or descending order (if FALSE).
    deprecated:
      reason: Prefer structured tables over strided lists.
      use: table.sort
    must-use: true
  - name: ListStatistics
    parameters:
    - name: operation
      type: number
      comment: LIST_STAT_* constant of the statistical operation to perform.
    - name: src
      type: '{number}'
      comment: List of numbers to analyze.
    return-type: number
    comment: Returns the numeric result of the statistical aggregate function operation
      (a LIST_STAT_* constant) on the numeric list src.
    must-use: true
  - name: Listen
    parameters:
    - name: channel
      type: number
      comment: Chat channel (any 32-bit signed integer value) to listen on. Exact
        range is -2147483648 to 2147483647.
    - name: name
      type: string
      comment: Specific prim name or agent legacy name to filter by (or empty string
        for no filter).
    - name: id
      type: uuid
      comment: Specific agent or prim UUID to filter by (or NULL_KEY for no filter).
    - name: msg
      type: string
      comment: Specific chat message string to filter by (or empty string for no filter).
    return-type: number
    comment: Creates a listener on channel from name and id for msg. Returns an integer
      listener handle used to control or remove the listener. Empty strings or NULL_KEY
      filters do not filter on those parameters.
  - name: ListenControl
    parameters:
    - name: handle
      type: number
      comment: Integer listener handle returned by llListen.
    - name: active
      type: boolean | number
      comment: Boolean. If TRUE, activates the listener; if FALSE, deactivates it.
    comment: Enables or disables the listener specified by the integer handle. If
      active is TRUE, the listener is activated; if FALSE, it is deactivated.
  - name: ListenRemove
    parameters:
    - name: handle
      type: number
      comment: Integer listener handle returned by llListen to remove.
    comment: Completely removes the listener specified by the integer handle.
  - name: LoadURL
    parameters:
    - name: avatar
      type: uuid
      comment: UUID of the avatar in the same region.
    - name: message
      type: string
      comment: Text message to display in the dialog box.
    - name: url
      type: string
      comment: Web URL to open.
    comment: Shows a dialog box displaying message to the avatar avatar offering to
      open the specified url. Clicking yes launches the URL in their default web browser.
  - name: Log
    parameters:
    - name: val
      type: number
      comment: Number to compute the logarithm of.
    return-type: number
    comment: Returns natural (base e) logarithm of val. If negative, return 0.0.
    deprecated:
      reason: Double precision; fastcall.
      use: math.log
      selene-replace:
      - math.log(%...)
    must-use: true
  - name: Log10
    parameters:
    - name: val
      type: number
      comment: Number to compute the logarithm of.
    return-type: number
    comment: Returns base-10 (common) logarithm of val. If negative, return 0.0.
    deprecated:
      reason: Double precision; fastcall.
      use: math.log10
      selene-replace:
      - math.log10(%...)
    must-use: true
  - name: LookAt
    parameters:
    - name: target
      type: vector
      comment: Target position vector in region coordinates to look at.
    - name: strength
      type: number
      comment: Force of rotation (0.0 cancels the tracking; values around half the
        object's mass are typical).
    - name: damping
      type: number
      comment: Timescale in seconds to critically damp the orientation.
    comment: Causes the object to orient its positive Z-axis (up axis) toward the
      target vector, keeping its positive X-axis (forward axis) below the horizon.
      Tracks target until llStopLookAt is called or strength is set to 0.0.
  - name: LoopSound
    parameters:
    - name: sound
      type: string | uuid
      comment: Name of a sound in the prim's inventory, or a UUID.
    - name: volume
      type: number
      comment: Volume level to set, between 0.0 (silent) and 1.0 (loud).
    comment: Plays the attached sound looping indefinitely at the specified volume.
      Only one sound can be attached to a prim at a time; new loops adjust the volume
      of the currently playing sound without restarting it.
  - name: LoopSoundMaster
    parameters:
    - name: sound
      type: string | uuid
      comment: Name of a sound in the prim's inventory, or a UUID.
    - name: volume
      type: number
      comment: Volume level to set, between 0.0 (silent) and 1.0 (loud).
    comment: Plays the attached sound looping indefinitely at the specified volume
      and declares it a Sync Master, forcing slave sounds to synchronize with it.
  - name: LoopSoundSlave
    parameters:
    - name: sound
      type: string | uuid
      comment: Name of a sound in the prim's inventory, or a UUID.
    - name: volume
      type: number
      comment: Volume level to set, between 0.0 (silent) and 1.0 (loud).
    comment: Plays the attached sound looping indefinitely at the specified volume,
      synchronized to the most audible active Sync Master in range.
  - name: MD5String
    parameters:
    - name: src
      type: string
      comment: Source string to hash.
    - name: nonce
      type: number
      comment: Nonce string used as a salt.
    return-type: string
    comment: Returns a string of 32 hex characters representing the MD5 checksum of
      src salted with nonce (formatted as ':' + nonce).
    must-use: true
  - name: MakeExplosion
    parameters:
    - name: particles
      type: number
    - name: scale
      type: number
    - name: vel
      type: number
    - name: lifetime
      type: number
    - name: arc
      type: number
    - name: texture
      type: string | uuid
      comment: Name of a texture in the prim's inventory, or a UUID.
    - name: offset
      type: vector
      comment: Offset relative to the prim's position (expressed in local coordinates;
        completely ignored by the system).
    comment: Deprecated. Generates a circular explosion of particles. Use llParticleSystem
      instead.
    deprecated:
      use: ll.ParticleSystem
  - name: MakeFire
    parameters:
    - name: particles
      type: number
    - name: scale
      type: number
    - name: vel
      type: number
    - name: lifetime
      type: number
    - name: arc
      type: number
    - name: texture
      type: string | uuid
      comment: Name of a texture in the prim's inventory, or a UUID.
    - name: offset
      type: vector
      comment: Offset relative to the prim's position (expressed in local coordinates;
        completely ignored by the system).
    comment: Deprecated. Generates fire-like particles. Use llParticleSystem instead.
    deprecated:
      use: ll.ParticleSystem
  - name: MakeFountain
    parameters:
    - name: particles
      type: number
    - name: scale
      type: number
    - name: vel
      type: number
    - name: lifetime
      type: number
    - name: arc
      type: number
    - name: bounce
      type: number
    - name: texture
      type: string | uuid
      comment: Name of a texture in the prim's inventory, or a UUID.
    - name: offset
      type: vector
      comment: Offset relative to the prim's position (expressed in local coordinates;
        completely ignored by the system).
    - name: bounce_offset
      type: number
    comment: Deprecated. Generates a fountain of particles. Use llParticleSystem instead.
    deprecated:
      use: ll.ParticleSystem
  - name: MakeSmoke
    parameters:
    - name: particles
      type: number
    - name: scale
      type: number
    - name: vel
      type: number
    - name: lifetime
      type: number
    - name: arc
      type: number
    - name: texture
      type: string | uuid
      comment: Name of a texture in the prim's inventory, or a UUID.
    - name: offset
      type: vector
      comment: Offset relative to the prim's position (expressed in local coordinates;
        completely ignored by the system).
    comment: Deprecated. Generates smoke-like particles. Use llParticleSystem instead.
    deprecated:
      use: ll.ParticleSystem
  - name: ManageEstateAccess
    parameters:
    - name: action
      type: number
      comment: An ESTATE_ACCESS_* action flag specifying the operation to perform.
    - name: avatar
      type: uuid
      comment: UUID of the avatar or group to add or remove.
    return-type: boolean
    comment: Adds or removes agents from the estate's access or ban lists, or groups
      from the estate's group access list, specified by the action. Returns TRUE if
      successful, or FALSE if throttled, if the action/ID is invalid, or if the script
      owner lacks estate management rights.
  - name: MapBeacon
    parameters:
    - name: region_name
      type: string
      comment: Name of the region where the beacon is displayed.
    - name: pos
      type: vector
      comment: Position vector in region coordinates to highlight.
    - name: options
      type: list
      comment: A list of options to configure the map beacon.
    comment: Displays an in-world beacon and optionally opens the world map for the
      avatar touching or wearing the object, centered on region_name with pos highlighted.
      Only works for attached scripts or during touch events.
  - name: MapDestination
    parameters:
    - name: simname
      type: string
      comment: Name of the target simulator region.
    - name: pos
      type: vector
      comment: Position vector in region coordinates to highlight.
    - name: look_at
      type: vector
      comment: Position in local coordinates (currently unused/ignored).
    comment: 'Opens the world map for the avatar touching or wearing the object, centered
      on simname with pos highlighted. Only works for attached scripts or during touch
      events. Note: look_at currently has no effect.'
  - name: MessageLinked
    parameters:
    - name: link
      type: number
      comment: Link number (1 for root, >1 for children) or a LINK_* flag controlling
        which prim(s) receive the message.
    - name: num
      type: number
      comment: An integer value passed as the second parameter of the link_message
        event.
    - name: str
      type: string | uuid
      comment: A string value passed as the third parameter of the link_message event.
    - name: id
      type: string | uuid
      comment: A key value passed as the fourth parameter of the link_message event.
    comment: Triggers a link_message event, sending num, str, and id to the scripts
      in the prim(s) specified by link to allow scripts within the same object to
      communicate.
  - name: MinEventDelay
    parameters:
    - name: delay
      type: number
      comment: Minimum delay duration in seconds.
    comment: Sets the minimum delay time between events being handled (minimums and
      defaults vary by event type).
  - name: ModPow
    parameters:
    - name: base
      type: number
      comment: 32-bit unsigned integer base.
    - name: exponent
      type: number
      comment: 32-bit unsigned integer exponent.
    - name: modulus
      type: number
      comment: 32-bit unsigned integer modulus.
    return-type: number
    comment: Returns base raised to the power exponent, modulo modulus (i.e., (b^e)%m).
      All inputs are wrapped to unsigned 32-bit integer range [0..4294967295]. Output
      is wrapped to signed 32-bit integer range [-2147483648..2147483647]. Will never
      overflow, unlike (b^e), which can overflow to inf.
    must-use: true
  - name: ModifyLand
    parameters:
    - name: action
      type: number
      comment: LAND_* action flag to perform (e.g., LAND_LEVEL, LAND_RAISE, LAND_LOWER,
        LAND_SMOOTH, LAND_NOISE, or LAND_REVERT).
    - name: brush
      type: number
      comment: Brush size (0, 1, or 2, representing 2m x 2m, 4m x 4m, or 8m x 8m).
    comment: Modifies the terrain using the specified land action and brush size (0,
      1, or 2, corresponding to 2m x 2m, 4m x 4m, or 8m x 8m).
  - name: MoveToTarget
    parameters:
    - name: target
      type: vector
      comment: Target position vector in region coordinates.
    - name: tau
      type: number
      comment: Timescale in seconds to critically damp the movement.
    comment: Critically damps the physical object's motion to position target in tau
      seconds. Setting tau to 0.0 stops the critical damping; recommended tau values
      are greater than 0.2.
  - name: Name2Key
    parameters:
    - name: name
      type: string
      comment: Name of the avatar (e.g., 'First Last' or 'first.last').
    return-type: uuid
    comment: Requests the key (UUID) of the avatar name in the current region. Returns
      NULL_KEY if no matching agent is present. Formats are 'First Last' or 'first.last'
      (assumes 'Resident' if last name is omitted; case-insensitive).
    must-use: true
  - name: NavigateTo
    parameters:
    - name: pos
      type: vector
      comment: Destination position vector in region coordinates.
    - name: options
      type: list | CharacterNavigateParams
      comment: A list of parameters to configure pathfinding behavior (currently only
        FORCE_DIRECT_PATH is supported).
    comment: Directs a pathfinding character to navigate to the position pos (located
      in the current or adjacent regions) using the parameters specified in options.
  - name: OffsetTexture
    parameters:
    - name: u
      type: number
      comment: Horizontal (U) offset, typically in the interval [-1.0, 1.0].
    - name: v
      type: number
      comment: Vertical (V) offset, typically in the interval [-1.0, 1.0].
    - name: face
      type: number
      comment: Face number or ALL_SIDES.
    comment: Sets the texture horizontal (u) and vertical (v) offsets for the chosen
      face. If face is ALL_SIDES, offsets all faces.
  - name: OpenFloater
    parameters:
    - name: floater_name
      type: string
      comment: Identifier string of the viewer floater to open.
    - name: url
      type: string
      comment: URL to load within the opened floater.
    - name: params
      type: list
      comment: Options or parameters to apply to the opened floater.
    return-type: number
    comment: Opens the specified viewer floater_name loaded with url and configured
      via params. Returns an integer error code, or 0 if successful.
  - name: OpenRemoteDataChannel
    comment: Deprecated. Creates a channel to listen for incoming XML-RPC calls, triggering
      a remote_data event with the channel ID once available.
    deprecated: true
  - name: Ord
    parameters:
    - name: val
      type: string
      comment: Source string.
    - name: index
      type: number
      comment: Codepoint index of the character to convert. Supports negative indexing.
    return-type: number
    comment: Returns the ordinal (Unicode copepoint integer) of the character at index
      in the string val. Negative indices count backward from the end of the string.
    must-use: true
  - name: OverMyLand
    parameters:
    - name: id
      type: uuid
      comment: UUID of the group, avatar, or object to check.
    return-type: boolean
    comment: Returns TRUE if the avatar or object specified by key id is over land
      owned by the script owner, or FALSE otherwise.
    must-use: true
  - name: OwnerSay
    parameters:
    - name: msg
      type: string
      comment: Text message string to send to the object owner.
    comment: Sends the chat message msg privately to the object owner (the owner must
      be currently in the same region for the message to be received).
    deprecated:
      use: print
      selene-replace:
      - print(%...)
  - name: ParcelMediaCommandList
    parameters:
    - name: commandList
      type: list
      comment: A list containing integer PARCEL_MEDIA_COMMAND_* flags and their corresponding
        parameters.
    comment: Controls the playback of movies and other multimedia resources on a parcel
      or for an agent, using the PARCEL_MEDIA_COMMAND_* settings specified in commandList.
  - name: ParcelMediaQuery
    parameters:
    - name: query
      type: '{number}'
      comment: A list of PARCEL_MEDIA_COMMAND_* attributes to query.
    return-type: '{any}'
    comment: Queries the media properties of the parcel containing the script, returning
      a list of values in the order requested by query. Only works if the object is
      owned by the landowner or deeded to the land's group.
    must-use: true
  - name: ParseString2List
    parameters:
    - name: src
      type: string
      comment: Source string to parse.
    - name: separators
      type: '{string}'
      comment: A list of up to 8 strings representing separators to be discarded.
    - name: spacers
      type: '{string}'
      comment: A list of up to 8 strings representing spacers to be preserved in the
        list.
    return-type: '{string}'
    comment: Breaks the string src into a list of substrings, discarding any separators,
      keeping spacers, and omitting any empty null values. separators and spacers
      accept up to 8 string entries each.
    must-use: true
  - name: ParseStringKeepNulls
    parameters:
    - name: src
      type: string
      comment: Source string to parse.
    - name: separators
      type: '{string}'
      comment: A list of up to 8 strings representing separators to be discarded.
    - name: spacers
      type: '{string}'
      comment: A list of up to 8 strings representing spacers to be preserved in the
        list.
    return-type: '{string}'
    comment: Breaks the string src into a list of substrings, discarding separators
      and keeping spacers, while preserving empty null values (unlike llParseString2List).
      separators and spacers accept up to 8 string entries each.
    must-use: true
  - name: ParticleSystem
    parameters:
    - name: rules
      type: list | ParticleParams
      comment: A list of particle system rules and data pairs [rule1, data1, ...].
    comment: Creates or updates a particle system on the prim containing the script
      based on rules. An empty list removes the particle system.
  - name: PassCollisions
    parameters:
    - name: pass
      type: number
      comment: A PASS_* flag (e.g., PASS_ALWAYS, PASS_IF_NOT_HANDLED, or PASS_NEVER).
    comment: Sets the pass-collisions attribute. If pass is TRUE, collision events
      are passed from child prims to the root; if FALSE (default), they only trigger
      events in the affected child prim.
  - name: PassTouches
    parameters:
    - name: pass
      type: number
      comment: A PASS_* flag (e.g., PASS_ALWAYS, PASS_IF_NOT_HANDLED, or PASS_NEVER).
    comment: Sets the pass-touches attribute. If pass is TRUE, touch events are passed
      from child prims to the root; if FALSE (default), they only trigger events in
      the affected child prim.
  - name: PatrolPoints
    parameters:
    - name: patrolPoints
      type: '{vector}'
      comment: A list of at least two position vectors representing the patrol path.
    - name: options
      type: list | CharacterPatrolPointsParams
      comment: A list of PATROL_* flags and parameters to configure the patrol behavior.
    comment: Directs a pathfinding character to patrol sequentially through the coordinates
      specified in patrolPoints, configured by options.
  - name: PlaySound
    parameters:
    - name: sound
      type: string | uuid
      comment: Name of a sound in the prim's inventory, or a UUID.
    - name: volume
      type: number
      comment: Volume level to set, between 0.0 (silent) and 1.0 (loud).
    comment: Plays the specified sound once at volume, attached to the object. Only
      one sound can be attached to a prim at a time; new sounds or calling llStopSound
      stops previous playback. A second call with the same sound adjusts the volume
      without restarting it.
  - name: PlaySoundSlave
    parameters:
    - name: sound
      type: string | uuid
      comment: Name of a sound in the prim's inventory, or a UUID.
    - name: volume
      type: number
      comment: Volume level to set, between 0.0 (silent) and 1.0 (loud).
    comment: Plays the attached sound once at volume, synchronized to the next loop
      point of the most audible active Sync Master.
  - name: PointAt
    parameters:
    - name: pos
      type: vector
      comment: Position vector to point at.
    comment: Directs the avatar owning the object to point at the vector pos.
    deprecated: true
  - name: Pow
    parameters:
    - name: base
      type: number
      comment: Base number.
    - name: exponent
      type: number
      comment: Exponent number.
    return-type: number
    comment: Returns base raised to the power exponent. If result is imaginary, returns
      NaN.
    deprecated:
      reason: Double precision; operator.
      use: ^
      selene-replace:
      - '%1 ^ %2'
      - math.pow(%...)
      - math.exp(%2)
    must-use: true
  - name: PreloadSound
    parameters:
    - name: sound
      type: string | uuid
      comment: Name of the sound in the prim's inventory, or a UUID.
    comment: Causes nearby viewers in range to preload the specified sound from the
      object's inventory to prevent playback delays.
  - name: Pursue
    parameters:
    - name: target
      type: uuid
      comment: UUID of the group, avatar, or object to pursue.
    - name: options
      type: list | CharacterPursueParams
      comment: A list of options to configure pursuit behavior.
    comment: Directs a pathfinding character to pursue and chase target, configured
      by the parameters specified in options.
  - name: PushObject
    parameters:
    - name: target
      type: uuid
      comment: UUID of the target avatar or object in the same region.
    - name: impulse
      type: vector
      comment: Linear impulse vector representing the direction and force of the push.
    - name: ang_impulse
      type: vector
      comment: Angular impulse vector representing the rotational force.
    - name: is_local
      type: boolean | number
      comment: Boolean. If TRUE, forces are applied relative to the target's local
        axes; if FALSE, relative to region axes.
    comment: Applies physical impulse (force) and ang_impulse (rotational force) to
      the specified target avatar or object.
  - name: ReadKeyValue
    parameters:
    - name: k
      type: string
      comment: Key of the key-value pair to read.
    return-type: uuid
    comment: Starts an asynchronous transaction to read the value associated with
      key k in the experience. Returns a key query handle for the dataserver event.
      Fails with XP_ERROR_KEY_NOT_FOUND if the key does not exist.
  - name: RefreshPrimURL
    comment: Legacy function intended to reload the web page displayed on the prim's
      faces (currently non-functional).
    deprecated:
      use: ll.SetPrimMediaParams
  - name: RegionSay
    parameters:
    - name: channel
      type: number
      comment: Chat channel (any 32-bit signed integer value except zero) to chat
        the message on.
    - name: msg
      type: string
      comment: Text message string to broadcast.
    comment: Broadcasts the message msg to all scripts listening on channel Channel
      within the region. PUBLIC_CHANNEL (0) cannot be used, so, only scripts can receive
      the message.
  - name: RegionSayTo
    parameters:
    - name: target
      type: uuid
      comment: UUID of the target agent or prim in the same region.
    - name: channel
      type: number
      comment: Chat channel (any 32-bit signed integer value) to chat the message
        on.
    - name: msg
      type: string
      comment: Text message string to send.
    comment: Sends the message msg on Channel privately to the targeted agent or object
      (if within the region). If target is an agent and channel is non-zero, the message
      can also be heard by any attachments worn by the avatar.
  - name: ReleaseCamera
    parameters:
    - name: avatar
      type: uuid
      comment: UUID of the avatar in the same region.
    comment: Deprecated. Intended to return camera control back to the avatar (use
      llClearCameraParams instead).
    deprecated:
      use: ll.ClearCameraParams
      selene-replace:
      - ll.ClearCameraParams()
  - name: ReleaseControls
    comment: Stops taking inputs (previously acquired via llTakeControls) from the
      avatar, dequeuing any remaining control events and revoking the PERMISSION_TAKE_CONTROLS
      permission.
  - name: ReleaseURL
    parameters:
    - name: url
      type: string
      comment: URL string to release.
    comment: Releases the specified url (previously obtained via llRequestURL), rendering
      it no longer usable.
  - name: RemoteDataReply
    parameters:
    - name: channel
      type: uuid
      comment: XML-RPC channel ID.
    - name: message_id
      type: uuid
      comment: XML-RPC message ID.
    - name: sdata
      type: string
      comment: String payload data to reply with.
    - name: idata
      type: number
      comment: Integer payload data to reply with.
    comment: Deprecated. Sends an XML-RPC reply on channel to message_id with payload
      string sdata and integer idata.
    deprecated: true
  - name: RemoteDataSetRegion
    comment: Deprecated. Used with XML-RPC to reregister remote data channels if the
      object moves to another region.
    deprecated: true
  - name: RemoteLoadScript
    parameters:
    - name: target
      type: uuid
      comment: UUID of the target prim.
    - name: script
      type: string
      comment: Name of the script in the prim's inventory.
    - name: running
      type: number
      comment: Boolean. If TRUE, sets the copied script to run immediately; if FALSE,
        leaves it stopped.
    - name: start_param
      type: number
      comment: Integer start parameter passed to the copied script (readable via llGetStartParameter).
    comment: Deprecated.
    deprecated: true
  - name: RemoteLoadScriptPin
    parameters:
    - name: target
      type: uuid
      comment: UUID of the target prim in the same region.
    - name: script
      type: string
      comment: Name of the script in the prim's inventory.
    - name: pin
      type: number
      comment: Integer PIN code (must match the PIN set on the ObjectID via llSetRemoteScriptAccessPin).
    - name: running
      type: boolean | number
      comment: Boolean. If TRUE, sets the copied script to run immediately; if FALSE,
        leaves it stopped.
    - name: start_param
      type: number
      comment: Integer start parameter passed to the copied script (readable via llGetStartParameter).
    comment: Copies the script into target, setting it running (if running is TRUE)
      with the start_param, provided the script owner has modify permissions on target
      and target's PIN matches pin (set via llSetRemoteScriptAccessPin).
  - name: RemoveFromLandBanList
    parameters:
    - name: avatar
      type: uuid
      comment: UUID of the avatar to remove.
    comment: Removes the specified avatar from the land parcel's ban list.
  - name: RemoveFromLandPassList
    parameters:
    - name: avatar
      type: uuid
      comment: UUID of the avatar to remove.
    comment: Removes the specified avatar from the land parcel's pass/access list.
  - name: RemoveInventory
    parameters:
    - name: item
      type: string
      comment: Name of the item in the prim's inventory to remove.
    comment: Permanently deletes the named inventory item from the prim's inventory.
  - name: RemoveVehicleFlags
    parameters:
    - name: flags
      type: number
      comment: A bitwise mask of VEHICLE_FLAG_* constants to disable.
    comment: Disables the specified vehicle flags (sets them to FALSE) using the bitwise
      mask flags.
  - name: ReplaceAgentEnvironment
    parameters:
    - name: agent_id
      type: uuid
      comment: UUID of an agent in the region participating in the experience.
    - name: transition
      type: number
      comment: Duration in seconds over which to transition to the new environment.
    - name: environment
      type: string | uuid
      comment: Name of an environmental setting in inventory, or its asset UUID (or
        empty string/NULL_KEY to clear).
    return-type: number
    comment: Replaces the region and parcel environment seen by the specified agent_id
      as part of an experience, transitioning the settings over transition seconds.
      Passing NULL_KEY or an empty string for environment restores defaults.
  - name: ReplaceEnvironment
    parameters:
    - name: position
      type: vector
      comment: Position vector of the target parcel (the Z component is ignored; use
        <-1.0, -1.0, -1.0> for the entire region).
    - name: environment
      type: string | uuid
      comment: Name of an environmental setting in inventory, or its asset UUID (or
        empty string/NULL_KEY to clear).
    - name: track_no
      type: number
      comment: 'The elevation track to change (0: water, 1: ground, 2: 1000m, 3: 2000m,
        4: 3000m, -1: all tracks).'
    - name: day_length
      type: number
      comment: Day cycle length in seconds (-1 to leave unchanged).
    - name: day_offset
      type: number
      comment: Day cycle offset in seconds from UTC (-1 to leave unchanged).
    return-type: number
    comment: Replaces the environment on the parcel containing position (or the entire
      region if position is <-1.0, -1.0, -1.0>) for the specified track_no. Modifies
      day_length and day_offset if specified. Requires edit permissions on the parcel
      or estate management rights.
  - name: ReplaceSubString
    parameters:
    - name: src
      type: string
      comment: Original source string to search.
    - name: pattern
      type: string
      comment: Substring pattern to find and replace.
    - name: replacement_pattern
      type: string
      comment: New substring that replaces the pattern.
    - name: count
      type: number
      comment: Maximum number of replacements to make (0 for all, positive for left-to-right,
        negative for right-to-left).
    return-type: string
    comment: Returns a copy of src with count occurrences of pattern replaced by replacement_pattern.
      Setting count to 0 replaces all occurrences; positive counts process left-to-right,
      while negative counts process right-to-left.
    must-use: true
  - name: RequestAgentData
    parameters:
    - name: id
      type: uuid
      comment: UUID of the agent.
    - name: data
      type: number
      comment: DATA_* category flag of the requested information.
    return-type: uuid
    comment: Asynchronously requests the specified data category (DATA_*) about the
      agent id. Triggers a dataserver event with the results and returns a key query
      handle.
  - name: RequestDisplayName
    parameters:
    - name: id
      type: uuid
      comment: UUID of the avatar to query.
    return-type: uuid
    comment: Asynchronously requests the display name of the agent specified by id,
      triggering a dataserver event with the results. The agent does not need to be
      online or in the region. Returns a key query handle.
  - name: RequestExperiencePermissions
    parameters:
    - name: agent
      type: uuid
      comment: UUID of the agent to request permissions from.
    - name: name
      type: string
      comment: Deprecated parameter (no longer used).
    comment: Requests permission from the specified agent to participate in the experience.
      These permissions are persistent and apply grid-wide across all scripts in the
      experience, automatically triggering experience_permissions or experience_permissions_denied.
  - name: RequestInventoryData
    parameters:
    - name: item
      type: string
      comment: Name of the item in the prim's inventory.
    return-type: uuid
    comment: Asynchronously requests data for the named inventory item, triggering
      a dataserver event. Currently, only landmark items are supported (which return
      local region coordinates). Returns a key query handle.
  - name: RequestPermissions
    parameters:
    - name: agent
      type: uuid
      comment: UUID of the agent in the same region.
    - name: permissions
      type: number
      comment: Bitfield containing the PERMISSION_* constants to request.
    comment: Requests permissions (a bitfield specified by permissions) from the agent
      in the same region, calling run_time_permissions if granted. This call does
      not pause script execution.
  - name: RequestSecureURL
    return-type: uuid
    comment: Asynchronously requests one secure HTTPS (SSL, port 12043) URL for use
      by this object, triggering an http_request event. Returns a key query handle.
  - name: RequestSimulatorData
    parameters:
    - name: region
      type: string
      comment: Case-sensitive region name.
    - name: data
      type: number
      comment: DATA_SIM_* flag of the requested simulator data.
    return-type: uuid
    comment: Asynchronously requests data (using a DATA_SIM_* constant) about the
      region. Triggers a dataserver event and returns a key query handle.
  - name: RequestURL
    return-type: uuid
    comment: Asynchronously requests one HTTP URL for use by this script, triggering
      an http_request event. Returns a key query handle.
  - name: RequestUserKey
    parameters:
    - name: username
      type: string
      comment: Current or historical username of the avatar to resolve.
    return-type: uuid
    comment: Asynchronously requests the Agent ID key (UUID) for the agent specified
      by their current or historical username, returning NULL_KEY if not found. Returns
      a key query handle for the dataserver event.
  - name: RequestUsername
    parameters:
    - name: id
      type: uuid
      comment: UUID of the avatar to query.
    return-type: uuid
    comment: Asynchronously requests the unique single-word username of the agent
      identified by id, triggering a dataserver event. The agent does not need to
      be online or in the region. Returns a key query handle.
  - name: ResetAnimationOverride
    parameters:
    - name: anim_state
      type: string
      comment: Animation state string (or 'ALL') to reset.
    comment: Resets the animation override for anim_state to its default value (use
      'ALL' to reset all states). Requires the PERMISSION_OVERRIDE_ANIMATIONS permission.
  - name: ResetLandBanList
    comment: Removes all blocked residents from the land parcel's ban list.
  - name: ResetLandPassList
    comment: Removes all residents from the land parcel's access/pass list.
  - name: ResetOtherScript
    parameters:
    - name: script
      type: string
      comment: Name of the target script in the prim's inventory.
    comment: Resets the named script name in the prim's inventory.
  - name: ResetScript
    comment: Resets the current script.
  - name: ReturnObjectsByID
    parameters:
    - name: objects
      type: '{uuid}'
      comment: A list of object UUID keys to return.
    return-type: number
    comment: Returns objects specified by the list of UUIDs objects to their owners.
      Requires the PERMISSION_RETURN_OBJECTS permission, and the script owner must
      own the parcel or be an estate manager/region owner.
  - name: ReturnObjectsByOwner
    parameters:
    - name: owner
      type: uuid
      comment: UUID of the avatar or group whose objects will be returned.
    - name: scope
      type: number
      comment: OBJECT_RETURN_* scope flag (such as OBJECT_RETURN_PARCEL, OBJECT_RETURN_PARCEL_OWNER,
        or OBJECT_RETURN_REGION).
    return-type: number
    comment: Returns objects owned by owner within the specified scope (parcel, parcel
      owner, or region). Requires the PERMISSION_RETURN_OBJECTS permission, and the
      script owner must own the parcel or be an estate manager/region owner.
  - name: RezAtRoot
    parameters:
    - name: item
      type: string
      comment: Name of the object in the prim's inventory to rez.
    - name: pos
      type: vector
      comment: Position vector in region coordinates where the root of the object
        will be placed.
    - name: vel
      type: vector
      comment: Initial velocity vector for the rezzed object.
    - name: rot
      type: quaternion
      comment: Initial rotation of the rezzed object.
    - name: start_param
      type: number
      comment: Start parameter passed to the rezzed object's on_rez event (accessible
        via llGetStartParameter).
    comment: Instantiates the named inventory object with the root prim at pos with
      velocity vel and rotation rot, passing start_param as the on_rez start parameter.
      The vel parameter is ignored if the rezzed object is non-physical.
  - name: RezObject
    parameters:
    - name: item
      type: string
      comment: Name of the object in the prim's inventory to rez.
    - name: pos
      type: vector
      comment: Position vector in region coordinates where the center of the object
        will be placed.
    - name: vel
      type: vector
      comment: Initial velocity vector (maximum magnitude ~200m/s).
    - name: rot
      type: quaternion
      comment: Initial rotation of the rezzed object.
    - name: start_param
      type: number
      comment: Start parameter passed to the rezzed object's on_rez event (accessible
        via llGetStartParameter).
    comment: Instantiates the named inventory object with the bounding box centered
      at pos with velocity vel and rotation rot, passing param as the on_rez start
      parameter. The vel parameter is ignored if the rezzed object is non-physical.
  - name: RezObjectWithParams
    parameters:
    - name: item
      type: string
      comment: Name of the object in the prim's inventory to rez.
    - name: options
      type: list
      comment: A list of REZ_* options to configure the rezzed object's attributes.
    return-type: uuid
    comment: Instantiates the named inventory object (defaulting to the rezzing prim's
      position unless REZ_POS is specified) using the initial set of parameters specified
      in options. Returns the key of the rezzed object, or a blank key on failure.
  - name: Rot2Angle
    parameters:
    - name: q
      type: quaternion
      comment: Rotation to evaluate.
    return-type: number
    comment: Returns the angle, in radians, that q rotates.
    must-use: true
  - name: Rot2Axis
    parameters:
    - name: q
      type: quaternion
      comment: Rotation to evaluate.
    return-type: vector
    comment: Returns the unit vector axis that q rotates around.
    must-use: true
  - name: Rot2Euler
    parameters:
    - name: q
      type: quaternion
      comment: Rotation to convert.
    return-type: vector
    comment: Returns a vector of Euler angles (roll, pitch, yaw) of q. The angles
      will be in radians.
    must-use: true
  - name: Rot2Fwd
    parameters:
    - name: q
      type: quaternion
      comment: Rotation to convert.
    return-type: vector
    comment: Returns the unit vector pointing toward positive X (forward) in the coordinate
      space of rotation q. Equivalent to <1, 0, 0> * q.
    deprecated:
      use: quaternion.tofwd
      selene-replace:
      - quaternion.tofwd(%1)
    must-use: true
  - name: Rot2Left
    parameters:
    - name: q
      type: quaternion
      comment: Rotation to convert.
    return-type: vector
    comment: Returns the unit vector pointing toward positive Y (left) in the coordinate
      space of rotation q. Equivalent to <0, 1, 0> * q.
    deprecated:
      use: quaternion.toleft
      selene-replace:
      - quaternion.toleft(%1)
    must-use: true
  - name: Rot2Up
    parameters:
    - name: q
      type: quaternion
      comment: Rotation to convert.
    return-type: vector
    comment: Returns the unit vector pointing toward positive Z (up) in the coordinate
      space of rotation q. Equivalent to <0, 0, 1> * q.
    deprecated:
      use: quaternion.toup
      selene-replace:
      - quaternion.toup(%1)
    must-use: true
  - name: RotBetween
    parameters:
    - name: start_vec
      type: vector
      comment: Starting vector.
    - name: end_vec
      type: vector
      comment: Ending vector.
    return-type: quaternion
    comment: Returns the shortest-path quaternion that rotates start_vec onto end_vec.
    must-use: true
  - name: RotLookAt
    parameters:
    - name: target_direction
      type: quaternion
      comment: Target rotation to align the object with.
    - name: strength
      type: number
      comment: Force of rotation (0.0 cancels the tracking; values around half the
        object's mass are typical).
    - name: damping
      type: number
      comment: Timescale in seconds to critically damp the rotation.
    comment: Causes the object to smoothly rotate to target_direction with a force
      defined by strength and damping. A strength of 0.0 cancels the rotation target.
      Rotation is maintained until stopped with llStopLookAt.
  - name: RotTarget
    parameters:
    - name: rot
      type: quaternion
      comment: Target rotation to track.
    - name: error
      type: number
      comment: Tolerance angle in radians defining when the target rotation is considered
        reached.
    return-type: number
    comment: Registers the rotation rot with a leeway tolerance error (in radians)
      as a target, triggering at_rot_target and not_at_rot_target events. Returns
      an integer handle to unregister the target via llRotTargetRemove.
  - name: RotTargetRemove
    parameters:
    - name: handle
      type: number
      comment: Integer target handle returned by llRotTarget to remove.
    comment: Removes the rotational target specified by the integer handle registered
      with llRotTarget.
  - name: RotateTexture
    parameters:
    - name: angle
      type: number
      comment: Rotation angle expressed in radians.
    - name: face
      type: number
      comment: Face number or ALL_SIDES.
    comment: Sets the texture rotation of face to the specified angle (in radians).
      If face is ALL_SIDES, rotates the texture on all faces.
  - name: Round
    parameters:
    - name: val
      type: number
      comment: Number to round.
    return-type: number
    comment: Returns val rounded to the nearest integer. Halfway values are rounded
      toward infinity.
    deprecated:
      reason: Fastcall.
      use: math.round
      selene-replace:
      - math.round(%...)
    must-use: true
  - name: SHA1String
    parameters:
    - name: src
      type: string
      comment: Source string to hash.
    return-type: string
    comment: Returns a string of 40 hex characters representing the SHA-1 security
      hash of src.
    must-use: true
  - name: SHA256String
    parameters:
    - name: src
      type: string
      comment: Source string to hash.
    return-type: string
    comment: Returns a string of 64 hex characters representing the SHA-256 security
      hash of src.
    must-use: true
  - name: SameGroup
    parameters:
    - name: uuid
      type: uuid
      comment: UUID of the group, avatar, or prim to check.
    return-type: boolean
    comment: Returns TRUE if the agent or object specified by uuid is in the same
      region (simulator) and shares the same active group as the prim containing the
      script; returns FALSE otherwise.
    must-use: true
  - name: Say
    parameters:
    - name: channel
      type: number
      comment: Chat channel (any 32-bit signed integer value) to chat the message
        on.
    - name: msg
      type: string
      comment: Text message string to broadcast.
    comment: Broadcasts the message msg to all scripts or agents listening on channel
      within llGetEnv("chat_range"), which is 20m on most regions. Agents listen on
      PUBLIC_CHANNEL (0) and DEBUG_CHANNEL (2147483647). All other channels are for
      script-to-script communication.
  - name: ScaleByFactor
    parameters:
    - name: scaling_factor
      type: number
      comment: Multiplier scale factor to apply to the prim sizes and their local
        positions.
    return-type: boolean
    comment: Attempts to uniformly resize the entire object by scaling_factor, maintaining
      size-position ratios of the prims. Fails if the linkset is physical, a pathfinding
      character, in keyframed motion, would exceed prim scale/linkability limits,
      or would overflow parcel capacity.
  - name: ScaleTexture
    parameters:
    - name: u
      type: number
      comment: Horizontal (U) texture repeats scale value, in the interval [-100.0,
        100.0].
    - name: v
      type: number
      comment: Vertical (V) texture repeats scale value, in the interval [-100.0,
        100.0].
    - name: face
      type: number
      comment: Face number or ALL_SIDES.
    comment: Sets the diffuse texture horizontal u and vertical v scales (repeats)
      on the specified face of the prim. Setting face to ALL_SIDES updates all sides.
      Negative scale values flip the texture.
  - name: ScriptDanger
    parameters:
    - name: pos
      type: vector
      comment: Position vector in region coordinates to check.
    return-type: boolean
    comment: Returns TRUE if the vector position pos is over public land, sandbox
      land, land restricting edit/build permissions, or land that disables outside
      scripts.
    must-use: true
  - name: ScriptProfiler
    parameters:
    - name: flags
      type: number
      comment: PROFILE_* flag (such as PROFILE_NONE or PROFILE_SCRIPT_MEMORY) to set
        the profiling state.
    comment: Enables or disables the script's profiling state using flags (supports
      PROFILE_SCRIPT_MEMORY on Mono, or PROFILE_NONE). Active profiling can significantly
      reduce script performance.
  - name: SendRemoteData
    parameters:
    - name: channel
      type: uuid
      comment: XML-RPC channel ID.
    - name: dest
      type: string
      comment: Destination XML-RPC URL or server.
    - name: idata
      type: number
      comment: Integer payload data.
    - name: sdata
      type: string
      comment: String payload data.
    return-type: uuid
    comment: Deprecated. Sends an XML-RPC request to dest on channel, containing the
      channel ID as a string, integer idata, and string sdata. Returns a key representing
      the message_id.
    deprecated: true
  - name: Sensor
    parameters:
    - name: name
      type: string
      comment: Specific object or avatar name to filter for (or empty string for no
        filter).
    - name: id
      type: uuid
      comment: UUID of the group, avatar, or object to filter by (or NULL_KEY for
        no filter).
    - name: type
      type: number
      comment: Integer bitfield type mask containing AGENT, AGENT_BY_LEGACY_NAME,
        AGENT_BY_USERNAME, ACTIVE, PASSIVE, or SCRIPTED (0 for no filter).
    - name: radius
      type: number
      comment: Maximum distance in meters to scan (range [0.0, 96.0]).
    - name: arc
      type: number
      comment: Maximum angle in radians relative to the local X-axis to scan (range
        [0.0, PI]).
    comment: Performs a single scan from the prim's forward vector for name and id
      of type within radius meters and arc radians. Results trigger a sensor or no_sensor
      event. Passing empty filters (blank name, 0 type, or NULL_KEY id) disables that
      filter.
  - name: SensorRemove
    comment: Removes the periodic sensor previously configured by llSensorRepeat.
  - name: SensorRepeat
    parameters:
    - name: name
      type: string
      comment: Specific object or avatar name to filter for (or empty string for no
        filter).
    - name: id
      type: uuid
      comment: UUID of the group, avatar, or object to filter by (or NULL_KEY for
        no filter).
    - name: type
      type: number
      comment: Integer bitfield type mask containing AGENT, AGENT_BY_LEGACY_NAME,
        AGENT_BY_USERNAME, ACTIVE, PASSIVE, or SCRIPTED (0 for no filter).
    - name: radius
      type: number
      comment: Maximum distance in meters to scan (range [0.0, 96.0]).
    - name: arc
      type: number
      comment: Maximum angle in radians relative to the local X-axis to scan (range
        [0.0, PI]).
    - name: rate
      type: number
      comment: Interval in seconds between repeated scans.
    comment: Sets up a repeating periodic scan every rate seconds for name and id
      of type within radius meters and arc radians of the forward vector. Results
      trigger sensor or no_sensor events.
  - name: SetAgentEnvironment
    parameters:
    - name: agent_id
      type: uuid
      comment: UUID of the agent participating in the experience.
    - name: transition
      type: number
      comment: Transition duration in seconds.
    - name: params
      type: list
      comment: A list of environmental parameters to apply.
    return-type: number
    comment: Sets an individual agent's environmental settings using the attributes
      in params over a duration of transition seconds. Must be used as part of an
      experience; passing an empty list removes overrides.
  - name: SetAgentRot
    parameters:
    - name: rot
      type: quaternion
      comment: Target rotation to turn the avatar to face.
    - name: flags
      type: number
      comment: Flags to configure the rotation behavior.
    comment: Sets the rotation of the avatar to rot, controlled by flags.
  - name: SetAlpha
    parameters:
    - name: alpha
      type: number
      comment: Transparency value to set, from 0.0 (clear) to 1.0 (solid; clamped
        to a minimum of 0.1).
    - name: face
      type: number
      comment: Face number or ALL_SIDES.
    comment: Sets the diffuse texture alpha (opacity) of face. If face is ALL_SIDES,
      applies to all faces. Values are clamped between 0.1 and 1.0 (where 1.0 is fully
      opaque).
  - name: SetAngularVelocity
    parameters:
    - name: initial_omega
      type: vector
      comment: Angular velocity vector to apply (in radians per second).
    - name: is_local
      type: boolean | number
      comment: Boolean. If TRUE, initial_omega is treated as a local vector; if FALSE,
        as a global region vector.
    comment: Sets the angular velocity of a physical object to initial_omega (mass-independent).
      If local is TRUE, applied in local coordinates; if FALSE, applied in global
      coordinates. Has no effect on non-physical objects.
  - name: SetAnimationOverride
    parameters:
    - name: anim_state
      type: string
      comment: Animation state to override.
    - name: anim
      type: string
      comment: Name of an animation in the prim's inventory, or a built-in animation
        name.
    comment: Overrides the default animation for anim_state with anim (which must
      be in the object's inventory or a built-in animation). Requires the PERMISSION_OVERRIDE_ANIMATIONS
      permission.
  - name: SetBuoyancy
    parameters:
    - name: buoyancy
      type: number
      comment: Float buoyancy value to set.
    comment: Sets the buoyancy of a physical object (requires physics to be enabled).
      A value of 0.0 offers no buoyancy, < 1.0 sinks, 1.0 counteracts gravity, and
      > 1.0 rises.
  - name: SetCameraAtOffset
    parameters:
    - name: offset
      type: vector
      comment: Offset position vector in local coordinates relative to the prim.
    comment: Sets the target offset vector (in local coordinates) that a seated avatar's
      camera will look at.
  - name: SetCameraEyeOffset
    parameters:
    - name: offset
      type: vector
      comment: Offset position vector in local coordinates relative to the prim.
    comment: Sets the eye offset vector (in local coordinates) where a seated avatar's
      camera is positioned.
  - name: SetCameraParams
    parameters:
    - name: rules
      type: list | CameraParams
      comment: A strided list of rules and data pairs configuring the camera.
    comment: Sets multiple camera parameters simultaneously using the list of rules.
      Requires the PERMISSION_CONTROL_CAMERA runtime permission.
  - name: SetClickAction
    parameters:
    - name: action
      type: number
      comment: CLICK_ACTION_* flag representing the action to apply.
    comment: Sets the action (a CLICK_ACTION_* flag) performed when an avatar left-clicks
      the prim.
  - name: SetColor
    parameters:
    - name: color
      type: vector
      comment: Color vector in RGB <R, G, B> (values from 0.0 to 1.0).
    - name: face
      type: number
      comment: Face number or ALL_SIDES.
    comment: Sets the Blinn-Phong diffuse RGB color of face. If face is ALL_SIDES,
      applies the color to all faces.
  - name: SetContentType
    parameters:
    - name: request_id
      type: uuid
      comment: Unique key identifying the incoming HTTP request.
    - name: content_type
      type: number
      comment: CONTENT_TYPE_* constant representing the Internet media type to use.
    comment: Sets the 'Content-Type' header of subsequent HTTP server responses (via
      llHTTPResponse) for request_id using the specified content_type (a CONTENT_TYPE_*
      constant).
  - name: SetDamage
    parameters:
    - name: damage
      type: number
      comment: Float damage value to set (range -100.0 for full heal to 100.0 for
        instant kill).
    comment: Sets the amount of damage delivered when this object hits an avatar.
      The object is immediately destroyed upon inflicting damage, and no collision
      event is triggered.
  - name: SetEnvironment
    parameters:
    - name: position
      type: vector
      comment: Position vector in region coordinates to specify the target parcel,
        or <-1.0, -1.0, z> for the entire region (where z specifies the sky track,
        or -1 for all tracks).
    - name: params
      type: list
      comment: A list of environmental attributes and values to apply (or empty to
        clear).
    return-type: number
    comment: Overrides the environmental settings at position for a parcel (or region
      if position is <-1.0, -1.0, z>) using the parameters in params. Passing an empty
      params list removes previous overrides.
  - name: SetExperienceKey
    parameters:
    - name: experienceid
      type: uuid
    return-type: number
    deprecated: true
  - name: SetForce
    parameters:
    - name: force
      type: vector
      comment: Directional force vector to apply.
    - name: is_local
      type: boolean | number
      comment: Boolean. If TRUE, force is treated as a local vector; if FALSE, as
        a global region vector.
    comment: Applies a constant linear force to a physical object. If local is TRUE,
      force is applied relative to local coordinates; if FALSE, applied relative to
      region coordinates.
  - name: SetForceAndTorque
    parameters:
    - name: force
      type: vector
      comment: Directional linear force vector.
    - name: torque
      type: vector
      comment: Torque rotational force vector.
    - name: is_local
      type: boolean | number
      comment: Boolean. If TRUE, force and torque are treated as local vectors; if
        FALSE, as global region vectors.
    comment: Sets both the constant linear force and constant torque acting on a physical
      object. If local is TRUE, forces are applied in local coordinates; if FALSE,
      in global coordinates.
  - name: SetGroundTexture
    parameters:
    - name: changes
      type: list
      comment: A list of terrain detail properties and values to change.
    return-type: number
    comment: Changes the painted terrain textures on the region based on changes.
      The script owner must have estate management rights. Returns an integer status.
  - name: SetHoverHeight
    parameters:
    - name: height
      type: number
      comment: Distance to hover above the ground or water.
    - name: water
      type: boolean | number
      comment: Boolean. If TRUE, hovers above water too; if FALSE, water is ignored.
    - name: tau
      type: number
      comment: Timescale in seconds to critically damp the movement.
    comment: Critically damps the physical object's vertical movement to hover at
      height (above ground, or above water if water is TRUE) in tau seconds. Do not
      use with vehicles; call llStopHover to cancel.
  - name: SetInventoryPermMask
    parameters:
    - name: item
      type: string
      comment: Name of the item in the prim's inventory.
    - name: group
      type: number
      comment: MASK_* group (e.g., MASK_BASE, MASK_OWNER, MASK_GROUP, MASK_EVERYONE,
        or MASK_NEXT) to set.
    - name: flags
      type: number
      comment: Bitfield of permissions (PERM_* flags) to set.
    comment: Sets the specified item's permission flags for the specified group.
  - name: SetKeyframedMotion
    parameters:
    - name: keyframes
      type: list
      comment: A strided list of the form [vector position, rotation orientation,
        float time] representing sequential relative keyframes (minimum time is 1/9s).
    - name: options
      type: list | KeyframedMotionParams
      comment: A list of options (KFM_* constants) to modify playback behavior.
    comment: Smoothly moves a non-physical object between the positions, orientations,
      and times specified in the keyframes list, configured via options. Collisions
      with keyframed objects are ignored. An empty keyframes list terminates the motion.
  - name: SetLinkAlpha
    parameters:
    - name: link
      type: number
      comment: Link number (1 for root, >1 for children) or a LINK_* flag.
    - name: alpha
      type: number
      comment: Transparency value to set, from 0.0 (clear) to 1.0 (solid).
    - name: face
      type: number
      comment: Face number or ALL_SIDES.
    comment: Sets the Blinn-Phong alpha (transparency) of face on the linked prim
      link.
  - name: SetLinkCamera
    parameters:
    - name: link
      type: number
      comment: Link number (1 for root, >1 for children) or a LINK_* flag.
    - name: eye
      type: vector
      comment: Eye offset position vector in local coordinates relative to the prim.
    - name: at
      type: vector
      comment: Look-at offset position vector in local coordinates relative to the
        prim.
    comment: Sets the camera eye position offset eye and looking-at position offset
      at for avatars who sit on the linked prim link.
  - name: SetLinkColor
    parameters:
    - name: link
      type: number
      comment: Link number (1 for root, >1 for children) or a LINK_* flag.
    - name: color
      type: vector
      comment: Color vector in RGB <R, G, B> (values from 0.0 to 1.0).
    - name: face
      type: number
      comment: Face number or ALL_SIDES.
    comment: Sets the Blinn-Phong diffuse RGB color of face on the linked prim link.
  - name: SetLinkGLTFOverrides
    parameters:
    - name: link
      type: number
      comment: Link number (1 for root, >1 for children) or a LINK_* flag.
    - name: face
      type: number
      comment: Face number or ALL_SIDES.
    - name: params
      type: list | GltfOverrides
      comment: A list of overrides and their corresponding values to set.
    comment: Sets or removes individual GLTF override parameters specified by params
      on face of the linked prim link.
  - name: SetLinkMedia
    parameters:
    - name: link
      type: number
      comment: Link number (1 for root, >1 for children) or a LINK_* flag.
    - name: face
      type: number
      comment: Face number (side) of the prim.
    - name: params
      type: list | PrimMediaParams
      comment: A set of property-value pairs (in no particular order) specifying media
        parameters, or a PrimMediaParams dictionary.
    return-type: number
    comment: Sets the media parameters specified by params on face of the linked prim
      link without a script delay. Returns an integer STATUS_* flag detailing success
      or failure.
  - name: SetLinkPrimitiveParams
    parameters:
    - name: link
      type: number
      comment: Link number (1 for root, >1 for children) or a LINK_* flag.
    - name: rules
      type: list
      comment: A list of PRIM_* rules and data to apply.
    comment: Deprecated (use llSetLinkPrimitiveParamsFast instead). Sets primitive
      parameters for the linked prim link according to rules.
    deprecated:
      use: ll.SetLinkPrimitiveParamsFast
      selene-replace:
      - ll.SetLinkPrimitiveParamsFast(%...)
  - name: SetLinkPrimitiveParamsFast
    parameters:
    - name: link
      type: number
      comment: Link number (1 for root, >1 for children) or a LINK_* flag.
    - name: rules
      type: list
      comment: A list of PRIM_* rules and data to apply.
    comment: Sets primitive parameters for the linked prim link according to rules
      with no built-in script sleep delay.
  - name: SetLinkRenderMaterial
    parameters:
    - name: link
      type: number
      comment: Link number (1 for root, >1 for children) or a LINK_* flag.
    - name: material
      type: string | uuid
      comment: Name of a material in the prim's inventory, or a UUID.
    - name: face
      type: number
      comment: Face number or ALL_SIDES.
    comment: 'Applies material (UUID or inventory name) to face of the linked prim
      link. Note: This clears most PRIM_GLTF_* properties on the face except for repeats,
      offsets, and rotation.'
  - name: SetLinkSitFlags
    parameters:
    - name: link
      type: number
      comment: Link number (1 for root, >1 for children) or a LINK_* flag.
    - name: flags
      type: number
      comment: A bitfield of sit flags (SIT_FLAG_*) to apply.
    comment: Sets the sit target flags for the linked prim link inside the linkset.
  - name: SetLinkTexture
    parameters:
    - name: link
      type: number
      comment: Link number (1 for root, >1 for children) or a LINK_* flag.
    - name: texture
      type: string | uuid
      comment: Name of a texture in the prim's inventory, or a UUID.
    - name: face
      type: number
      comment: Face number or ALL_SIDES.
    comment: Applies texture (UUID or inventory name) to face of the linked prim link.
  - name: SetLinkTextureAnim
    parameters:
    - name: link
      type: number
      comment: Link number (1 for root, >1 for children) or a LINK_* flag to animate.
    - name: mode
      type: number
      comment: Bitfield of texture animation mode flags (ANIM_ON, LOOP, etc.).
    - name: face
      type: number
      comment: Face number or ALL_SIDES.
    - name: sizex
      type: number
      comment: Number of horizontal frames (ignored for ROTATE and SCALE).
    - name: sizey
      type: number
      comment: Number of vertical frames (ignored for ROTATE and SCALE).
    - name: start
      type: number
      comment: Start frame number (or radians for ROTATE).
    - name: length
      type: number
      comment: Number of frames to display (or radians for ROTATE).
    - name: rate
      type: number
      comment: Playback rate in frames per second (or radians/sec for ROTATE, UV coords/sec
        for SMOOTH). Must not be zero.
    comment: Animates the texture on face of the linked prim link by setting the scale
      and offset according to mode. Parameters sizex/sizey define frames, start defines
      the start frame/angle, length defines duration, and rate defines playback speed.
  - name: SetLocalRot
    parameters:
    - name: rot
      type: quaternion
      comment: Local rotation to set.
    comment: Sets the rotation of a child prim relative to its root prim using rot.
  - name: SetObjectDesc
    parameters:
    - name: description
      type: string
      comment: New description string (up to 127 characters).
    comment: Sets the description of the prim containing the script to description
      (limited to 127 characters).
  - name: SetObjectName
    parameters:
    - name: name
      type: string
      comment: New name string.
    comment: Sets the name of the prim containing the script to name.
  - name: SetObjectPermMask
    parameters:
    - name: group
      type: number
      comment: MASK_* group (e.g., MASK_BASE, MASK_OWNER, MASK_GROUP, MASK_EVERYONE,
        or MASK_NEXT) to set.
    - name: flags
      type: number
      comment: Bitfield of permissions (PERM_* flags) to set.
    comment: Sets the scripts's object's permission flags for the specified group.
  - name: SetParcelForSale
    parameters:
    - name: ForSale
      type: boolean | number
      comment: Boolean. If TRUE, puts the parcel up for sale; if FALSE, removes it
        from sale.
    - name: Options
      type: list | ParcelSaleParams
      comment: A list of options to configure the sale (e.g., price, authorized buyer,
        and object inclusion).
    return-type: number
    comment: Sets the parcel the object is on for sale. If ForSale is TRUE, puts the
      land up for sale using Options (price, buyer, objects included). Setting ForSale
      to FALSE removes the parcel from sale. Requires parcel ownership and the PERMISSION_PRIVILEGED_LAND_ACCESS
      permission. Returns an error code or 0 if successful.
  - name: SetParcelMusicURL
    parameters:
    - name: url
      type: string
      comment: Streaming audio URL string.
    comment: Sets the streaming audio (music) URL for the parcel containing the object.
      The object owner must match the landowner or land group.
  - name: SetPayPrice
    parameters:
    - name: price
      type: number
      comment: Default price integer shown in the text field (can accept PAY_* constants
        or positive values).
    - name: quick_pay_buttons
      type: '{number}'
      comment: A list of four integer values or PAY_* constants specifying the button
        payment choices.
    comment: Suggests default amounts for the pay text input field price and the four
      payment dialog quick_pay_buttons when an avatar pays this object.
  - name: SetPhysicsMaterial
    parameters:
    - name: mask
      type: number
      comment: Bitwise mask combination specifying which of the floats (DENSITY, FRICTION,
        RESTITUTION, or GRAVITY_MULTIPLIER) to apply.
    - name: gravity_multiplier
      type: number
      comment: Gravity multiplier float value (range [-1.0, +28.0], default is 1.0).
    - name: restitution
      type: number
      comment: Elasticity restitution float value (range [0.0, 1.0]).
    - name: friction
      type: number
      comment: Friction coefficient float value (range [0.0, 255.0]).
    - name: density
      type: number
      comment: "Density float value in kg/m\xB3 (range [1.0, 22587.0])."
    comment: Configures the physical characteristics of an object. The mask bitfield
      specifies which of the other parameters (gravity_multiplier, restitution, friction,
      or density) should be applied to the object.
  - name: SetPos
    parameters:
    - name: pos
      type: vector
      comment: Position vector to move to (in region coordinates, or local coordinates
        if in a child prim).
    comment: Moves the non-physical object or prim toward the vector pos (up to 10m).
      If called in a child prim, pos is treated as root-relative; if called from the
      root prim, the entire object is moved.
  - name: SetPrimMediaParams
    parameters:
    - name: face
      type: number
      comment: Face number (side) of the prim.
    - name: params
      type: list | PrimMediaParams
      comment: A set of property-value pairs (in no particular order) specifying media
        parameters.
    return-type: number
    comment: Sets the media parameters specified by params on the designated face
      of the prim. Returns an integer STATUS_* flag detailing success or failure.
  - name: SetPrimURL
    parameters:
    - name: url
      type: string
      comment: Web URL to display.
    comment: Deprecated (use llSetPrimMediaParams instead). Updates the URL displayed
      on the prim's faces.
    deprecated:
      use: ll.SetPrimMediaParams
      selene-replace:
      - ll.SetPrimMediaParams(ALL_SIDES, {PRIM_MEDIA_CURRENT_URL, %1})
  - name: SetPrimitiveParams
    parameters:
    - name: rules
      type: list
      comment: A list of PRIM_* rules and data to apply.
    comment: Deprecated (use llSetLinkPrimitiveParamsFast instead). Sets the prim's
      attributes according to rules.
    deprecated:
      use: ll.SetLinkPrimitiveParamsFast
      selene-replace:
      - ll.SetLinkPrimitiveParamsFast(%...)
  - name: SetRegionPos
    parameters:
    - name: position
      type: vector
      comment: Target position vector in region coordinates (can cross up to 10m over
        a region border).
    return-type: boolean
    comment: Tries to move the entire object so that its root prim is within 0.1m
      of the vector position (underground positions are set to ground level). Returns
      TRUE on success or FALSE on failure.
  - name: SetRemoteScriptAccessPin
    parameters:
    - name: pin
      type: number
      comment: Integer PIN code (non-zero enables, zero disables).
    comment: Sets the prim's remote script access PIN to pin (a non-zero value enables
      loading via llRemoteLoadScriptPin, while zero disables it).
  - name: SetRenderMaterial
    parameters:
    - name: material
      type: string | uuid
      comment: Name of a material in the prim's inventory, or a UUID.
    - name: face
      type: number
      comment: Face number or ALL_SIDES.
    comment: 'Applies material (UUID or inventory name) to face of the prim. Note:
      This clears most PRIM_GLTF_* properties on the face except for repeats, offsets,
      and rotation.'
  - name: SetRot
    parameters:
    - name: rot
      type: quaternion
      comment: Target rotation.
    comment: Sets the rotation of the prim to rot. If in a child prim, rot is treated
      as root-relative; if in the root prim of a non-physical object, rotates the
      entire object.
  - name: SetScale
    parameters:
    - name: size
      type: vector
      comment: Target size vector.
    comment: Sets the physical scale (dimensions) of the prim containing the script
      to size.
  - name: SetScriptState
    parameters:
    - name: script
      type: string
      comment: Name of the script in the prim's inventory.
    - name: running
      type: boolean | number
      comment: Boolean. If TRUE, enables the script; if FALSE, disables it.
    comment: Sets the running state of the named script in the prim's inventory. If
      running is TRUE, the script is enabled; if FALSE, it is disabled.
  - name: SetSitText
    parameters:
    - name: text
      type: string
      comment: Context menu text to display.
    comment: Displays the string text instead of 'Sit' (or 'Sit Here') in the viewer's
      right-click context menu.
  - name: SetSoundQueueing
    parameters:
    - name: queue
      type: boolean | number
      comment: Boolean. If TRUE, sound queuing is enabled; if FALSE, it is disabled.
    comment: Sets whether attached sounds wait for the current sound to end before
      playing (enables queuing if queue is TRUE, disables if FALSE). The queue is
      one level deep.
  - name: SetSoundRadius
    parameters:
    - name: radius
      type: number
      comment: Maximum distance in meters at which the sounds can be heard.
    comment: Limits the audibility radius of attached and triggered scripted sounds
      to distance radius.
  - name: SetStatus
    parameters:
    - name: status
      type: number
      comment: Bitmask representing the STATUS_* flag(s) to change.
    - name: value
      type: boolean | number
      comment: Boolean. If TRUE, enables the status; if FALSE, disables it.
    comment: Sets the object status attributes specified by status to value.
  - name: SetText
    parameters:
    - name: text
      type: string
      comment: Floating text string to display.
    - name: color
      type: vector
      comment: Color vector in RGB <R, G, B> (values from 0.0 to 1.0).
    - name: alpha
      type: number
      comment: Transparency value to set, from 0.0 (clear) to 1.0 (solid).
    comment: Displays floating text above the prim with the specified color vector
      and transparency alpha.
  - name: SetTexture
    parameters:
    - name: texture
      type: string | uuid
      comment: Name of a texture in the prim's inventory, or a UUID.
    - name: face
      type: number
      comment: Face number or ALL_SIDES.
    comment: Applies the Blinn-Phong diffuse texture to face of the prim.
  - name: SetTextureAnim
    parameters:
    - name: mode
      type: number
      comment: Bitfield of texture animation mode flags (ANIM_ON, LOOP, etc.).
    - name: face
      type: number
      comment: Face number or ALL_SIDES.
    - name: sizex
      type: number
      comment: Number of horizontal frames (ignored for ROTATE and SCALE).
    - name: sizey
      type: number
      comment: Number of vertical frames (ignored for ROTATE and SCALE).
    - name: start
      type: number
      comment: Start frame number (or radians for ROTATE).
    - name: length
      type: number
      comment: Number of frames to display (or radians for ROTATE).
    - name: rate
      type: number
      comment: Playback rate in frames per second (or radians/sec for ROTATE, UV coords/sec
        for SMOOTH). Must not be zero.
    comment: Animates the texture on face of the prim by setting its scale and offset.
      mode defines options, sizex/sizey define frames, start defines the start frame/angle,
      length defines duration, and rate defines playback speed.
  - name: SetTorque
    parameters:
    - name: torque
      type: vector
      comment: Torque rotational force vector.
    - name: is_local
      type: boolean | number
      comment: Boolean. If TRUE, torque is treated as a local vector; if FALSE, as
        a global region vector.
    comment: Applies a constant torque rotational force to a physical object. If local
      is TRUE, torque is applied in local coordinates; if FALSE, applied in global
      coordinates.
  - name: SetTouchText
    parameters:
    - name: text
      type: string
      comment: Context menu text to display.
    comment: Displays the string text instead of 'Touch' in the right-click context
      menu.
  - name: SetVehicleFlags
    parameters:
    - name: flags
      type: number
      comment: A bitwise mask of VEHICLE_FLAG_* constants to enable.
    comment: Enables the vehicle flags specified in the Flags bitmask.
  - name: SetVehicleFloatParam
    parameters:
    - name: param
      type: number
      comment: VEHICLE_* float parameter constant to set.
    - name: value
      type: number
      comment: Float value to set.
    comment: Sets the specified vehicle float parameter param to value.
  - name: SetVehicleRotationParam
    parameters:
    - name: param
      type: number
      comment: VEHICLE_* rotation parameter constant to set.
    - name: rot
      type: quaternion
      comment: Rotation value to set.
    comment: Sets the specified vehicle rotation parameter param to rot.
  - name: SetVehicleType
    parameters:
    - name: type
      type: number
      comment: VEHICLE_TYPE_* constant to set.
    comment: Sets the vehicle physics preset type to one of the default vehicle types.
  - name: SetVehicleVectorParam
    parameters:
    - name: param
      type: number
      comment: VEHICLE_* vector parameter constant to set.
    - name: vec
      type: vector
      comment: Vector value to set.
    comment: Sets the specified vehicle vector parameter param to vec.
  - name: SetVelocity
    parameters:
    - name: velocity
      type: vector
      comment: Linear velocity vector to apply (in meters per second).
    - name: is_local
      type: boolean | number
      comment: Boolean. If TRUE, velocity is treated as a local directional vector;
        if FALSE, as a global region vector.
    comment: Sets the linear velocity of a physical object to velocity. If local is
      TRUE, velocity is treated as a local directional vector; if FALSE, as a global
      region directional vector. Has no effect on non-physical objects.
  - name: Shout
    parameters:
    - name: channel
      type: number
      comment: Chat channel (any 32-bit signed integer value) to shout the message
        on.
    - name: msg
      type: string
      comment: Text message string to broadcast.
    comment: Broadcasts the message msg to all scripts or agents listening on channel
      within llGetEnv("shout_range"), which is 100m on most regions. Agents listen
      on PUBLIC_CHANNEL (0) and DEBUG_CHANNEL (2147483647). All other channels are
      for script-to-script communication.
  - name: SignRSA
    parameters:
    - name: private_key
      type: string
      comment: PEM-formatted private key.
    - name: msg
      type: string
      comment: Message contents to sign.
    - name: algorithm
      type: string
      comment: Digest algorithm to use (sha1, sha224, sha256, sha384, or sha512).
    return-type: string
    comment: Returns the Base64-encoded RSA signature of msg using the PEM-formatted
      private_key and the specified digest algorithm (sha1, sha224, sha256, sha384,
      or sha512). Can be paired with llVerifyRSA to pass verifiable messages.
    must-use: true
  - name: Sin
    parameters:
    - name: theta
      type: number
      comment: Angle in radians.
    return-type: number
    comment: Returns the sine of theta. Theta is in radians.
    deprecated:
      reason: Double precision; fastcall.
      use: math.sin
      selene-replace:
      - math.sin(%...)
    must-use: true
  - name: SitOnLink
    parameters:
    - name: agent_id
      type: uuid
      comment: UUID of the avatar being forced to sit.
    - name: link
      type: number
      comment: Link number for the prim containing the desired sit target.
    return-type: number
    comment: Forces the avatar specified by agent_id (who must be participating in
      the experience) to sit on the sit target of the prim indicated by link. If occupied,
      searches down the linkset for an available sit target. Returns an integer.
  - name: SitTarget
    parameters:
    - name: offset
      type: vector
      comment: Target position vector in local prim coordinates.
    - name: rot
      type: quaternion
      comment: Target rotation relative to the prim's rotation.
    comment: Sets the sit target position (offset) and rotation (rot) relative to
      the prim's position and orientation. Clears the sit target if offset is ZERO_VECTOR.
  - name: Sleep
    parameters:
    - name: sec
      type: number
      comment: Duration in seconds to put the script to sleep.
    comment: Puts the script to sleep for sec seconds (at least until the next server-frame,
      ~0.02222 seconds). The script is inactive during this time. If sec is 0.0 or
      less, the script does not sleep.
  - name: Sound
    parameters:
    - name: sound
      type: string | uuid
      comment: Name of a sound in the prim's inventory, or a UUID.
    - name: volume
      type: number
      comment: Volume level to set, between 0.0 (silent) and 1.0 (loud).
    - name: queue
      type: boolean | number
      comment: Boolean. If TRUE, queues the sound; if FALSE, interrupts the currently
        playing sound.
    - name: loop
      type: boolean | number
      comment: Boolean. If TRUE, loops the sound.
    comment: Deprecated (use llPlaySound instead). Plays the specified sound at volume,
      with options to loop or queue the sound.
    deprecated:
      use: ll.PlaySound
      selene-replace:
      - ll.PlaySound(%1, %2)
      - ll.LoopSound(%1, %2)
  - name: SoundPreload
    parameters:
    - name: sound
      type: string | uuid
      comment: Name of a sound in the prim's inventory, or a UUID.
    comment: Deprecated (use llPreloadSound instead). Preloads the specified sound
      on viewers within range.
    deprecated:
      use: ll.PreloadSound
      selene-replace:
      - ll.PreloadSound(%1)
  - name: Sqrt
    parameters:
    - name: val
      type: number
      comment: Positive float value (must be >= 0.0).
    return-type: number
    comment: Returns the square root of val. If negative, return NaN.
    deprecated:
      reason: Double precision; fastcall.
      use: math.sqrt
      selene-replace:
      - math.sqrt(%...)
    must-use: true
  - name: StartAnimation
    parameters:
    - name: anim
      type: string
      comment: Name of the animation in the prim's inventory, or the built-in animation
        name.
    comment: Starts the animation anim (inventory or built-in) on the avatar who granted
      the script the PERMISSION_TRIGGER_ANIMATION permission (automatically granted
      for attached or sat-on objects).
  - name: StartObjectAnimation
    parameters:
    - name: anim
      type: string
      comment: Name of the animation in the prim's inventory, or the built-in animation
        name.
    comment: Starts the specified animation anim (inventory or built-in) on the rigged
      mesh object associated with the current script.
  - name: StopAnimation
    parameters:
    - name: anim
      type: string | uuid
      comment: Name of the animation in the prim's inventory, the UUID of the animation,
        or the built-in animation name.
    comment: Stops the specified animation anim (inventory, built-in, or UUID) on
      the avatar who granted the script the PERMISSION_TRIGGER_ANIMATION permission
      (automatically granted for attached or sat-on objects).
  - name: StopHover
    comment: Stops the hover behavior (such as that initiated by llSetHoverHeight).
  - name: StopLookAt
    comment: Stops causing the object to look at or point toward a target (canceling
      llLookAt or llRotLookAt).
  - name: StopMoveToTarget
    comment: Stops the critically damped movement of the object toward a target (canceling
      llMoveToTarget). Use llStopLookAt to stop rotational tracking.
  - name: StopObjectAnimation
    parameters:
    - name: anim
      type: string | uuid
      comment: Name of the animation in the prim's inventory, the UUID of the animation,
        or the built-in animation name.
    comment: Stops the specified animation anim (inventory, built-in, or UUID) on
      the rigged mesh object associated with the current script.
  - name: StopPointAt
    comment: Stops the avatar who owns the object from pointing.
    deprecated: true
  - name: StopSound
    comment: Stops playback of the currently playing attached sound.
  - name: StringLength
    parameters:
    - name: str
      type: string
      comment: String to measure.
    return-type: number
    comment: Returns the number of unicode codepoints in the string.
    deprecated:
      reason: Use 'utf8.len' or '#' or 'string.len' instead.
      selene-replace:
      - utf8.len(%1)
      - '#%1'
      - string.len(%1)
    must-use: true
  - name: StringToBase64
    parameters:
    - name: str
      type: string
      comment: Source string to encode.
    return-type: string
    comment: Returns the Base64 representation string of str, interpreting it as a
      UTF-8 byte sequence.
    deprecated:
      use: llbase64.encode
      selene-replace:
      - llbase64.encode(%1)
    must-use: true
  - name: StringTrim
    parameters:
    - name: src
      type: string
      comment: String to trim.
    - name: type
      type: number
      comment: Trim type flag (STRING_TRIM_HEAD, STRING_TRIM_TAIL, or STRING_TRIM).
    return-type: string
    comment: Returns a copy of the string src with leading, trailing, or both types
      of whitespace (including spaces, tabs, and line feeds) eliminated, according
      to the specified trim type.
    must-use: true
  - name: SubStringIndex
    parameters:
    - name: source
      type: string
      comment: Source string to search within.
    - name: pattern
      type: string
      comment: Substring pattern to search for.
    return-type: number?
    comment: Returns the codepoint index of the first occurrence of pattern inside
      the string source. Returns nil if not found. No regex.
    must-use: true
  - name: TakeCamera
    parameters:
    - name: avatar
      type: uuid
      comment: UUID of the avatar in the same region.
    comment: Deprecated (use llSetCameraParams instead). Formerly used to take control
      of the agent's camera.
    deprecated:
      use: ll.SetCameraParams
  - name: TakeControls
    parameters:
    - name: controls
      type: number
      comment: Bitfield of CONTROL_* flags to intercept.
    - name: accept
      type: boolean | number
      comment: Boolean. Determines whether control events are generated to trigger
        script handlers.
    - name: pass_on
      type: boolean | number
      comment: Boolean. If TRUE, the keys also perform their default functions; if
        FALSE, default actions are suppressed.
    comment: Intercepts inputs (keyboard/mouse clicks) from the agent, specifically
      those specified by controls. The boolean accept determines if events are generated,
      and pass_on determines if inputs also perform their default functions. Requires
      the PERMISSION_TAKE_CONTROLS runtime permission.
  - name: Tan
    parameters:
    - name: theta
      type: number
      comment: Angle in radians.
    return-type: number
    comment: Returns the tangent of theta. Theta is in radians.
    deprecated:
      reason: Double precision; fastcall.
      use: math.tan
      selene-replace:
      - math.tan(%...)
    must-use: true
  - name: Target
    parameters:
    - name: position
      type: vector
      comment: Target position vector in region coordinates.
    - name: range
      type: number
      comment: Radius tolerance in meters surrounding the target position.
    return-type: number
    comment: Registers a positional target at position with a leeway radius range.
      This triggers at_target and not_at_target events. Returns an integer handle
      to unregister the target via llTargetRemove.
  - name: TargetOmega
    parameters:
    - name: axis
      type: vector
      comment: Local axis vector around which the object rotates.
    - name: spinrate
      type: number
      comment: Rotation rate multiplier in radians per second.
    - name: gain
      type: number
      comment: A float modulating the rotational strength (disables the rotation if
        set to 0.0).
    comment: Applies a smooth client-side rotation around the local axis at a rate
      equal to spinrate multiplied by the magnitude of axis (in radians per second)
      with a force defined by gain. Set spinrate to 0.0 to cancel.
  - name: TargetRemove
    parameters:
    - name: handle
      type: number
      comment: Integer target handle returned by llTarget to remove.
    comment: Removes the positional target specified by the integer handle registered
      with llTarget.
  - name: TargetedEmail
    parameters:
    - name: target
      type: number
      comment: Target constant (e.g., TARGETED_EMAIL_OBJECT_OWNER or TARGETED_EMAIL_ROOT_CREATOR).
    - name: subject
      type: string
      comment: Subject of the email.
    - name: msg
      type: string
      comment: Email message body.
    comment: Sends an email to with the given subject subject and body msg to the
      target (which can designate the owner or creator of the object). The email will
      be sent from `{ll.GetKey()}@lsl.secondlife.com`.
  - name: TeleportAgent
    parameters:
    - name: agent
      type: uuid
      comment: UUID of the owning avatar to teleport.
    - name: landmark
      type: string
      comment: Name of the landmark in the prim's inventory, or an empty string to
        teleport locally.
    - name: position
      type: vector
      comment: Position vector in local region coordinates to teleport to if landmark
        is empty.
    - name: look_at
      type: vector
      comment: Position vector (or direction unit vector if teleporting out of region)
        the agent faces upon landing.
    comment: Teleports the owning agent (who must grant PERMISSION_TELEPORT) to a
      landmark in the object's inventory. If landmark is empty, teleports them to
      position within the current region. Upon arrival, the agent is turned to face
      look_at. Can only teleport the owner.
  - name: TeleportAgentGlobalCoords
    parameters:
    - name: agent
      type: uuid
      comment: UUID of the owning avatar to teleport.
    - name: global_coordinates
      type: vector
      comment: Global coordinates vector of the target region (obtained via llRequestSimulatorData).
    - name: region_coordinates
      type: vector
      comment: Target coordinates vector within the destination region.
    - name: look_at
      type: vector
      comment: Position vector within the region (or unit direction vector if out
        of region) that the agent faces upon landing.
    comment: Teleports the owning agent (who must grant PERMISSION_TELEPORT) to region_coordinates
      within a target region specified by global_coordinates. Upon landing, the agent
      faces the direction look_at. Can only teleport the owner.
  - name: TeleportAgentHome
    parameters:
    - name: avatar
      type: uuid
      comment: UUID of the avatar to teleport.
    comment: Teleports the avatar (who must be standing on land owned by the script
      owner) directly to their designated home location without warning (similar to
      a God Summons).
  - name: TextBox
    parameters:
    - name: agent
      type: uuid
      comment: UUID of the agent in the same region.
    - name: msg
      type: string
      comment: Text message to display in the text box.
    - name: channel
      type: number
      comment: Output chat channel (any 32-bit signed integer value) where the input
        text is chatted.
    comment: Opens an input text box dialog displaying msg to the agent. Submitting
      text chats the input string on channel as if said by the agent. The chat originates
      at the object's position, but uses the agent's name and UUID, so it can be heard
      as long as the agent is still in the region.
  - name: ToLower
    parameters:
    - name: src
      type: string
      comment: Source string to convert.
    return-type: string
    comment: Returns a lowercase copy of the string src. Converts all unicode characters,
      not just ASCII.
    must-use: true
  - name: ToUpper
    parameters:
    - name: src
      type: string
      comment: Source string to convert.
    return-type: string
    comment: Returns an uppercase copy of the string src. Converts all unicode characters,
      not just ASCII.
    must-use: true
  - name: TransferLindenDollars
    parameters:
    - name: destination
      type: uuid
      comment: UUID of the destination avatar.
    - name: amount
      type: number
      comment: Quantity of L$ to transfer (must be greater than 0).
    return-type: uuid
    comment: Transfers amount of L$ from the script owner to the destination avatar,
      requiring the PERMISSION_DEBIT permission. Returns a key query handle matching
      the resulting transaction_result event.
  - name: TransferOwnership
    parameters:
    - name: agent
      type: uuid
      comment: UUID of the agent to receive ownership of the object.
    - name: flags
      type: number
      comment: Flags controlling the transfer type (such as TRANSFER_FLAG_COPY or
        TRANSFER_FLAG_TAKE).
    - name: options
      type: list
      comment: Extra options applied to the transfer (currently unused).
    return-type: number
    comment: Transfers ownership of the object (or a copy of it, depending on Flags)
      to the specified agent. Returns an integer indicating the success or failure
      of the transfer.
  - name: TriggerSound
    parameters:
    - name: sound
      type: string | uuid
      comment: Name of a sound in the prim's inventory, or a UUID.
    - name: volume
      type: number
      comment: Volume level to set, between 0.0 (silent) and 1.0 (loud).
    comment: Plays specified sound once at volume, centered at the object's current
      position but not attached (does not move with the object and cannot be stopped
      or adjusted). Does not affect attached sounds.
  - name: TriggerSoundLimited
    parameters:
    - name: sound
      type: string | uuid
      comment: Name of a sound in the prim's inventory, or a UUID.
    - name: volume
      type: number
      comment: Volume level to set, between 0.0 (silent) and 1.0 (loud).
    - name: top_north_east
      type: vector
      comment: Top-north-east boundary position vector in region coordinates.
    - name: bottom_south_west
      type: vector
      comment: Bottom-south-west boundary position vector in region coordinates.
    comment: Plays the specified sound once at volume, centered at the object but
      not attached, restricted to the axis-aligned bounding box defined by the coordinates
      top_north_east and bottom_south_west.
  - name: UnSit
    parameters:
    - name: id
      type: uuid
      comment: UUID of the avatar to unsit.
    comment: Forces the agent specified by id to stand up if they are sitting on the
      object containing the script, or are currently over land owned by the object's
      owner.
  - name: UnescapeURL
    parameters:
    - name: url
      type: string
      comment: Escaped URL string to decode.
    return-type: string
    comment: Returns a string representing the unescaped/decoded version of url, replacing
      '%20' with spaces and decoding raw UTF-8 characters.
    must-use: true
  - name: UpdateCharacter
    parameters:
    - name: options
      type: list | CharacterParams
      comment: A list of key-value pairs specifying the character's new configuration
        options (takes same constants as llCreateCharacter).
    comment: Updates settings for a pathfinding character using the parameters specified
      in options.
  - name: UpdateKeyValue
    parameters:
    - name: k
      type: string
      comment: Key of the key-value pair to update.
    - name: v
      type: string
      comment: New value for the key-value pair.
    - name: checked
      type: boolean | number
      comment: Boolean. If TRUE, requires the existing value to match original_value
        to complete the update; if FALSE, creates the key if needed.
    - name: original_value
      type: string
      comment: String value to compare against the existing value in the datastore.
    return-type: uuid
    comment: Starts an asynchronous transaction to update the key k to value v inside
      the experience datastore. If checked is TRUE, the update fails with XP_ERROR_RETRY_UPDATE
      unless the existing value matches original_value.
  - name: VecDist
    parameters:
    - name: vec_a
      type: vector
      comment: First vector.
    - name: vec_b
      type: vector
      comment: Second vector.
    return-type: number
    comment: Returns a float representing the undirected, non-negative distance between
      vectors vec_a and vec_b.
    deprecated:
      reason: It's a fastcall.
      use: vector.magnitude
      selene-replace:
      - vector.magnitude(%1 - %2)
    must-use: true
  - name: VecMag
    parameters:
    - name: vec
      type: vector
      comment: Vector to evaluate.
    return-type: number
    comment: Returns the magnitude (geometric length) of vec.
    deprecated:
      reason: It's a fastcall.
      use: vector.magnitude
      selene-replace:
      - vector.magnitude(%1)
    must-use: true
  - name: VecNorm
    parameters:
    - name: vec
      type: vector
      comment: Vector to normalize.
    return-type: vector
    comment: Returns the normalized unit vector pointing the same direction as vec.
      If <0, 0, 0>, return <0, 0, 0>.
    deprecated:
      reason: It's a fastcall.
      use: vector.normalize
      selene-replace:
      - vector.normalize(%1)
    must-use: true
  - name: VerifyRSA
    parameters:
    - name: public_key
      type: string
      comment: PEM-formatted public key to use for signature verification.
    - name: msg
      type: string
      comment: Message string that was signed.
    - name: signature
      type: string
      comment: Base64-encoded signature to verify.
    - name: algorithm
      type: string
      comment: Cryptographic digest algorithm to use.
    return-type: boolean
    comment: Returns TRUE if the Base64-formatted signature is verified as valid for
      the message msg when using the digest algorithm and public_key. Returns FALSE
      otherwise.
    must-use: true
  - name: VolumeDetect
    parameters:
    - name: detect
      type: boolean | number
      comment: Boolean. If TRUE, enables VolumeDetect; if FALSE (default), disables
        it.
    comment: If detect is TRUE, enables VolumeDetect (object becomes phantom and physical
      objects/avatars can pass through it). Triggers collision_start on initial intersection
      and collision_end when intersection stops (standard collision events are suppressed
      while intersecting).
  - name: WanderWithin
    parameters:
    - name: origin
      type: vector
      comment: Center coordinate position vector to wander about.
    - name: dist
      type: vector
      comment: A vector specifying the maximum distance limits (half-extents) along
        each world-aligned axis from the origin.
    - name: options
      type: list | CharacterWanderWithinParams
      comment: A list of WANDER_* flags and parameters to configure the wander behavior.
    comment: Directs a pathfinding character to wander around a central coordinate
      origin, restricted within the bounding distance limits of dist and configured
      by options.
  - name: Water
    parameters:
    - name: offset
      type: vector
      comment: Offset relative to the prim's position, expressed in local coordinates.
    return-type: number
    comment: Returns a float representing the water height directly below the prim's
      position offset by the vector offset.
    must-use: true
  - name: Whisper
    parameters:
    - name: channel
      type: number
      comment: Chat channel (any 32-bit signed integer value) to whisper the message
        on.
    - name: msg
      type: string
      comment: Text message string to broadcast.
    comment: Broadcasts the message msg to all scripts or agents listening on channel
      within llGetEnv("whisper_range"), which is 10m on most regions. Agents listen
      on PUBLIC_CHANNEL (0) and DEBUG_CHANNEL (2147483647). All other channels are
      for script-to-script communication.
  - name: Wind
    parameters:
    - name: offset
      type: vector
      comment: Offset relative to the prim's position, expressed in local coordinates.
    return-type: vector
    comment: Returns a vector representing the wind velocity at the prim's position
      offset by the vector offset.
    must-use: true
  - name: WorldPosToHUD
    parameters:
    - name: world_pos
      type: vector
      comment: World-frame position vector to project into HUD space.
    return-type: vector
    comment: Returns the local position vector that places the center of the HUD object
      directly over the world coordinate world_pos as viewed by the current camera.
      Requires the PERMISSION_TRACK_CAMERA runtime permission.
    must-use: true
  - name: XorBase64
    parameters:
    - name: str1
      type: string
      comment: First Base64 string.
    - name: str2
      type: string
      comment: Second Base64 string (will repeat if shorter than str1).
    return-type: string
    comment: Correctly performs a bitwise exclusive OR (XOR) on Base64 strings str1
      and str2, returning the result as a Base64 string. The string str2 repeats if
      it is shorter than str1.
    must-use: true
  - name: XorBase64Strings
    parameters:
    - name: str1
      type: string
      comment: First Base64 string.
    - name: str2
      type: string
      comment: Second Base64 string (will repeat if shorter than str1).
    return-type: string
    comment: Deprecated (use llXorBase64 instead). Retained for backwards compatibility.
      Incorrectly performs a bitwise exclusive OR (XOR) on Base64 strings str1 and
      str2.
    deprecated:
      use: ll.XorBase64
      selene-replace:
      - ll.XorBase64(%1, %2)
    must-use: true
  - name: XorBase64StringsCorrect
    parameters:
    - name: str1
      type: string
      comment: First Base64 string.
    - name: str2
      type: string
      comment: Second Base64 string (will repeat if shorter than str1).
    return-type: string
    comment: Deprecated (use llXorBase64 instead). Correctly performs (unless nulls
      are present) a bitwise exclusive OR (XOR) on Base64 strings str1 and str2.
    deprecated:
      use: ll.XorBase64
      selene-replace:
      - ll.XorBase64(%1, %2)
    must-use: true
  - name: sRGB2Linear
    parameters:
    - name: color
      type: vector
      comment: Color vector in the sRGB colorspace to convert.
    return-type: vector
    comment: Returns a linear RGB colorspace vector converted from the sRGB colorspace
      argument.
    must-use: true
- name: llcompat
  comment: Like ll, but exactly matches LSL semantics.
  functions:
  - name: Abs
    parameters:
    - name: val
      type: number
      comment: Integer to convert.
    return-type: number
    comment: Returns the absolute (positive) integer value of val.
    deprecated: true
    must-use: true
  - name: Acos
    parameters:
    - name: val
      type: number
      comment: A number in the range [-1.0, 1.0].
    return-type: number
    comment: Returns the arccosine of val in radians.
    deprecated: true
    must-use: true
  - name: AddToLandBanList
    parameters:
    - name: avatar
      type: uuid
      comment: UUID of the avatar to add to the ban list.
    - name: hours
      type: number
      comment: Duration, in hours, to ban the avatar for (0 for indefinite).
    comment: Adds the avatar to the parcel ban list for the specified number of hours.
      A value of 0 hours adds the avatar indefinitely. Banned users teleporting to
      the parcel are redirected to a neighboring parcel; the minimum accepted duration
      is 0.01 hours (approximately 36 seconds).
    deprecated: true
  - name: AddToLandPassList
    parameters:
    - name: avatar
      type: uuid
      comment: UUID of the avatar to add to the pass list.
    - name: hours
      type: number
      comment: Duration, in hours, to allow the avatar for (range [0.0, 144.0], 0
        for indefinite).
    comment: Adds the avatar to the land pass list for the specified number of hours
      (or indefinitely if hours is 0).
    deprecated: true
  - name: AdjustDamage
    parameters:
    - name: number
      type: number
      comment: Index of the damage event to modify.
    - name: new_damage
      type: number
      comment: New damage value to be applied or distributed after on_damage processing.
    comment: (Index semantics) Modifies the amount of damage applied by the current
      on_damage event after it completes processing, specified by the damage event
      index number.
    deprecated: true
  - name: AdjustSoundVolume
    parameters:
    - name: volume
      type: number
      comment: Volume level to set, between 0.0 (silent) and 1.0 (loud).
    comment: Adjusts the volume of the currently playing attached sound (has no effect
      on sounds started with llTriggerSound).
    deprecated: true
  - name: AgentInExperience
    parameters:
    - name: agent
      type: uuid
      comment: UUID of the avatar in the same region to query.
    return-type: number
    comment: Returns TRUE if the specified agent is in the experience and the experience
      can run in the current region/location; returns FALSE otherwise.
    deprecated: true
    must-use: true
  - name: AllowInventoryDrop
    parameters:
    - name: add
      type: boolean | number
      comment: Boolean. If TRUE, allows anyone to drop inventory items into the prim
        (even without modify rights). If FALSE, restricts inventory dropping to those
        with modify permissions.
    comment: If add is TRUE, allows users without object modify permissions to drop
      inventory items into the prim. If FALSE, restricts inventory dropping to users
      with modify permissions.
    deprecated: true
  - name: AngleBetween
    parameters:
    - name: start_rot
      type: quaternion
      comment: Starting rotation.
    - name: end_rot
      type: quaternion
      comment: Ending rotation.
    return-type: number
    comment: Returns the angle, in radians, between rotations start_rot and and end_rot.
    deprecated: true
    must-use: true
  - name: ApplyImpulse
    parameters:
    - name: momentum
      type: vector
      comment: Linear impulse vector to apply.
    - name: is_local
      type: boolean | number
      comment: Boolean. If TRUE, momentum is treated as a local directional vector;
        if FALSE, it is treated as a global region vector.
    comment: Applies a linear impulse (momentum) to a physical object. If local is
      TRUE, the impulse is applied in local coordinates; otherwise, it is applied
      in global region coordinates.
    deprecated: true
  - name: ApplyRotationalImpulse
    parameters:
    - name: force
      type: vector
      comment: Rotational impulse vector to apply.
    - name: is_local
      type: boolean | number
      comment: Boolean. If TRUE, the force is treated as a local directional vector;
        if FALSE, it is treated as a global region vector.
    comment: Applies a rotational impulse (force) to a physical object. If local is
      TRUE, the rotational impulse is applied in local coordinates; otherwise, it
      is applied in global region coordinates.
    deprecated: true
  - name: Asin
    parameters:
    - name: val
      type: number
      comment: A number in the range [-1.0, 1.0].
    return-type: number
    comment: Returns the arcsine of val in radians.
    deprecated: true
    must-use: true
  - name: Atan2
    parameters:
    - name: y
      type: number
      comment: Y coordinate.
    - name: x
      type: number
      comment: X coordinate.
    return-type: number
    comment: 'Returns the arctangent of y/x in radians, using the signs to determine
      the quadrant. Note the argument order: Y is the first parameter, X is the second
      parameter.'
    deprecated: true
    must-use: true
  - name: AttachToAvatar
    parameters:
    - name: attach_point
      type: number
      comment: ATTACH_* constant or integer value representing the target attachment
        point.
    comment: Attaches the object to the avatar who has granted the PERMISSION_ATTACH
      permission. Takes the object into the user's inventory and attaches it at attach_point.
    deprecated: true
  - name: AttachToAvatarTemp
    parameters:
    - name: attach_point
      type: number
      comment: ATTACH_* constant or integer value representing the target attachment
        point.
    comment: Attaches the object temporarily to an avatar who has granted the PERMISSION_ATTACH
      permission. No permanent inventory is created, and the object disappears on
      detach or disconnect. Can be used on non-owners (changing ownership to the wearer).
    deprecated: true
  - name: AvatarOnLinkSitTarget
    parameters:
    - name: link
      type: number
      comment: Index of the prim in the linkset (1 for root, >1 for children), or
        a LINK_* flag.
    return-type: uuid
    comment: Returns the UUID of the avatar seated on the specified link's sit target,
      or NULL_KEY if no avatar is sitting there.
    deprecated: true
    must-use: true
  - name: AvatarOnSitTarget
    return-type: uuid
    comment: Returns the UUID of the avatar seated on the prim's sit target (defined
      via llSitTarget), or NULL_KEY if no avatar is sitting there or the prim lacks
      a sit target.
    deprecated: true
    must-use: true
  - name: Axes2Rot
    parameters:
    - name: fwd
      type: vector
      comment: Forward/back directional vector of the rotation.
    - name: left
      type: vector
      comment: Left/right directional vector of the rotation.
    - name: up
      type: vector
      comment: Up/down directional vector of the rotation.
    return-type: quaternion
    comment: Returns the rotation defined by the coordinate axes fwd, left, and up.
    deprecated: true
    must-use: true
  - name: AxisAngle2Rot
    parameters:
    - name: axis
      type: vector
      comment: Axis vector to rotate around.
    - name: angle
      type: number
      comment: Angle to rotate, in radians.
    return-type: quaternion
    comment: Returns the rotation that rotates angle radians around the axis vector.
    deprecated: true
    must-use: true
  - name: Base64ToInteger
    parameters:
    - name: str
      type: string
      comment: Base64-encoded string to decode.
    return-type: number
    comment: Returns an integer representing the Base64-decoded big-endian value of
      str. Returns zero if str is longer than 8 characters; the return value is unpredictable
      if str contains fewer than 6 characters.
    deprecated: true
    must-use: true
  - name: Base64ToString
    parameters:
    - name: str
      type: string
      comment: Base64-encoded string to decode.
    return-type: string
    comment: Decodes the Base64-encoded string str into a conventional string, interpreting
      the bytes as a UTF-8 character sequence. Unprintable characters are converted
      to question marks.
    deprecated: true
    must-use: true
  - name: BreakAllLinks
    comment: Delinks all prims in the linkset. Requires the PERMISSION_CHANGE_LINKS
      runtime permission, which must be requested and granted by the owner.
    deprecated: true
  - name: BreakLink
    parameters:
    - name: link
      type: number
      comment: 'The link number (0: unlinked, 1: root prim, >1: child prims and seated
        avatars) to delink.'
    comment: Delinks the prim specified by the link number link. Requires the PERMISSION_CHANGE_LINKS
      runtime permission.
    deprecated: true
  - name: CSV2List
    parameters:
    - name: src
      type: string
      comment: String of comma-separated values to parse.
    return-type: '{string}'
    comment: Parses the comma-separated string src and returns it as a list.
    deprecated: true
    must-use: true
  - name: CastRay
    parameters:
    - name: start_pos
      type: vector
      comment: Starting location vector of the ray.
    - name: end_pos
      type: vector
      comment: Ending location vector of the ray.
    - name: options
      type: list
      comment: A list of option flags and their parameters to configure the raycast.
    return-type: '{any}'
    comment: Casts a ray into the physics world from start to end and reports collision
      data for intersections with objects based on options. Returns a list of strided
      values [UUID_1, {link_number_1}, hit_position_1, {hit_normal_1}, ..., status_code].
      A negative status_code indicates an error; otherwise, it represents the number
      of hits.
    deprecated: true
    must-use: true
  - name: Ceil
    parameters:
    - name: val
      type: number
      comment: Number to round up.
    return-type: number
    comment: Returns val rounded toward positive infinity. In other words, returns
      the smallest integer greater than or equal to val.
    deprecated: true
    must-use: true
  - name: Char
    parameters:
    - name: val
      type: number
      comment: Unicode codepoint integer (ordinal) to convert.
    return-type: string
    comment: Constructs and returns a single-character string from the given Unicode
      codepoint ordinal.
    deprecated: true
    must-use: true
  - name: ClearCameraParams
    comment: Resets all camera parameters to default values and turns off scripted
      camera control. Requires the PERMISSION_CONTROL_CAMERA runtime permission (automatically
      granted for attached or sat-on objects).
    deprecated: true
  - name: ClearExperience
    parameters:
    - name: agentid
      type: uuid
    - name: experienceid
      type: uuid
    deprecated: true
  - name: ClearExperiencePermissions
    parameters:
    - name: agentid
      type: uuid
    deprecated: true
  - name: ClearLinkMedia
    parameters:
    - name: link
      type: number
      comment: 'The link number (0: unlinked, 1: root prim, >1: child prims) or a
        LINK_* flag representing the target prim.'
    - name: face
      type: number
      comment: Face number to clear.
    return-type: number
    comment: Deletes the media and clears all parameters from the given face on the
      linked prim. Returns an integer STATUS_* flag detailing the success or failure
      of the operation.
    deprecated: true
  - name: ClearPrimMedia
    parameters:
    - name: face
      type: number
      comment: Face number (side) to clear.
    return-type: number
    comment: Deletes the media and clears all parameters from the specified face.
      Returns an integer STATUS_* flag detailing the success or failure of the operation.
    deprecated: true
  - name: CloseRemoteDataChannel
    parameters:
    - name: channel
      type: uuid
      comment: XML-RPC channel ID to close.
    comment: Deprecated. Closes the specified XML-RPC channel.
    deprecated: true
  - name: Cloud
    parameters:
    - name: offset
      type: vector
      comment: Offset relative to the prim's position, expressed in local coordinates.
    return-type: number
    comment: Returns a float representing the cloud density at the prim's position
      offset by the vector offset.
    deprecated: true
    must-use: true
  - name: CollisionFilter
    parameters:
    - name: name
      type: string
      comment: Specific object name or avatar legacy name to filter for.
    - name: id
      type: uuid
      comment: Group, avatar, or object UUID to filter by.
    - name: accept
      type: boolean | number
      comment: Boolean. If TRUE, only collisions matching the name and id filters
        are processed; if FALSE, matching collisions are excluded.
    comment: Sets the collision filter, either exclusively or inclusively. If accept
      is TRUE, only collisions matching name and id are processed; if FALSE, matches
      are excluded. Pass an empty string or NULL_KEY to name or id to skip filtering
      on that parameter.
    deprecated: true
  - name: CollisionSound
    parameters:
    - name: impact_sound
      type: string | uuid
      comment: UUID of a sound, the name of a sound in the prim's inventory, or an
        empty string to suppress sounds.
    - name: impact_volume
      type: number
      comment: Volume level to set, between 0.0 (silent) and 1.0 (loud).
    comment: Suppresses default collision sounds and replaces default impact sounds
      with impact_sound at the volume level specified by impact_volume. Supply an
      empty string to only suppress collision sounds.
    deprecated: true
  - name: CollisionSprite
    parameters:
    - name: impact_sprite
      type: string | uuid
      comment: UUID of a texture, the name of a texture in the prim's inventory, or
        an empty string to suppress sprites.
    comment: Suppresses default collision sprites and replaces them with impact_sprite
      (which must be in the prim's inventory). Supply an empty string to only suppress
      collision sprites.
    deprecated: true
  - name: ComputeHash
    parameters:
    - name: message
      type: string
      comment: Message string to be hashed.
    - name: algorithm
      type: string
      comment: Cryptographic digest algorithm to use (e.g., md5, sha1, sha224, sha256,
        sha384, or sha512).
    return-type: string
    comment: Returns a hex-encoded hash digest string of message using the specified
      cryptographic algorithm.
    deprecated: true
    must-use: true
  - name: Cos
    parameters:
    - name: theta
      type: number
      comment: Angle in radians.
    return-type: number
    comment: Returns the cosine of theta. Theta is in radians.
    deprecated: true
    must-use: true
  - name: CreateCharacter
    parameters:
    - name: options
      type: list | CharacterParams
      comment: A list of key-value pairs specifying the character's configuration
        options.
    comment: Converts the linkset containing the script into a pathfinding character
      entity (required to use pathfinding functions) using the specified options.
    deprecated: true
  - name: CreateKeyValue
    parameters:
    - name: k
      type: string
      comment: Unique key name for the key-value pair.
    - name: v
      type: string
      comment: Value for the key-value pair (maximum 2047 characters, or 4095 characters
        if using Mono).
    return-type: uuid
    comment: Starts an asynchronous transaction to create a key-value pair (k and
      v) associated with the script's experience. Returns a key query handle for the
      dataserver event. Fails with XP_ERROR_STORAGE_EXCEPTION if the key already exists.
    deprecated: true
  - name: CreateLink
    parameters:
    - name: target
      type: uuid
      comment: UUID of the target prim/object in the same region.
    - name: parent
      type: boolean | number
      comment: Boolean. If TRUE, the script's object becomes the root prim; if FALSE,
        target becomes the root.
    comment: Attempts to link the object containing the script with target. Requires
      the PERMISSION_CHANGE_LINKS runtime permission.
    deprecated: true
  - name: Damage
    parameters:
    - name: target
      type: uuid
      comment: Key of the target avatar or task to receive damage.
    - name: damage
      type: number
      comment: Amount of damage to inflict (can exceed 100, unlike collision-based
        damage).
    - name: damage_type
      type: number
      comment: Type of damage to deliver to the target (can correspond to a DAMAGE_TYPE_*
        constant).
    comment: Generates a damage event delivering the specified amount of damage and
      damage_type to the targeted avatar or task in the same region.
    deprecated: true
  - name: DataSizeKeyValue
    return-type: uuid
    comment: Starts an asynchronous transaction to request the used and total data
      storage allocated for the experience. Returns a key query handle for the dataserver
      event.
    deprecated: true
  - name: DeleteCharacter
    comment: Converts the linkset back to a standard physical object, removing all
      pathfinding properties.
    deprecated: true
  - name: DeleteKeyValue
    parameters:
    - name: k
      type: string
      comment: Key of the key-value pair to delete.
    return-type: uuid
    comment: Starts an asynchronous transaction to delete the key-value pair associated
      with key k in the experience. Returns a key query handle for the dataserver
      event.
    deprecated: true
  - name: DeleteSubList
    type-parameters:
    - T
    parameters:
    - name: src
      type: '{T}'
      comment: Source list to copy and modify.
    - name: start_index
      type: number
      comment: Starting index of the slice to remove (inclusive).
    - name: end_index
      type: number
      comment: Ending index of the slice to remove (inclusive).
    return-type: '{T}'
    comment: Returns a copy of the list src with the slice from start_index to end_index
      (inclusive) removed. Negative indices count backward from the end of the list.
      If start_index is greater than end_index, the deletion excludes the specified
      range.
    deprecated: true
    must-use: true
  - name: DeleteSubString
    parameters:
    - name: src
      type: string
      comment: Source string to modify.
    - name: start_index
      type: number
      comment: Starting codepoint index of the substring to remove (inclusive). Supports
        negative indexing.
    - name: end_index
      type: number
      comment: Ending codepoint index of the substring to remove (inclusive). Supports
        negative indexing.
    return-type: string
    comment: Returns a copy of the string src with the characters from start_index
      to end_index (inclusive) removed. Negative indices count backward from the end
      of the string. If start_index is greater than end_index, the deletion excludes
      the specified range.
    deprecated: true
    must-use: true
  - name: DerezObject
    parameters:
    - name: id
      type: uuid
      comment: UUID of the object in the region to derez.
    - name: flags
      type: number
      comment: Derez behavior flags matching DEREZ_* constants.
    return-type: number
    comment: Derezzes (deletes or returns) a targeted object in the region previously
      rezzed by a script in this linkset, returning TRUE on success or FALSE on failure.
    deprecated: true
  - name: DetachFromAvatar
    comment: Detaches the object containing the script from the avatar. Requires the
      PERMISSION_ATTACH runtime permission (automatically granted to attached objects).
      Note that the detached object is completely removed from the region and not
      dropped on the ground.
    deprecated: true
  - name: DetectedDamage
    parameters:
    - name: number
      type: number
      comment: Index of the detection information.
    return-type: '{any}'
    comment: (Index semantics) Returns a list containing pending damage information
      for the event specified by number, including the current damage, the damage
      type, and the original damage delivered.
    deprecated: true
    must-use: true
  - name: DetectedGrab
    parameters:
    - name: number
      type: number
      comment: Index of the detection information.
    return-type: vector
    comment: (Index semantics) Returns a vector representing the grab offset of the
      user touching the object. Only works in touch events and returns <0.0, 0.0,
      0.0> if number is not a valid index.
    deprecated: true
    must-use: true
  - name: DetectedGroup
    parameters:
    - name: number
      type: number
      comment: Index of the detection information.
    return-type: number
    comment: (Index semantics) Returns TRUE if the detected object or avatar specified
      by number has the same active group as the prim containing the script. Returns
      FALSE if the group is not active or if they are not in the group.
    deprecated: true
    must-use: true
  - name: DetectedKey
    parameters:
    - name: number
      type: number
      comment: Index of the detection information.
    return-type: uuid
    comment: (Index semantics) Returns the key (UUID) of the detected object or avatar
      specified by number, or NULL_KEY if number is not a valid index.
    deprecated: true
    must-use: true
  - name: DetectedLinkNumber
    parameters:
    - name: number
      type: number
      comment: Index of the detection information.
    return-type: number
    comment: (Index semantics) Returns the link number (integer) of the triggered
      event (touches and collisions only) specified by number. Returns 0 for non-linked
      objects, 1 for the root prim, and 2+ for child prims. Returns 0 if not supported
      by the event.
    deprecated: true
    must-use: true
  - name: DetectedName
    parameters:
    - name: item
      type: number
      comment: Index of the detection information.
    return-type: string
    comment: (Index semantics) Returns a string representing the name of the detected
      object or avatar specified by item. Returns an empty string if item is not a
      valid index.
    deprecated: true
    must-use: true
  - name: DetectedOwner
    parameters:
    - name: number
      type: number
      comment: Index of the detection information.
    return-type: uuid
    comment: (Index semantics) Returns the key (UUID) of the owner of the detected
      object specified by number. Returns an invalid key if number is not a valid
      index.
    deprecated: true
    must-use: true
  - name: DetectedPos
    parameters:
    - name: number
      type: number
      comment: Index of the detection information.
    return-type: vector
    comment: (Index semantics) Returns the vector position (in region coordinates)
      of the detected object or avatar specified by number, or <0.0, 0.0, 0.0> if
      number is not a valid index.
    deprecated: true
    must-use: true
  - name: DetectedRezzer
    parameters:
    - name: number
      type: number
      comment: Index of the detection information.
    return-type: uuid
    comment: (Index semantics) Returns the key (UUID) of the object or avatar that
      rezzed the detected object specified by number.
    deprecated: true
    must-use: true
  - name: DetectedRot
    parameters:
    - name: number
      type: number
      comment: Index of the detection information.
    return-type: quaternion
    comment: (Index semantics) Returns the rotation of the detected object or avatar
      specified by number, or <0.0, 0.0, 0.0, 1.0> if number is not a valid offset
      index.
    deprecated: true
    must-use: true
  - name: DetectedTouchBinormal
    parameters:
    - name: index
      type: number
      comment: Index of the detection information.
    return-type: vector
    comment: (Index semantics) Returns the surface binormal vector (tangent to the
      surface, pointing along the positive T (V) direction of tangent space) at the
      touched location specified by index. Can be used with llDetectedTouchNormal
      to determine the tangent space.
    deprecated: true
    must-use: true
  - name: DetectedTouchFace
    parameters:
    - name: index
      type: number
      comment: Index of the detection information.
    return-type: number
    comment: (Index semantics) Returns the integer index of the face clicked by the
      avatar in the touch event specified by index.
    deprecated: true
    must-use: true
  - name: DetectedTouchNormal
    parameters:
    - name: index
      type: number
      comment: Index of the detection information.
    return-type: vector
    comment: (Index semantics) Returns the surface normal vector (perpendicular to
      the surface) at the touched location specified by index. Can be used with llDetectedTouchBinormal
      to determine the tangent space.
    deprecated: true
    must-use: true
  - name: DetectedTouchPos
    parameters:
    - name: index
      type: number
      comment: Index of the detection information.
    return-type: vector
    comment: (Index semantics) Returns the vector position where the object was touched
      (specified by index) in region coordinates, or in screen-space coordinates if
      the object is attached as a HUD.
    deprecated: true
    must-use: true
  - name: DetectedTouchST
    parameters:
    - name: index
      type: number
      comment: Index of the detection information.
    return-type: vector
    comment: (Index semantics) Returns the surface coordinates (<s, t, 0.0>) where
      the prim was touched, specified by index. X and Y contain the horizontal (s)
      and vertical (t) face coordinates, typically in the interval [0.0, 1.0]. Returns
      TOUCH_INVALID_TEXCOORD if coordinates cannot be determined.
    deprecated: true
    must-use: true
  - name: DetectedTouchUV
    parameters:
    - name: index
      type: number
      comment: Index of the detection information.
    return-type: vector
    comment: (Index semantics) Returns the texture coordinates (<u, v, 0.0>) where
      the prim was touched, specified by index. X and Y contain the horizontal (u)
      and vertical (v) texture coordinates, typically in the interval [0.0, 1.0] (affected
      by repeats and rotation). Returns TOUCH_INVALID_TEXCOORD if coordinates cannot
      be determined.
    deprecated: true
    must-use: true
  - name: DetectedType
    parameters:
    - name: number
      type: number
      comment: Index of the detection information.
    return-type: number
    comment: (Index semantics) Returns an integer bitfield representing the types
      (AGENT, ACTIVE, PASSIVE, or SCRIPTED) of the detected object or avatar specified
      by number. Returns 0 if number is not a valid index.
    deprecated: true
    must-use: true
  - name: DetectedVel
    parameters:
    - name: number
